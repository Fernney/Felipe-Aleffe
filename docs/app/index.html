function condicionantesDe(id) { return estado.base.condicionantes.filter((c) => c.ambientalId === id).sort((a, b) => (a.prazo ?? "9").localeCompare(b.prazo ?? "9")); }
function relatoriosDe(id) { return estado.base.relatorios.filter((r) => r.ambientalId === id).sort((a, b) => (a.prevista ?? "9").localeCompare(b.prevista ?? "9")); }
function ehRelevancia(p) { return /relev/i.test(p.extras.tipo ?? ""); }
function processoVinculadoAmb(p) {
  for (const [k, m] of [["gelinId", "gelin"], ["geavaId", "geava"], ["alvaraId", "alvara"]]) {
    const v = p.extras[k] != null ? estado.processoPorChave.get(`${m}:${p.extras[k]}`) : null;
    if (v) return v;
  }
  return null;
}

function paginaAmbiental(selId) {
  const ps = procsDoRecorte("ambiental").sort((a, b) => (nomeTerreno(a.terrenoId) ?? "~").localeCompare(nomeTerreno(b.terrenoId) ?? "~"));
  const lim60 = somaDias(estado.hoje, 60);
  const porId = (id) => ps.find((p) => p.id === id);
  const condVencida = (p) => condicionantesDe(p.id).some((c) => c.prazo && c.prazo < estado.hoje && normalizarStatus(c.status) !== "Concluído");
  const termoVencendo = (p) => p.extras.prazoTermo && p.extras.prazoTermo <= lim60 && !p.extras.reciboDefinitivo;
  const kpis = [
    { id: "and", t: "Em andamento", v: ps.filter((p) => stDe(p) === "Em andamento").length, filtro: (it) => stDe(porId(it.id)) === "Em andamento", sig: icone("m_ambiental") },
    { id: "pend", t: "Pendentes", v: ps.filter((p) => ["Aguardando", "Não iniciado"].includes(stDe(p))).length, filtro: (it) => ["Aguardando", "Não iniciado"].includes(stDe(porId(it.id))), sig: "…" },
    { id: "ok", t: "Concluídos", v: ps.filter((p) => stDe(p) === "Concluído").length, filtro: (it) => stDe(porId(it.id)) === "Concluído", sig: "✓" },
    { id: "termo", t: "Termos vencendo (60 dias)", v: ps.filter(termoVencendo).length, filtro: (it) => termoVencendo(porId(it.id)), sig: "!", alerta: true },
    { id: "cond", t: "Condicionantes vencidas", v: ps.filter(condVencida).length, filtro: (it) => condVencida(porId(it.id)), sig: "!", alerta: true },
  ];
  const p = selId ? estado.processoPorChave.get(`ambiental:${selId}`) : null;
  let detalhe = null, ligarDet = () => {};

    let corpo = "";

        ["Termo de compromisso", e.termoCompensacao ? `Termo ${e.termoCompensacao}${e.prazoTermo ? ` · prazo ${fmtData(e.prazoTermo)}` : ""}` : "Não assinado", "Editar termo", "termo"],
        ["Plantio", e.mudasCompensar ? `${plantadas} de ${e.mudasCompensar} mudas` : `${plantadas} muda(s) plantada(s)`, "Editar plantio", "arboreo"],
        ["Recibo", e.reciboDefinitivo ? `Definitivo em ${fmtData(e.reciboDefinitivo)}` : e.reciboProvisorio ? `Provisório em ${fmtData(e.reciboProvisorio)}` : "Pendente", "Editar recibos", "recibos"],

      corpo = `${faixaAlertas(alertasDe("ambiental", p.id))}
        <div class="rot-mai">Jornada da compensação</div>
        <div class="passos">${passos.map(([tit, sub, acao, modal], i) => { const feito = feitos[i], atual = !feito && i === feitos.indexOf(false); return `<button class="passo ${feito ? "feito" : atual ? "atual" : ""}" ${podeEditar() ? `data-amb-modal="${modal}"` : "disabled"}>
          <span class="circ">${feito ? "✓" : i + 1}</span><img src="${IMG[["geava", "termo", "ambiental", "recibo"][i]]}" alt="" style="width:34px;height:34px;object-fit:contain;border-radius:8px"><b>${tit}</b><span>${esc(sub)}</span>${podeEditar() ? `<span class="acao">${acao} ›</span>` : ""}</button>`; }).join("")}</div>
        <dl class="dl">
          ${campoDl("Tipo de processo", e.tipo)}${campoDl("Status", p.situacao)}${campoDl("Parecer técnico", e.parecer)}${campoDl("Ofício", e.oficio)}
          ${campoDl("Certificado ARA", e.ara)}${campoDl("Projeto de recomposição", e.projetoRecomposicao)}${campoDl("Nº processo", e.numeroProcesso)}
          <div><dt>Processo vinculado</dt><dd>${vinc ? `<a href="${linkPara(`/processos/${vinc.modulo}/${vinc.id}`)}">${esc(MODULOS[vinc.modulo].sigla)} ${esc(vinc.titulo)}</a>` : "—"}</dd></div>
        </dl>
        <div class="caixa destaque"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div class="rot-mai" style="color:var(--p)">Situação atual</div>${podeEditar() ? `<button class="btn peq prim" data-amb-modal="situacao">Atualizar situação</button>` : ""}</div>
          <div style="margin-top:4px"><b>${esc(p.acao ?? "Sem ação registrada")}</b></div>${p.comentarios ? `<div class="mudo" style="white-space:pre-wrap">${esc(p.comentarios)}</div>` : ""}
          <div class="fraco" style="margin-top:6px">Cada atualização também entra na linha do tempo, sem apagar a anterior.</div></div>`;
    } else if (aba === "comp") {
      corpo = `<div class="tiles">
          <div class="tile"><span class="rot-mai">Árvores suprimidas</span><b>${e.arvoresSuprimidas ?? 0}</b></div>
          <div class="tile"><span class="rot-mai">Árvores transplantadas</span><b>${e.arvoresTransplantadas ?? 0}</b></div>

          <div class="tile verde"><span class="rot-mai">Plantio DPEA</span><b>${e.mudasDpea ?? 0}</b><span class="fraco">${e.dataPlantioDpea ? fmtData(e.dataPlantioDpea) : ""}</span></div>
          <div class="tile"><span class="rot-mai">Empresa do plantio</span><b style="font-size:15px">${esc(e.empresaPlantio ?? "—")}</b></div>
        </div>
        ${e.mudasCompensar ? `<div><div class="fraco">Plantadas ${plantadas} de ${e.mudasCompensar} (${Math.min(100, Math.round((plantadas / e.mudasCompensar) * 100))}%)</div><div class="progresso" style="height:10px;margin-top:4px"><i style="width:${Math.min(100, (plantadas / e.mudasCompensar) * 100)}%"></i></div></div>` : ""}
        ${podeEditar() ? `<div class="acoes"><button class="btn" data-amb-modal="arboreo">${icone("editar")} Editar dados arbóreos</button></div>

    } else if (aba === "rel") {
      corpo = `<div class="cabeca"><h3>Relatórios de monitoramento</h3>${podeEditar() ? `<button class="btn prim" data-rel-novo>${icone("mais")} Novo relatório</button>` : ""}</div>
        ${rels.length ? `<div class="tabela-env"><table class="tabela"><thead><tr><th>Relatório</th><th>Condicionante</th><th>Previsto</th><th>Enviado</th><th></th></tr></thead><tbody>

            <td class="num" style="${atras ? "color:var(--perigo);font-weight:700" : ""}">${fmtData(r.prevista)}</td><td class="num">${fmtData(r.real)}</td>
            <td><div class="acoes" style="justify-content:flex-end">${podeEditar() && !r.real ? `<button class="btn peq" data-rel-enviar="${r.id}">Registrar envio</button>` : ""}${podeEditar() ? `<button class="btn peq fant" data-rel-editar="${r.id}">${icone("editar")}</button>` : ""}${ehAdmin() ? `<button class="btn peq fant perigo" data-rel-excluir="${r.id}">${icone("lixo")}</button>` : ""}</div></td></tr>`; }).join("")}
        </tbody></table></div>` : `<div class="vazio">Nenhum relatório cadastrado para este processo.</div>`}`;
    } else if (aba === "cond") {

      $$("[data-cond-status]").forEach((s) => (s.onchange = () => gravar(() => estado.provedor.atualizarItem(LISTAS.condicionantes, Number(s.dataset.condStatus), { cd_status: s.value }), "Status da condicionante atualizado.")));
    };
  }
  const md = mestreDetalhe({
    tela: "ambiental", titulo: "Ambiental · Compensação e relevância", subtitulo: "Termos de compromisso, plantio, recibos, condicionantes e relatórios", imagem: "ambiental",

  aoMontar(() => { md.ligar(); ligarDet(); });

function etapaBaixa(p) { const e = p.extras; return e.programacaoBaixa ? 4 : e.comunicadoTermino ? 3 : p.dataTermino ? 2 : e.inicioObra ? 1 : 0; }
const PROXIMO_BAIXA = [
  "Informar a data de início da obra.",
  "Acompanhar a obra e registrar a data de término.",
  "Protocolar o comunicado de término de obra no Portal de Serviços da PBH.",
  "Acompanhar a vistoria da PBH e a programação da baixa.",
  "Obter a Certidão de Baixa de Construção (habite-se) e anexar ao processo.",
];
function alvarasSemBaixa() {
  const usados = new Set(estado.base.processos.filter((p) => p.modulo === "baixa" && p.extras.alvaraId != null).map((p) => p.extras.alvaraId));
  return estado.recorte.processos.filter((p) => p.modulo === "alvara" && /aprovad/i.test(p.situacao ?? "") && !usados.has(p.id));
}

function paginaBaixa(selId) {
  const f = ft("baixa", { kpi: "", busca: "" });

  const semBaixa = alvarasSemBaixa();
  const porId = (id) => ps.find((p) => p.id === id);
  const kpis = [1, 2, 3, 4].map((n) => ({ id: String(n), t: ETAPAS_BAIXA[n], v: ps.filter((p) => etapaBaixa(p) === n).length, filtro: (it) => etapaBaixa(porId(it.id)) === n, sig: String(n) }));
  kpis.push({ id: "semb", t: "Alvarás aprovados sem baixa", v: semBaixa.length, sig: "+", alerta: true, filtro: () => false });
  const p = selId ? estado.processoPorChave.get(`baixa:${selId}`) : null;
  let detalhe = null, ligarDet = () => {};
  if (p) {

    const et = etapaBaixa(p);
    const alv = p.extras.alvaraId != null ? estado.processoPorChave.get(`alvara:${p.extras.alvaraId}`) : null;
    const datas = [["Início da obra", p.extras.inicioObra], ["Término da obra", p.dataTermino], ["Comunicado de término", p.extras.comunicadoTermino], ["Programação da baixa", p.extras.programacaoBaixa]];
    const corpo = aba === "linha" ? abaLinhaDoTempo(p) : `${faixaAlertas(alertasDe("baixa", p.id))}
      <div class="passos">${datas.map(([n, d], i) => `<div class="passo ${d ? "feito" : i === et ? "atual" : ""}"><span class="circ">${d ? "✓" : i + 1}</span><b>${n}</b><span>${d ? fmtData(d) : "—"}</span></div>`).join("")}</div>
      <dl class="dl">
        <div><dt>Alvará vinculado</dt><dd>${alv ? `<a href="#/licenciamento/alvara/${alv.id}">${esc(alv.extras.numeroAlvara ? `Alvará ${alv.extras.numeroAlvara}` : alv.titulo)}</a>` : "—"}</dd></div>
        ${campoDl("Requerimento", p.extras.requerimento)}${campoDl("Protocolo", p.extras.protocolo)}${campoDl("Situação", p.situacao)}
        ${campoDl("Data limite para protocolo", p.dataLimiteProtocolo && fmtData(p.dataLimiteProtocolo))}${campoDl("Previsão de retorno", p.previsaoRetorno && fmtData(p.previsaoRetorno))}
        ${p.comentarios ? campoDl("Observações", p.comentarios, true) : ""}
      </dl>
      <div class="caixa"><div class="rot-mai">Próximo passo</div><div style="margin-top:4px"><b>${esc(PROXIMO_BAIXA[et])}</b></div></div>
      ${cartaoUltima("baixa", p)}`;
    detalhe = `${cabDetalhe({ selos: `${selosProcesso(p)} <span class="selo sem s-Em-andamento">${esc(ETAPAS_BAIXA[et])}</span>`, titulo: p.titulo, sub: subTerreno(p), botoes: botoesProcesso(p),
      abas: [["dados", "Dados da baixa"], ["linha", "Linha do tempo", andamentosDe("baixa", p.id).length]], abaAtiva: aba })}<div class="corpo-det">${corpo}</div>`;
    ligarDet = () => { ligarAbas(); ligarBotoesProcesso(p, "#/baixa"); };
  }
  const antes = f.kpi === "semb" ? `<div class="cartao"><div class="titulo"><h3>Alvarás aprovados sem baixa (${semBaixa.length})</h3><span class="fraco">Clique para iniciar a baixa</span></div>
    <div class="corpo" style="display:grid;gap:8px">${semBaixa.map((a) => `<button class="item-lista" style="border:1px solid var(--linha);background:var(--cartao);text-align:left;cursor:pointer;font:inherit" data-baixa-alv="${a.id}"><div class="tx"><b>${esc(nomeTerreno(a.terrenoId) ?? "Sem terreno")}</b><span>Alvará ${esc(a.extras.numeroAlvara ?? "s/ nº")} · ${esc(a.titulo)}</span></div>${icone("mais")}</button>`).join("") || `<div class="vazio">Todos os alvarás aprovados já têm baixa.</div>`}</div></div>` : "";
  const md = mestreDetalhe({
    tela: "baixa", titulo: "Baixa de construção · Certidão de baixa (habite-se)", subtitulo: "As 4 datas definem a etapa da baixa automaticamente", imagem: "baixa",

    detalhe, vazioLista: "Nenhuma baixa encontrada. Ajuste a busca, o filtro de concessionária ou o card de etapa.",
  });
  aoMontar(() => { md.ligar(); ligarDet(); $$("[data-baixa-alv]").forEach((b) => (b.onclick = () => modalProcesso("baixa", null, null, { alvaraId: Number(b.dataset.baixaAlv) }))); });
  return md.html;
}

const ETAPAS_FLUXO = [
  [1, "Terreno", "#737373"], [2, "Parcelamento", "#5E9F63"], [3, "Licenças p/ o alvará", "#3266AF"], [4, "Após o alvará", "#D09354"],
  [5, "Compensação (GEAVA)", "#12A9A2"], [6, "Relevância (GELIN)", "#A4679B"], [7, "Baixa de construção", "#0D5A55"], [8, "Regularizado", "#2B2530"],
];
const PERGUNTAS_FLUXO = [
  ["parcelado", "O terreno já está parcelado?"], ["armbh", "Necessita de anuência metropolitana (ARMBH)?"], ["cultural", "Lote em área de proteção cultural?"],
  ["altura", "Supera a altura limite (CINDACTA)?"], ["relevancia", "Lote em área de relevância ambiental? (ramo GELIN)"], ["supressao", "Possui supressão de vegetação? (ramo GEAVA)"],
  ["movTerra", "Possui movimentação de terra?"], ["eas", "É estabelecimento de saúde (EAS)?"],
];

function statusFluxo(ref, aplica, existe, sit) {
  if (ref) return "Referência";
  if (!aplica) return "Não se aplica";
  if (!existe || !sit) return "Não iniciado";
  if (["Aprovado", "Concluído", "Concluída", "Finalizado", "Cumprida", "Dispensado", "Emitido", "Deferido"].includes(sit)) return "Concluído";
  if (["Reprovado", "Cancelado", "Indeferido"].includes(sit)) return "Bloqueado";
  if (["Não Iniciada", "Não iniciado", "A iniciar"].includes(sit)) return "Não iniciado";
  return "Em andamento";
}

/** Monta as 21 etapas do fluxo para um terreno (ou a referência, sem terreno). */
function montarFluxo(tid) {
  const ref = tid == null;
  const fl = ref ? null : estado.base.fluxos.find((f) => f.terrenoId === tid);
  const R = (k) => fl?.[k] === "Sim";
  const procs = ref ? [] : estado.base.processos.filter((p) => p.terrenoId === tid);
  const um = (m, filtro = () => true) => procs.find((p) => p.modulo === m && filtro(p)) ?? null;
  const rParc = um("parcelamento");
  const rArmbh = rParc ? estado.base.processos.find((p) => p.modulo === "armbh" && p.extras.parcelamentoId === rParc.id) ?? null : null;
  const rIbed = ref ? null : estado.base.lotes.find((l) => l.terrenoId === tid) ?? null;
  const rDipc = um("dipc"), rCind = um("cindacta"), rGelin = um("gelin"), rGeava = um("geava"), rAmtt = um("amtt"), rAlv = um("alvara");
  const outro = (s) => um("outros", (p) => new RegExp(s, "i").test(`${p.titulo} ${p.extras.processo ?? ""}`));
  const rViab = outro("Viabilidade"), rPgrss = outro("PGRSS"), rVisa = outro("VISA");
  const rComp = um("ambiental", (p) => /compensa/i.test(p.extras.tipo ?? ""));
  const rRel = um("ambiental", (p) => /relev/i.test(p.extras.tipo ?? ""));
  const rBaixa = um("baixa");
  const conds = rRel ? condicionantesDe(rRel.id) : [], rels = rRel ? relatoriosDe(rRel.id) : [];
  const cOk = conds.filter((c) => /cumprid/i.test(c.status ?? "")).length, rOk = rels.filter((r) => r.real).length;
  const plant = (a) => (Number(a?.extras.mudasGelin) || 0) + (Number(a?.extras.mudasDpea) || 0);
  const sitPlantio = (a) => (!a ? "" : a.extras.reciboDefinitivo ? "Concluído" : a.extras.reciboProvisorio || plant(a) > 0 ? "Em andamento" : "Não Iniciada");
  const no = (etapa, cod, titulo, orgao, modulo, descricao, aplica, reg, sit, referencia = "") => {
    const [, nome, cor] = ETAPAS_FLUXO[etapa - 1];
    const existe = !!reg;
    return { etapa, etapaNome: nome, cor, cod, titulo, orgao, modulo, descricao, aplica: ref || aplica || existe, existe, reg, status: statusFluxo(ref, ref || aplica || existe, existe, sit), referencia };
  };
  const nos = [
    no(1, "T1", "Terreno disponível", "Interno", "terrenos", "Ponto de partida do processo. Cadastrar o terreno e verificar se ele já está parcelado.", true, { id: tid }, "Concluído"),
    no(2, "P1", "Parcelamento do solo", "PBH", "parcelamento", "Solicitar diretrizes de parcelamento, elaborar projeto urbanístico, solicitar EPP, análise e aprovação do projeto e aguardar as certidões de origem.", !R("parcelado"), rParc, rParc?.situacao, rParc?.titulo),
    no(2, "P2", "Anuência metropolitana (ARMBH)", "ARMBH", "armbh", "Solicitar diretrizes da ARMBH, aprovar o projeto urbanístico e solicitar a anuência metropolitana.", !R("parcelado") && R("armbh"), rArmbh, rArmbh ? (rArmbh.extras.numeroAnuencia ? "Concluído" : "Em andamento") : "", rArmbh?.titulo),
    no(3, "A1", "IBED e levantamentos", "PBH", "ibed", "Solicitar a IBED, realizar levantamentos topográfico, arbóreo e sondagem e elaborar os projetos simplificado, de supressão e de terraplenagem.", true, rIbed, rIbed ? "Concluído" : ""),
    no(3, "A2", "Proteção cultural (DIPC)", "DIPC", "dipc", "Lote em área de proteção cultural: se for necessário flexibilizar diretrizes, solicitar análise da cultura e aguardar o parecer.", R("cultural"), rDipc, rDipc?.situacao, rDipc?.titulo),
    no(3, "A3", "Espaço aéreo (CINDACTA)", "COMAER / DECEA", "cindacta", "Altura limite superada: solicitar pré-análise. Se for necessário abrir processo, protocolar e solicitar análise do DECEA; senão, aguardar a dispensa.", R("altura"), rCind, rCind?.situacao, rCind?.titulo),
    no(3, "A4", "Licença ambiental (GELIN)", "GELIN", "gelin", "Área de relevância ambiental: solicitar a licença (autorização para ocupação). A licença gera as condicionantes acompanhadas depois do alvará, no ramo Relevância (GELIN).", R("relevancia"), rGelin, rGelin?.situacao, rGelin?.titulo),
    no(3, "A5", "Intervenção em vegetação (GEAVA)", "GEAVA", "geava", "Fora de relevância ambiental e com supressão: solicitar a análise de intervenção em vegetação e a autorização de supressão. A supressão gera a compensação arbórea acompanhada depois do alvará.", !R("relevancia") && R("supressao"), rGeava, rGeava?.situacao, rGeava?.titulo),
    no(3, "A6", "Movimentação de terra (AMTT / GELIOC)", "GELIN / GELIOC", "amtt", "Com movimentação de terra: solicitar AMTT (área de relevância) ou autorização para tráfego de terra e entulho (GELIOC).", R("movTerra"), rAmtt, rAmtt?.situacao, rAmtt?.titulo),
    no(3, "A7", "Emissão do alvará", "PBH", "alvara", "Com proteção cultural, espaço aéreo e licenças ambientais atendidos, solicitar o alvará no Portal de Edificações.", true, rAlv, rAlv?.situacao, rAlv?.extras.numeroAlvara ?? rAlv?.titulo),
    no(4, "O1", "Consulta de viabilidade", "PBH", "outros", "Solicitar consulta de viabilidade (consulta prévia) e a dispensa de licenciamento ambiental.", true, rViab, rViab?.situacao, rViab?.titulo),
    no(4, "O2", "Aprovação do PGRSS", "PBH", "outros", "Solicitar a aprovação do PGRSS. Aplicável apenas a estabelecimentos da área da saúde (EAS).", R("eas"), rPgrss, rPgrss?.situacao, rPgrss?.titulo),
    no(4, "O3", "Aprovação da VISA", "Vigilância Sanitária", "outros", "Submeter o projeto à aprovação da VISA. Aplicável apenas a estabelecimentos da área da saúde (EAS).", R("eas"), rVisa, rVisa?.situacao, rVisa?.titulo),
    no(5, "C1", "Processo de compensação arbórea", "GEAVA / SMMA", "ambiental", "Supressão autorizada pela GEAVA: abrir o processo de compensação (tipo Compensação na tela Ambiental), com parecer técnico, autorização de supressão e mudas a compensar.", R("supressao") && !R("relevancia"), rComp, rComp?.situacao, rComp?.extras.parecer),
    no(5, "C2", "Termo de compromisso", "SMMA", "ambiental", "Assinar o termo de compromisso de compensação. O prazo para cumprimento é de 6 meses a partir da assinatura.", R("supressao") && !R("relevancia"), rComp,
      !rComp ? "" : rComp.extras.reciboDefinitivo ? "Concluído" : rComp.extras.termoCompensacao ? "Em andamento" : "Não Iniciada", rComp?.extras.termoCompensacao ? `Termo ${rComp.extras.termoCompensacao}${rComp.extras.prazoTermo ? ` · prazo ${fmtData(rComp.extras.prazoTermo)}` : ""}` : ""),
    no(5, "C3", "Plantio compensatório e recibos", "SMMA / DPEA", "ambiental", "Realizar o plantio das mudas, solicitar vistoria e recibo provisório; após 6 meses de manutenção, solicitar vistoria e o recibo definitivo.", R("supressao") && !R("relevancia"), rComp, sitPlantio(rComp), rComp?.extras.mudasCompensar ? `${plant(rComp)} de ${rComp.extras.mudasCompensar} mudas` : ""),
    no(6, "R1", "Condicionantes da licença", "GELIN", "ambiental", "Cumprir as condicionantes da licença ambiental (processo do tipo Relevância Ambiental na tela Ambiental), dentro de cada prazo.", R("relevancia"), rRel,
      !rRel ? "" : !conds.length ? "Não Iniciada" : cOk === conds.length ? "Concluído" : "Em andamento", conds.length ? `${cOk} de ${conds.length} cumpridas` : ""),
    no(6, "R2", "Relatórios de monitoramento", "GELIN", "ambiental", "Enviar os relatórios de monitoramento previstos nas condicionantes, nas datas programadas.", R("relevancia"), rRel,
      !rRel ? "" : !rels.length ? "Não Iniciada" : rOk === rels.length ? "Concluído" : "Em andamento", rels.length ? `${rOk} de ${rels.length} enviados` : ""),
    no(6, "R3", "Plantios (DPEA/TCCA) e recibos", "GELIN / DPEA", "ambiental", "Realizar os plantios exigidos na licença (DPEA/TCCA), solicitar vistoria, recibo provisório e, após a manutenção, o recibo definitivo.", R("relevancia"), rRel, sitPlantio(rRel), rRel?.extras.mudasCompensar ? `${plant(rRel)} de ${rRel.extras.mudasCompensar} mudas` : ""),
    no(7, "B1", "Baixa de construção (habite-se)", "PBH", "baixa", "Comunicar o término de obra, acompanhar a vistoria e obter a Certidão de Baixa de Construção.", true, rBaixa, rBaixa ? statusProcesso(rBaixa, estado.hoje) === "Concluído" ? "Concluído" : rBaixa.situacao || "Em andamento" : "", rBaixa?.titulo),
  ];
  const pendentes = nos.filter((n) => n.aplica && n.status !== "Concluído").length;
  nos.push({ etapa: 8, etapaNome: "Regularizado", cor: "#2B2530", cod: "FIM", titulo: "Empreendimento regularizado", orgao: "-", modulo: "", descricao: "Todas as etapas aplicáveis concluídas: o empreendimento está regularizado.", aplica: true, existe: !pendentes && !ref, status: ref ? "Referência" : pendentes ? "Não iniciado" : "Concluído", referencia: pendentes && !ref ? `${pendentes} etapa(s) pendente(s)` : "" });
  return { nos, fluxo: fl, pendentes };
}

function linkModuloFluxo(n, tid) {
  const r = n.reg;
  switch (n.modulo) {
    case "terrenos": return tid ? `#/terrenos/${tid}` : "#/terrenos";
    case "ibed": return tid ? `#/terrenos/${tid}?aba=ibed` : "#/terrenos";
    case "parcelamento": return r ? `#/parcelamento/${r.id}` : "#/parcelamento";
    case "armbh": return r ? linkPara(`/processos/armbh/${r.id}`) : "#/parcelamento";
    case "ambiental": return r ? `#/ambiental/${r.id}` : "#/ambiental";
    case "baixa": return r ? `#/baixa/${r.id}` : "#/baixa";
    case "": return "";
    default: return r ? `#/licenciamento/${n.modulo}/${r.id}` : `#/licenciamento/${n.modulo}`;
  }
}

function paginaFluxograma(tid) {
  const f = ft("fluxo", { sel: null, etapa: null });
  const aba = rota().q.get("aba") || "detalhe";
  const t = tid != null ? estado.terrenoPorId.get(tid) : null;
  const { nos, fluxo, pendentes } = montarFluxo(t ? t.id : null);
  const visiveis = f.etapa ? nos.filter((n) => n.etapa === f.etapa) : nos;
  const sel = nos.find((n) => n.cod === f.sel) ?? null;
  const prox = nos.find((n) => n.aplica && n.status !== "Concluído" && n.cod !== "FIM");
  const ts = [...estado.recorte.terrenos].sort((a, b) => a.nome.localeCompare(b.nome));
  const resp = { ...(fluxo ?? {}) };

  aoMontar(() => {
    ligarAbas();
    $("#fx-terreno").onchange = (e) => { f.sel = null; f.etapa = null; ir(e.target.value ? `#/fluxograma/${e.target.value}` : "#/fluxograma"); };
    $$("[data-etapa]").forEach((b) => (b.onclick = () => { const n = Number(b.dataset.etapa); f.etapa = f.etapa === n ? null : n; render(); }));
    $$("[data-no]").forEach((b) => (b.onclick = () => { f.sel = b.dataset.no; if (aba !== "detalhe") irComParam("aba", "detalhe"); else render(); }));
    if ($("#fx-perguntas")) $$(".simnao", $("#fx-perguntas")).forEach((g) => g.addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      resp[g.dataset.q] = b.dataset.v;
      $$("button", g).forEach((x) => x.classList.toggle("ativo", x === b));
    }));
    $("#fx-salvar")?.addEventListener("click", async () => {
      const falta = PERGUNTAS_FLUXO.filter(([k]) => !resp[k]);
      if (falta.length) { aviso(`Responda todas as perguntas (faltam ${falta.length}).`, "erro"); return; }
      await gravar(() => estado.provedor.salvarFluxo({ id: fluxo?.id ?? null, terrenoId: t.id, ...Object.fromEntries(PERGUNTAS_FLUXO.map(([k]) => [k, resp[k]])) }), "Respostas salvas. O fluxo foi recalculado.");
    });
    $("#fx-abrir-novo")?.addEventListener("click", (e) => modalProcesso(e.currentTarget.dataset.mod, null, t.id));
  });

  const det = sel ? `
    <div class="caixa" style="border-left:4px solid ${sel.cor}"><div class="fraco">${esc(sel.etapaNome)} · ${esc(sel.cod)} · ${esc(sel.orgao)}</div><h2 style="margin-top:2px">${esc(sel.titulo)}</h2>
      <div style="margin-top:6px">${seloStatus(sel.status)}</div></div>
    <div><div class="rot-mai">O que fazer nesta etapa</div><p style="margin:6px 0 0">${esc(sel.descricao)}</p></div>
    ${sel.etapa === 5 || sel.etapa === 6 ? `<div class="faixa-alerta info">${icone("m_ambiental")}<div>${sel.etapa === 5 ? "Ramo GEAVA: supressão fora de área de relevância → compensação arbórea." : "Ramo GELIN: área de relevância ambiental → licença com condicionantes."}</div></div>` : ""}
    ${sel.status === "Não se aplica" ? `<div class="faixa-alerta media">${icone("alerta")}<div>Esta etapa não se aplica pelas respostas da aba Perguntas do fluxo. Se precisar, altere a resposta e salve.</div></div>` : ""}
    ${sel.referencia ? `<div><div class="rot-mai">Referência</div><div style="margin-top:4px"><b>${esc(sel.referencia)}</b></div></div>` : ""}
    <div class="acoes">${linkModuloFluxo(sel, t?.id) ? `<a class="btn prim" href="${linkModuloFluxo(sel, t?.id)}">${icone("externo")} Abrir módulo</a>` : ""}
      ${t && sel.aplica && !sel.existe && MODULOS[sel.modulo] && podeEditar() ? `<button class="btn" id="fx-abrir-novo" data-mod="${sel.modulo}">${icone("mais")} Abrir processo</button>` : ""}</div>`

  return `Bloqueado pelo fluxograma: para ${nomeTerreno(terrenoId)} o processo ${MODULOS[modulo].nome} não se aplica (${motivo}). Revise as respostas no Fluxograma se isso mudou.`;

      case "alvaraBaixa": {

        const alvs = estado.base.processos.filter((x) => x.modulo === "alvara" && ((SIT_CONCLUIDA.test(x.situacao ?? "") && !usados.has(x.id)) || x.id === v));
        return `<div class="largo">${campoSelectId(c.k, c.rot, alvs.map((a) => [a.id, `${nomeTerreno(a.terrenoId) ?? "Sem terreno"}  ·  Alvará ${a.extras.numeroAlvara ?? "s/ nº"}`]), v, { obrig: true, vazio: "— selecione o alvará aprovado —" })}</div>`;

      await estado.provedor.atualizarProcesso(modulo, p.id, dados);
      const mud = [];
      if ((p.situacao ?? null) !== (dados.situacao ?? null) && "situacao" in dados) mud.push(`Situação alterada de "${p.situacao ?? "—"}" para "${dados.situacao ?? "—"}"`);
      const rotDatas = { dataLimiteProtocolo: "Limite de protocolo", previsaoRetorno: "Previsão de retorno", dataTermino: "Término", dataInicio: "Início" };
      for (const [k, rot] of Object.entries(rotDatas)) if (k in dados && (p[k] ?? null) !== (dados[k] ?? null)) mud.push(`${rot}: ${fmtData(p[k])} → ${fmtData(dados[k])}`);
      for (const [k, x] of Object.entries(dados.extras)) {
        const e = def.extras.find((y) => y.chave === k);
        if (e?.tipo === "data" && (p.extras[k] ?? null) !== (x ?? null)) mud.push(`${e.rotulo}: ${fmtData(p.extras[k])} → ${fmtData(x)}`);
      }
      if (mud.length) {
        const sit = mud[0].startsWith("Situação");
        try { await estado.provedor.registrarAndamento({ modulo, processoId: p.id, acao: sit ? mud[0] : "Cadastro atualizado", comentario: mud.slice(sit ? 1 : 0).join("\n") || null, prazoAtendimento: null }, estado.usuario); } catch { /* módulo sem linha do tempo */ }
      }
    }, "Processo salvo.");
  });
}

const ACOES_SUGERIDAS = ["SPE atendendo pendências", "Protocolo realizado", "Exigência recebida", "Resposta à exigência enviada", "Reunião com o órgão", "Vistoria realizada", "Documento emitido", "Aguardando retorno do órgão", "Pendência identificada", "Prazo combinado", "Protocolado comunicado de término"];

      <label class="rot largo">Comentários<textarea class="campo" name="comentario" placeholder="Descreva a pendência ou atualização…"></textarea></label>

      ${def.sp.situacao ? `<label class="rot">Atualizar a situação também?<select class="campo" name="novaSituacao"><option value="">Manter "${esc(p.situacao ?? "—")}"</option></select></label>` : ""}
    </div>`;
  const m = abrirModal({ titulo: "Nova atualização", corpo, largura: 640, rodape: botaoSalvar("Salvar") });
  const sel = m.querySelector('[name="novaSituacao"]');
  if (sel) {
    const ops = (await estado.provedor.opcoes(listaDoModulo(p.modulo), def.sp.situacao)) ?? [...SITUACOES];
    sel.insertAdjacentHTML("beforeend", ops.filter((o) => o !== p.situacao).map((o) => `<option>${esc(o)}</option>`).join(""));
  }
  aoSalvar(m, (v) => gravar(async () => {
    await estado.provedor.registrarAndamento({ modulo: p.modulo, processoId: p.id, acao: v.acao, comentario: v.comentario, prazoAtendimento: v.prazoAtendimento }, estado.usuario);
    if (v.novaSituacao) {
      await estado.provedor.atualizarProcesso(p.modulo, p.id, { situacao: v.novaSituacao });
      await estado.provedor.registrarAndamento({ modulo: p.modulo, processoId: p.id, acao: `Situação alterada de "${p.situacao ?? "—"}" para "${v.novaSituacao}"`, comentario: null, prazoAtendimento: null }, estado.usuario);
    } else {
      await estado.provedor.atualizarProcesso(p.modulo, p.id, {}); // só renova a data de atualização
    }
  }, "Atualização registrada."));
}

// ---------- terreno (cadastro em 2 etapas: dados → endereço) ----------
async function modalTerreno(t, etapaInicial = 1) {
  if (!podeEditar()) { aviso("Seu perfil é somente consulta.", "erro"); return; }
  const novo = !t;
  const [opUnid, opFase, opOrigem, opUf, colsT] = await Promise.all([
    estado.provedor.opcoes(LISTAS.terrenos, TERRENO_SP.unidade), estado.provedor.opcoes(LISTAS.terrenos, TERRENO_SP.fase),
    estado.provedor.opcoes(LISTAS.terrenos, TERRENO_SP.origemDemanda), estado.provedor.opcoes(LISTAS.enderecos, "cd_uf"), estado.provedor.colunas(LISTAS.terrenos),
  ]);
  const respPessoa = colsT[TERRENO_SP.responsavel]?.tipo === "pessoa";
  const e = t?.endereco ?? {};
  const dados = {
    nome: t?.nome ?? "", unidade: t?.unidadeTexto ?? t?.unidade ?? (estado.filtro === "inova" ? "INOVA BH" : estado.filtro === "saude" ? "SAÚDE BH" : null),
    fase: t?.fase, origemDemanda: t?.origemDemanda, responsavel: t?.responsavel, dataDisponibilidade: t?.dataDisponibilidade, prazoLiberacao: t?.prazoLiberacao, previsaoEntrega: t?.previsaoEntrega,
  };
  const end = { logradouro: e.logradouro, numero: e.numero, complemento: e.complemento, bairro: e.bairro, cidade: e.cidade ?? (novo ? "Belo Horizonte" : null), uf: e.uf ?? (novo ? "MG" : null), cep: e.cep };
  let etapa = etapaInicial;
  const desenhar = () => {
    const corpo = `
      <div class="passos" style="margin-bottom:16px">${["1 · Dados do terreno", "2 · Endereço"].map((n, i) => `<div class="passo ${i + 1 < etapa ? "feito" : i + 1 === etapa ? "atual" : ""}"><span class="circ">${i + 1 < etapa ? "✓" : i + 1}</span><b>${n}</b></div>`).join("")}</div>
      ${etapa === 1 ? `<div class="form">
        <div class="largo">${campoTexto("nome", "Nome do terreno", dados.nome, 'placeholder="Ex.: EMEI Jardim Leblon"', true)}</div>
        ${campoSelect("unidade", "Concessionária", opUnid ?? ["INOVA BH", "SAÚDE BH"], dados.unidade, { obrig: true })}
        ${campoSelect("origemDemanda", "Origem da demanda", opOrigem ?? ORIGENS_PADRAO, dados.origemDemanda, { obrig: true })}
        ${opFase ? campoSelect("fase", "Fase do empreendimento", opFase, dados.fase) : campoTexto("fase", "Fase do empreendimento", dados.fase)}
        ${respPessoa ? `<label class="rot">Responsável<input class="campo" value="${esc(dados.responsavel ?? "")}" disabled><span class="fraco" style="font-weight:400">Campo de pessoa: altere direto na lista Terrenos.</span></label>` : campoTexto("responsavel", "Responsável", dados.responsavel)}
        ${campoData("dataDisponibilidade", "Data de disponibilidade", dados.dataDisponibilidade)}
        ${campoData("prazoLiberacao", "Prazo de liberação", dados.prazoLiberacao)}
        ${campoData("previsaoEntrega", "Previsão de entrega da obra", dados.previsaoEntrega)}
      </div>` : `<div class="form">
        <div class="largo">${campoTexto("logradouro", "Logradouro", end.logradouro, "", true)}</div>
        ${campoTexto("numero", "Número", end.numero, 'type="number"')}${campoTexto("complemento", "Complemento", end.complemento)}
        ${campoTexto("bairro", "Bairro", end.bairro, "", true)}${campoTexto("cep", "CEP", end.cep, 'placeholder="00000-000"')}
        ${campoTexto("cidade", "Cidade", end.cidade, "", true)}${campoSelect("uf", "UF", opUf ?? ["MG", "SP", "RJ", "ES", "BA", "GO", "DF"], end.uf, { obrig: true })}
      </div>`}`;
    const rod = etapa === 1
      ? `<button class="btn" data-fechar>Cancelar</button>${novo ? `<button class="btn prim" data-x="prox">Próximo →</button>` : `<button class="btn" data-x="prox">Editar endereço →</button><button class="btn prim" data-x="salvar">Salvar</button>`}`
      : `<button class="btn" data-x="volta">← Voltar</button>${novo ? `<button class="btn" data-x="pular">Salvar sem endereço</button>` : ""}<button class="btn prim" data-x="salvar">Salvar</button>`;
    const m = abrirModal({ titulo: novo ? "Novo terreno" : `Editar · ${t.nome}`, corpo, largura: 720, rodape: rod });
    const guardar = () => { const v = lerForm(m); if (etapa === 1) Object.assign(dados, v); else Object.assign(end, v); };
    const valida = () => { const ob = [...m.querySelectorAll("[required]")].find((el) => !el.value.trim()); if (ob) { ob.focus(); aviso("Preencha os campos obrigatórios (*).", "erro"); return false; } return true; };
    m.querySelector('[data-x="prox"]')?.addEventListener("click", () => {
      if (!valida()) return; guardar();
      if (estado.base.terrenos.some((x) => x.id !== t?.id && chaveNome(x.nome) === chaveNome(dados.nome))) { aviso("Já existe um terreno com esse nome.", "erro"); return; }
      etapa = 2; desenhar();
    });
    m.querySelector('[data-x="volta"]')?.addEventListener("click", () => { guardar(); etapa = 1; desenhar(); });
    const salvar = async (comEndereco) => {
      if (comEndereco && !valida()) return;
      guardar();
      if (!dados.nome) { aviso("Informe o nome do terreno.", "erro"); return; }
      if (estado.base.terrenos.some((x) => x.id !== t?.id && chaveNome(x.nome) === chaveNome(dados.nome))) { aviso("Já existe um terreno com esse nome.", "erro"); return; }
      let id;
      const ok = await gravar(async () => {
        id = await estado.provedor.salvarTerreno({ id: t?.id, ...dados, ...(respPessoa ? { responsavel: undefined } : {}), endereco: comEndereco ? { ...end, ...(e._id ? { _id: e._id } : {}) } : undefined });
      }, novo ? "Terreno cadastrado. Agora responda as perguntas do fluxograma." : "Terreno atualizado.");
      if (ok) { fecharModal(); if (novo) ir(`#/fluxograma/${id}?aba=perguntas`); }
    };
    m.querySelector('[data-x="salvar"]')?.addEventListener("click", () => salvar(etapa === 2));
    m.querySelector('[data-x="pular"]')?.addEventListener("click", () => salvar(false));
  };
  desenhar();
}

/** Salva dados do processo ambiental e registra na linha do tempo as datas/quantidades que mudaram. */
function salvarAmb(p, alt, msg, rastrear = []) {
  return gravar(async () => {
    await estado.provedor.atualizarProcesso("ambiental", p.id, alt);
    const mud = rastrear.filter(([k]) => k in alt.extras && String(p.extras[k] ?? "") !== String(alt.extras[k] ?? "")).map(([k, rot]) => `${rot}: ${/data|recibo|prazo|assinatura/i.test(k) ? `${fmtData(p.extras[k])} → ${fmtData(alt.extras[k])}` : `${p.extras[k] ?? "—"} → ${alt.extras[k] ?? "—"}`}`);
    if (mud.length) { try { await estado.provedor.registrarAndamento({ modulo: "ambiental", processoId: p.id, acao: `Atualização: ${msg.replace(/ salv[oa]s?\.$/, "")}`, comentario: mud.join("\n"), prazoAtendimento: null }, estado.usuario); } catch { /* sem vínculo para linha do tempo */ } }
  }, msg);
}

}

  const recentes = [...estado.recorte.andamentos].sort((a, b) => b.data.localeCompare(a.data)).slice(0, 7);
  const criticos = estado.alertas.filter((a) => a.alta).slice(0, 5);
  const filtroTxt = [f.conc, f.unidade, f.fase].filter(Boolean).join(" · ");
  const concTxt = estado.filtro === "todas" ? "todas as concessionárias" : nomeMarca();

  aoMontar(() => {
    $$("[data-kpi-vu]").forEach((b) => (b.onclick = () => { f.fase = f.fase === b.dataset.kpiVu ? "" : b.dataset.kpiVu; f.conc = ""; f.unidade = ""; render(); }));

    inp.oninput = filtrar; if (f.busca) filtrar();
  });

  return `

    <div class="cabeca">
      <div><h1>${tituloComImagem("inicio", `${saudacao()}, ${primeiroNome()}`)}</h1><p class="mudo">${linhas.length} terrenos · ${esc(concTxt)} · dados de ${esc(fmtDataHora(estado.carregadoEm))}</p></div>
      <div class="acoes"><button class="btn" id="vu-limpar">${icone("limpar")} Limpar</button><button class="btn" data-acao="atualizar">${icone("atualizar")} Atualizar</button>

    <div class="grade ${estado.filtro === "todas" ? "g2" : ""}">
      ${estado.filtro !== "saude" ? tabelaConc("INOVA BH", "var(--inova)") : ""}
      ${estado.filtro !== "inova" ? tabelaConc("SAÚDE BH", "var(--saude)") : ""}
    </div>

    <div class="grade g3">
      <div class="cartao">
        <div class="titulo"><h3><span class="rot-mai" style="color:var(--p)">Prazos</span> Vencendo nos próximos 7 dias</h3><a href="#/agenda" class="fraco">agenda</a></div>
        <div class="corpo">${prazos7.map((e) => `<a href="${linkPara(e.href)}" style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--linha);color:inherit;text-decoration:none">
            <div style="min-width:0"><b>${esc(e.terreno || "—")}</b><div class="fraco">${esc(e.titulo)}</div></div>
            <span class="selo ${e.data < estado.hoje ? "s-Bloqueado" : "s-Aguardando"}">${esc(e.data < estado.hoje ? "vencido" : textoPrazo(e.data))}</span></a>`).join("") || `<div class="vazio">Nenhum prazo nos próximos 7 dias.</div>`}</div>
      </div>
      <div class="cartao">
        <div class="titulo"><h3>Previsões de entrega da obra</h3><span class="fraco">${prevs.length}</span></div>
        <div class="corpo" style="max-height:360px;overflow:auto">${prevs.slice(0, 30).map((l) => { const d = diasAte(l.prev); return `<a href="#/terrenos/${l.t.id}" style="display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--linha);color:inherit;text-decoration:none">

            <div style="text-align:right"><b class="num">${fmtData(l.prev)}</b><div class="fraco">${d < 0 ? `atrasada ${-d} dias` : d === 0 ? "hoje" : `em ${d} dias`}</div></div></a>`; }).join("") || `<div class="vazio">Nenhuma obra com previsão de entrega cadastrada.</div>`}</div>

            <div style="min-width:0"><b>${esc(a.usuario ?? "—")}</b> ${esc(a.acao.toLowerCase().startsWith("situação") ? "alterou a situação" : "registrou")} · ${esc(MODULOS[a.modulo].sigla)}<div class="fraco" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px">${esc(nomeTerreno(p?.terrenoId) ?? "")} · ${esc(a.acao)}</div></div>
            <span class="fraco" style="white-space:nowrap">${esc(relativo(a.data))}</span></a>`; }).join("") || `<div class="vazio">Nenhuma atualização ainda.</div>`}</div>
      </div>

    ${criticos.length ? `<div class="cartao"><div class="titulo"><h3>Alertas críticos</h3><a href="#/alertas" class="fraco">ver todos (${estado.alertas.length})</a></div><div class="corpo">${listaAlertasHtml(criticos)}</div></div>` : ""}

    <div class="cartao" id="vu-lista">
      <div class="titulo"><div><h3>Terrenos (<span id="vu-n">${filtradas.length}</span>)</h3><div class="fraco">${filtroTxt ? `Filtro: ${esc(filtroTxt)}` : "Clique num número das tabelas ou num card para filtrar"}</div></div>
        <div class="busca-campo" style="width:260px">${icone("busca")}<input class="campo" id="vu-busca" placeholder="Pesquisar terreno" value="${esc(f.busca)}"></div></div>
      <div class="tabela-env"><table class="tabela"><thead><tr><th>Terreno</th><th>Concessionária · unidade · origem</th><th>Fase</th><th>Progresso</th><th>Risco</th><th class="n">Entrega</th><th></th></tr></thead><tbody>
        ${filtradas.sort((a, b) => a.t.nome.localeCompare(b.t.nome)).map((l) => `<tr class="clica" data-href="#/terrenos/${l.t.id}" data-busca="${esc(normalizar(`${l.t.nome} ${l.t.endereco?.bairro ?? ""} ${l.t.origemDemanda ?? ""}`))}">
          <td><b>${esc(l.t.nome)}</b></td><td class="fraco">${esc([l.conc, l.unidade, l.t.origemDemanda].filter(Boolean).join(" · "))}</td>
          <td>${esc(l.fase)}</td><td><div style="display:flex;gap:8px;align-items:center"><div class="progresso" style="width:70px"><i style="width:${Math.round(l.r.progresso * 100)}%"></i></div><span class="fraco">${Math.round(l.r.progresso * 100)}%</span></div></td>
          <td>${seloRisco(l.r)}</td><td class="n">${l.prev ? `Entrega ${fmtData(l.prev)}` : "—"}</td><td style="color:var(--texto-3)">›</td></tr>`).join("") || `<tr><td colspan="7" class="vazio">Nenhum terreno com esses filtros.</td></tr>`}
      </tbody></table></div>
    </div>
  </div>`;
}

function paginaAlertas() {

  const grupos = {};
  for (const a of lista) (grupos[a.tipo] ??= []).push(a);
  aoMontar(() => {

let mesAgenda = null;
function paginaAgenda() {
  const eventos = eventosAgenda(estado.recorte, estado.hoje).map((e) => ({ ...e, link: linkPara(e.href) }));
  const hoje = estado.hoje;
  mesAgenda ??= hoje.slice(0, 7);
  const [ano, mes] = mesAgenda.split("-").map(Number);
  const primeiro = new Date(Date.UTC(ano, mes - 1, 1));
  const inicio = new Date(primeiro.getTime() - primeiro.getUTCDay() * 86400000);
  const dias = Array.from({ length: 42 }, (_, i) => new Date(inicio.getTime() + i * 86400000).toISOString().slice(0, 10));
  const porDia = {};
  for (const e of eventos) (porDia[e.data] ??= []).push(e);
  const proximos = eventos.filter((e) => e.data >= somaDias(hoje, -30) && e.data <= somaDias(hoje, 30));
  const nomeMes = new Intl.DateTimeFormat("pt-BR", { month: "long", year: "numeric", timeZone: "UTC" }).format(primeiro);
  aoMontar(() => {
    $("#ag-ant").onclick = () => { mesAgenda = new Date(Date.UTC(ano, mes - 2, 1)).toISOString().slice(0, 7); render(); };
    $("#ag-prox").onclick = () => { mesAgenda = new Date(Date.UTC(ano, mes, 1)).toISOString().slice(0, 7); render(); };
    $("#ag-hoje").onclick = () => { mesAgenda = hoje.slice(0, 7); render(); };
    $("#ag-ics").onclick = () => RELATORIOS[7].gerar();
  });
  return `
  <div class="pagina">
    <div class="cabeca"><div><h1>Agenda de prazos</h1><p class="mudo">Limites de protocolo, retornos, diretrizes, termos, condicionantes, relatórios e prazos da linha do tempo</p></div>
      <div class="acoes"><button class="btn" id="ag-ics">${icone("agenda")} Exportar para o Outlook (.ics)</button></div></div>
    <div class="grade g-lado">
      <div class="cartao pad">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <h2 style="text-transform:capitalize">${esc(nomeMes)}</h2>
          <div class="acoes"><button class="btn peq" id="ag-ant">‹</button><button class="btn peq" id="ag-hoje">Hoje</button><button class="btn peq" id="ag-prox">›</button></div>
        </div>
        <div class="agenda-mes">
          ${["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"].map((d) => `<div class="cab-d">${d}</div>`).join("")}
          ${dias.map((d) => `<div class="dia ${d.slice(0, 7) !== mesAgenda ? "fora" : ""} ${d === hoje ? "hoje" : ""}"><div class="n">${Number(d.slice(8))}</div>
            ${(porDia[d] || []).slice(0, 3).map((e) => `<a href="${e.link}" class="${d < hoje ? "venc" : ""}" title="${esc(`${e.terreno} · ${e.titulo}`)}">${esc(e.terreno || e.titulo)}</a>`).join("")}
            ${(porDia[d] || []).length > 3 ? `<span class="fraco">+${porDia[d].length - 3}</span>` : ""}</div>`).join("")}
        </div>
      </div>
      <div class="cartao">
        <div class="titulo"><h3>Janela de ±30 dias</h3><span class="fraco">${proximos.length} prazo(s)</span></div>
        <div class="corpo" style="max-height:640px;overflow:auto">
          ${proximos.map((e) => `<a href="${e.link}" style="display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--linha);color:inherit;text-decoration:none">
            <div style="width:84px;flex:none" class="num"><b style="${e.data < hoje ? "color:var(--perigo)" : ""}">${fmtData(e.data).slice(0, 5)}</b><div class="fraco">${esc(textoPrazo(e.data))}</div></div>
            <div style="min-width:0"><b>${esc(e.terreno || "—")}</b><div class="fraco">${esc(e.titulo)} · ${esc(e.tipo)}</div></div></a>`).join("") || `<div class="vazio">Nenhum prazo nesta janela.</div>`}
        </div>
      </div>
    </div>
  </div>`;
}

// =====================================================================
// Dili · assistente da Central (responde com os dados carregados)

const dili = { aberto: false, msgs: [] };
const DILI_SUG = ["Resumo geral", "O que está vencido?", "Prazos desta semana", "Terrenos com maior risco", "O que falta abrir?", "Como está o terreno…"];

function desenharDili() {
  let raiz = $("#dili-raiz");
  if (!raiz) { raiz = document.createElement("div"); raiz.id = "dili-raiz"; document.body.appendChild(raiz); }
  if (!estado.base) { raiz.innerHTML = ""; return; }
  if (!dili.msgs.length) dili.msgs.push({ de: "bot", html: `Olá, ${esc(primeiroNome())}! Sou a <b>Dili</b>, assistente da Central. Pergunte sobre prazos, alertas, terrenos ou processos.` });
  raiz.innerHTML = `
    <button class="dili-botao" id="dili-abrir" title="Dili · assistente">${icone(dili.aberto ? "limpar" : "chat")}</button>
    ${dili.aberto ? `<section class="cartao dili" aria-label="Dili">
      <header><div class="av">${icone("brilho")}</div><div style="flex:1"><b>Dili · Assistente da Central</b><div style="font-size:12px;opacity:.9">🟢 Online · dados de ${esc(fmtDataHora(estado.carregadoEm))} · ${estado.recorte.terrenos.length} terrenos</div></div>
        <button class="btn fant peq" id="dili-limpar" style="color:#fff">Nova conversa</button></header>
      <div class="msgs" id="dili-msgs">${dili.msgs.map((m) => `<div class="msg ${m.de}">${m.html}</div>`).join("")}
        <div class="sug">${DILI_SUG.map((s) => `<button data-sug="${esc(s)}">${esc(s)}</button>`).join("")}</div></div>
      <form id="dili-form"><input class="campo" id="dili-txt" placeholder="Pergunte à Dili…" autocomplete="off"><button class="btn prim">${icone("enviar")}</button></form>
    </section>` : ""}`;
  $("#dili-abrir").onclick = () => { dili.aberto = !dili.aberto; desenharDili(); $("#dili-txt")?.focus(); };
  if (!dili.aberto) return;
  const box = $("#dili-msgs"); box.scrollTop = box.scrollHeight;
  $("#dili-limpar").onclick = () => { dili.msgs = []; desenharDili(); };
  $$("[data-sug]").forEach((b) => (b.onclick = () => perguntarDili(b.dataset.sug)));
  $("#dili-form").onsubmit = (e) => { e.preventDefault(); const v = $("#dili-txt").value.trim(); if (v) perguntarDili(v); };
  raiz.querySelectorAll(".msg a").forEach((a) => a.addEventListener("click", () => { dili.aberto = false; desenharDili(); }));
}

function perguntarDili(txt) {
  dili.msgs.push({ de: "eu", html: esc(txt) });
  dili.msgs.push({ de: "bot", html: responderDili(txt) });
  desenharDili();
  $("#dili-txt")?.focus();
}

function responderDili(txt) {
  const q = normalizar(txt);
  const b = estado.recorte;
  const lnk = (href, rot) => `<a href="${href}">${esc(rot)}</a>`;
  const listaAl = (as, n = 8) => as.slice(0, n).map((a) => `• ${lnk(linkPara(a.href), a.terreno)} — ${esc(a.tipo)}: ${esc(a.detalhe)}`).join("\n") + (as.length > n ? `\n…e mais ${as.length - n}. ${lnk("#/alertas", "Ver todos")}` : "");
  // terreno específico
  const t = [...b.terrenos].sort((x, y) => y.nome.length - x.nome.length).find((x) => q.includes(normalizar(x.nome)) || (normalizar(x.nome).split(" ").slice(1).join(" ").length > 3 && q.includes(normalizar(x.nome).split(" ").slice(1).join(" "))));
  if (t) {
    const r = estado.mapaResumoTodos.get(t.id);
    const procs = estado.base.processos.filter((p) => p.terrenoId === t.id);
    const al = estado.alertasTodos.filter((a) => a.terrenoId === t.id);
    return `<b>${esc(t.nome)}</b> (${esc(t.unidade ?? "sem concessionária")})\nEtapa: ${esc(r?.etapa ?? "—")} · progresso ${Math.round((r?.progresso ?? 0) * 100)}% · risco ${r?.risco ?? 0} (${esc(r?.nivelRisco ?? "—")})\n` +
      `Processos: ${procs.map((p) => `${MODULOS[p.modulo].sigla} ${statusProcesso(p, estado.hoje).toLowerCase()}`).join(", ") || "nenhum"}\n` +
      (r?.aAbrir.length ? `Falta abrir: ${r.aAbrir.map((m) => MODULOS[m].sigla).join(", ")}\n` : "") +
      (al.length ? `\n${al.length} alerta(s):\n${listaAl(al, 5)}` : "\nSem alertas. ✓") + `\n\n${lnk(`#/terrenos/${t.id}`, "Abrir o terreno")}`;
  }
  if (/vencid|atrasad|critic/.test(q)) {
    const as = estado.alertas.filter((a) => a.alta);
    return as.length ? `<b>${as.length} pendência(s) crítica(s)</b>:\n${listaAl(as)}` : "Nenhuma pendência crítica no recorte atual. ✓";
  }
  if (/semana|7 dias|proxim|vencer|prazo/.test(q)) {
    const ev = eventosAgenda(b, estado.hoje).filter((e) => e.data >= estado.hoje && e.data <= somaDias(estado.hoje, 7));
    return ev.length ? `<b>${ev.length} prazo(s) nos próximos 7 dias</b>:\n${ev.slice(0, 10).map((e) => `• ${fmtData(e.data)} — ${lnk(linkPara(e.href), e.terreno || e.titulo)}: ${esc(e.titulo)}`).join("\n")}` : "Nenhum prazo nos próximos 7 dias. ✓";
  }
  if (/risco/.test(q)) {
    const top = [...estado.resumos].sort((x, y) => y.risco - x.risco).slice(0, 6);
    return `<b>Maior risco</b>:\n${top.map((r) => `• ${lnk(`#/terrenos/${r.terreno.id}`, r.terreno.nome)} — ${r.risco} (${esc(r.nivelRisco)}): ${esc(r.motivosRisco.slice(0, 2).join("; ") || "—")}`).join("\n")}`;
  }
  if (/abrir|falta|fluxograma|conflit/.test(q)) {
    const ab = estado.resumos.filter((r) => r.aAbrir.length), cf = estado.resumos.filter((r) => r.conflitos.length), sem = estado.resumos.filter((r) => !r.fluxoRespondido);
    return `<b>Fluxograma</b>\n• ${ab.length} terreno(s) com processo exigido e não aberto${ab.length ? `: ${ab.slice(0, 6).map((r) => `${lnk(`#/terrenos/${r.terreno.id}`, r.terreno.nome)} (${r.aAbrir.map((m) => MODULOS[m].sigla).join(", ")})`).join(", ")}` : ""}\n• ${cf.length} com conflito\n• ${sem.length} sem as perguntas respondidas${sem.length ? ` — ${lnk("#/fluxograma", "responder no Fluxograma")}` : ""}`;
  }
  if (/parado|sem moviment/.test(q)) {
    const as = estado.alertas.filter((a) => a.tipo === "Processo parado");
    return as.length ? `<b>${as.length} processo(s) parados há mais de 60 dias</b>:\n${listaAl(as)}` : "Nenhum processo parado. ✓";
  }
  const mod = LISTA_MODULOS.find((m) => q.includes(normalizar(m.sigla)) || q.includes(normalizar(m.nome)));
  if (mod) {
    const ps = b.processos.filter((p) => p.modulo === mod.id);
    const st = contarStatus(ps);
    const al = estado.alertas.filter((a) => a.modulo === mod.id);
    return `<b>${esc(mod.nome)}</b>: ${ps.length} processo(s)\n${ORDEM_STATUS.filter((s) => st[s]).map((s) => `• ${s}: ${st[s]}`).join("\n")}\n${al.length ? `\n${al.length} alerta(s):\n${listaAl(al, 5)}` : "\nSem alertas. ✓"}\n\n${lnk(linkPara(`/processos/${mod.id}`), "Abrir o módulo")}`;
  }
  if (/resumo|geral|situac|como esta/.test(q) || q.length < 3) {
    const ind = indicadores(b, estado.resumos, estado.alertas, estado.hoje);
    return `<b>Resumo · ${esc(nomeMarca())}</b>\n• ${ind.terrenos} terrenos · ${ind.processos} processos (${ind.abertos} em aberto, ${ind.concluidos} concluídos, ${ind.bloqueados} bloqueados)\n• ${ind.alertasAltos} alerta(s) crítico(s) e ${ind.alertas - ind.alertasAltos} de atenção\n• ${ind.riscoAlto} terreno(s) com risco alto\n• Etapas: ${Object.entries(ind.porEtapa).filter(([, v]) => v).map(([k, v]) => `${k} ${v}`).join(" · ")}`;
  }
  return "Não entendi bem. Tente: “resumo geral”, “o que está vencido?”, “prazos desta semana”, “GELIN”, “risco” ou o nome de um terreno (ex.: “CS Lindéia”).";
}

// =====================================================================
// Inicialização
// =====================================================================
async function boot() {
  aplicarAparencia();
  const retorno = await auth.tratarRetorno();
  if (retorno === "popup") {
    $("#app").innerHTML = `<div class="tela-carga"><div class="giro"></div><p>Concluindo o login…</p></div>`;
    return;
  }
  if (estado.modo === "demo" || (estado.modo === "sharepoint" && auth.logado() && configCompleta()) || retorno === "ok") {
    await iniciar(retorno === "ok" ? "sharepoint" : estado.modo);
  } else {
    render();
  }
  // Recarrega sozinho a cada 10 minutos (sem atrapalhar quem está editando)
  setInterval(async () => {
    if (!estado.base || document.hidden || $("#modal-raiz").children.length) return;
    try { await carregarBase({ silencioso: true }); render(); } catch { /* tenta na próxima */ }
  }, 10 * 60 * 1000);
}

boot();

</script>
