  for (const [chave, rotulo, sp, tipo] of novos) if (!amb.some((e) => e.chave === chave)) amb.push({ chave, rotulo, sp, tipo });
})();

// ---------- conversões ----------
const FUSO = "America/Sao_Paulo";
const fmtDia = new Intl.DateTimeFormat("en-CA", { timeZone: FUSO });
function spData(v) { return typeof v === "string" && v ? fmtDia.format(new Date(v)) : null; }
function dataParaSp(v) { return v ? `${v}T03:00:00Z` : null; } // meia-noite em Brasília
function spTxt(v) {
  if (v == null || v === "") return null;
  if (Array.isArray(v)) return v.map((x) => (typeof x === "object" ? x.LookupValue ?? x.Email ?? "" : x)).join(", ") || null;
  if (typeof v === "object") return v.LookupValue ?? v.Email ?? v.Url ?? v.Description ?? null;
  return String(v);
}
function spNum(v) { if (v == null || v === "") return null; const n = Number(v); return Number.isFinite(n) ? n : null; }
function spLookup(f, col) { return spNum(f[`${col}LookupId`]); }
function spSimNao(v) {
  const s = spTxt(v)?.toLowerCase();
  if (!s) return null;
  return s.startsWith("s") || s === "yes" || s === "true" ? "Sim" : "Não";
}
function spPerfil(v) {
  const s = (spTxt(v) ?? "").toLowerCase();
  if (s.includes("admin")) return "Administrador";
  if (s.includes("consulta") || s.includes("leitura")) return "Consulta";
  return "Editor";
}
/** Classifica a unidade pelo nome (igual à "Visão por unidade" do Power Apps). */
function tipoUnidade(nome) {
  const n = String(nome || "").trim().toUpperCase();
  for (const p of ["EMEI", "EMEF", "CME", "CS"]) if (n.startsWith(p)) return p;
  return "Outros";
}

// =====================================================================
// Cliente do Microsoft Graph
// =====================================================================
class Graph {
  constructor(site) { this.site = site; this.siteId = null; this.listaIds = {}; this.colunas = {}; }

  async req(caminho, init = {}, tentativa = 0) {
    const url = caminho.startsWith("https://") ? caminho : `https://graph.microsoft.com/v1.0${caminho}`;
    const r = await fetch(url, {
      ...init,
      headers: {
        Authorization: `Bearer ${await auth.token()}`,
        "Content-Type": "application/json",
        Prefer: "HonorNonIndexedQueriesWarningMayFailRandomly",
        ...(init.headers || {}),
      },
    });
    if ((r.status === 429 || r.status === 503 || r.status === 504) && tentativa < 5) {
      const espera = Number(r.headers.get("Retry-After") || 2 ** tentativa) * 1000;
      await new Promise((ok) => setTimeout(ok, espera));
      return this.req(caminho, init, tentativa + 1);
    }
    if (r.status === 401 && tentativa === 0) {
      const t = armazem.ler(LS.tokens);
      if (t) { t.expira = 0; armazem.gravar(LS.tokens, t); }
      return this.req(caminho, init, 1);
    }
    if (!r.ok) {
      let msg = "";
      try { const j = await r.json(); msg = j.error?.message || ""; } catch { /* sem corpo */ }
      const e = new Error(traduzirErro(r.status, msg));
      e.status = r.status;
      throw e;
    }
    if (r.status === 204 || r.status === 202) return null;
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  }

  async idSite() {
    if (!this.siteId) this.siteId = (await this.req(`/sites/${this.site}?$select=id`)).id;
    return this.siteId;
  }

  /** Resolve a lista pelo ID e, se não achar, pelo nome (caso a lista tenha sido recriada). */
  async idLista(lista) {
    if (this.listaIds[lista.id]) return this.listaIds[lista.id];
    const site = await this.idSite();
    try {
      await this.req(`/sites/${site}/lists/${lista.id}?$select=id`);
      this.listaIds[lista.id] = lista.id;
    } catch (e) {
      if (e.status !== 404) throw e;
      const r = await this.req(`/sites/${site}/lists?$select=id,displayName&$filter=displayName eq '${lista.nome.replace(/'/g, "''")}'`);
      if (!r.value?.length) throw new Error(`Lista "${lista.nome}" não encontrada no site.`);
      this.listaIds[lista.id] = r.value[0].id;
    }
    return this.listaIds[lista.id];
  }

  async itens(lista) {
    const site = await this.idSite();
    const id = await this.idLista(lista);
    const out = [];
    let url = `/sites/${site}/lists/${id}/items?$expand=fields&$top=999`;
    while (url) {
      const pg = await this.req(url);
      out.push(...pg.value);
      url = pg["@odata.nextLink"];
    }
    return out;
  }

  /** Colunas da lista (tipo, opções de escolha, somente leitura). Cache por sessão. */
  async colunasDe(lista) {
    if (this.colunas[lista.id]) return this.colunas[lista.id];
    const site = await this.idSite();
    const id = await this.idLista(lista);
    const r = await this.req(`/sites/${site}/lists/${id}/columns?$top=500`);
    const mapa = {};
    for (const c of r.value) {
      mapa[c.name] = {
        nome: c.name,
        rotulo: c.displayName,
        somenteLeitura: !!c.readOnly,
        tipo: c.choice ? "escolha" : c.dateTime ? "data" : c.number || c.currency ? "numero" : c.lookup ? "lookup"
          : c.personOrGroup ? "pessoa" : c.boolean ? "booleano" : c.text ? "texto" : c.hyperlinkOrPicture ? "link" : "outro",
        opcoes: c.choice?.choices ?? null,
        multiplo: !!(c.lookup?.allowMultipleValues || c.personOrGroup?.allowMultipleSelection),
      };
    }
    return (this.colunas[lista.id] = mapa);
  }

  /** Remove do pacote as colunas que não existem ou não aceitam gravação (evita erro 400). */
  async filtrarCampos(lista, campos) {
    let cols;
    try { cols = await this.colunasDe(lista); } catch { return campos; }
    const out = {};
    for (const [k, v] of Object.entries(campos)) {
      const nome = k.endsWith("LookupId") ? k.slice(0, -8) : k;
      const c = cols[nome];
      if (!c || c.somenteLeitura) continue;
      if (c.tipo === "pessoa" && !k.endsWith("LookupId")) continue; // pessoa só por ID
      if (c.tipo === "lookup" && !k.endsWith("LookupId")) continue;
      if (c.tipo === "numero" && v != null && v !== "") { const n = Number(v); if (Number.isFinite(n)) out[k] = n; continue; }
      if (c.tipo === "texto" && typeof v === "number") { out[k] = String(v); continue; }
      if (c.multiplo && k.endsWith("LookupId")) { out[`${k}@odata.type`] = "Collection(Edm.String)"; out[k] = v == null ? [] : [String(v)]; continue; }
      out[k] = v === "" ? null : v;
    }
    return out;
  }

  async criar(lista, campos) {
    const site = await this.idSite();
    const id = await this.idLista(lista);
    const fields = await this.filtrarCampos(lista, campos);
    return this.req(`/sites/${site}/lists/${id}/items`, { method: "POST", body: JSON.stringify({ fields }) });
  }

  async atualizar(lista, itemId, campos) {
    const site = await this.idSite();
    const id = await this.idLista(lista);
    const fields = await this.filtrarCampos(lista, campos);
    if (!Object.keys(fields).length) return;
    await this.req(`/sites/${site}/lists/${id}/items/${itemId}/fields`, { method: "PATCH", body: JSON.stringify(fields) });
  }

  async excluir(lista, itemId) {
    const site = await this.idSite();
    const id = await this.idLista(lista);
    await this.req(`/sites/${site}/lists/${id}/items/${itemId}`, { method: "DELETE" });
  }
}

function traduzirErro(status, msg) {
  if (status === 403) return "Sem permissão no SharePoint para esta lista ou ação. Peça acesso de edição ao dono do site.";
  if (status === 404) return "Item, lista ou site não encontrado. Confira o endereço do site em Configurações.";
  if (status === 400) return `O SharePoint recusou os dados: ${msg || "verifique os campos."}`;
  if (status === 409 || status === 412) return "Outra pessoa alterou este item ao mesmo tempo. Atualize e tente de novo.";
  return `Erro ${status} no SharePoint${msg ? `: ${msg}` : ""}`;
}

// ---------- conversão de itens ----------
function itemParaProcesso(modulo, it) {
  const def = MODULOS[modulo];
  const f = it.fields;
  const g = (col) => (col ? f[col] : undefined);
  const extras = {};
  for (const e of def.extras) {
    if (e.tipo === "data") extras[e.chave] = spData(f[e.sp]);
    else if (e.tipo === "numero") extras[e.chave] = f[`${e.sp}LookupId`] !== undefined ? spLookup(f, e.sp) : spNum(f[e.sp]);
    else extras[e.chave] = spTxt(f[e.sp]);
  }
  let titulo = spTxt(g(def.sp.titulo));
  if (!titulo && modulo === "ambiental") titulo = [extras.tipo, extras.parecer && `PT ${extras.parecer}`].filter(Boolean).join(" · ");
  const link = g(def.sp.link);
  return {
    id: Number(it.id),
    modulo,
    terrenoId: def.sp.terreno ? spLookup(f, def.sp.terreno) : null,
    terrenoTexto: def.sp.terreno ? spTxt(f[def.sp.terreno]) : null,
    titulo: titulo || `#${it.id}`,
    situacao: spTxt(g(def.sp.situacao)),
    acao: spTxt(g(def.sp.acao)),
    dataInicio: spData(g(def.sp.dataInicio)),
    dataLimiteProtocolo: spData(g(def.sp.dataLimiteProtocolo)),
    previsaoRetorno: spData(g(def.sp.previsaoRetorno)),
    dataAtualizacao: spData(g(def.sp.dataAtualizacao)) ?? spData(f.Modified),
    dataTermino: spData(g(def.sp.dataTermino)),
    link: link && typeof link === "object" ? link.Url ?? null : spTxt(link),
    comentarios: spTxt(g(def.sp.comentarios)),
    extras,
    modificadoPor: f.Editor?.LookupValue ?? null,
    modificadoEm: f.Modified ?? null,
    criadoEm: f.Created ?? null,
  };
}

function camposDeAlteracao(modulo, alt) {
  const def = MODULOS[modulo];
  const c = {};
  const set = (col, v) => { if (col && v !== undefined) c[col] = v === "" ? null : v; };
  set(def.sp.titulo, alt.titulo);
  set(def.sp.situacao, alt.situacao);
  set(def.sp.acao, alt.acao);
  set(def.sp.comentarios, alt.comentarios);
  set(def.sp.link, alt.link);
  for (const k of ["dataInicio", "dataLimiteProtocolo", "previsaoRetorno", "dataTermino"]) {
    if (alt[k] !== undefined) set(def.sp[k], dataParaSp(alt[k]));
  }
  if (def.sp.terreno && alt.terrenoId !== undefined) c[`${def.sp.terreno}LookupId`] = alt.terrenoId == null ? null : String(alt.terrenoId);
  if (def.sp.dataAtualizacao) c[def.sp.dataAtualizacao] = dataParaSp(hojeISO());
  for (const [chave, valor] of Object.entries(alt.extras || {})) {
    const e = def.extras.find((x) => x.chave === chave);
    if (!e || valor === undefined) continue;
    if (e.tipo === "data") c[e.sp] = dataParaSp(valor);
    else if (e.tipo === "numero" && chave.endsWith("Id")) c[`${e.sp}LookupId`] = valor == null || valor === "" ? null : String(valor);
    else if (e.tipo === "numero") c[e.sp] = valor === "" || valor == null ? null : Number(valor);
    else c[e.sp] = valor === "" ? null : valor;
  }
  return c;
}

/** Liga processos e lotes ao terreno também pelo nome (o Power Apps compara Terreno.Value = Nome). */
function vincularPorNome(base) {
  const porNome = new Map(base.terrenos.map((t) => [chaveNome(t.nome), t.id]));
  for (const p of base.processos) if (p.terrenoId == null && p.terrenoTexto) p.terrenoId = porNome.get(chaveNome(p.terrenoTexto)) ?? null;
  for (const l of base.lotes) if (l.terrenoId == null && l.terrenoTexto) l.terrenoId = porNome.get(chaveNome(l.terrenoTexto)) ?? null;
  return base;
}

/** Dados derivados do terreno: regional (IBED) e tipo de unidade (EMEI, EMEF, CME, CS). */
function completarTerrenos(base) {
  const regional = new Map();
  for (const l of base.lotes) if (l.terrenoId != null && l.campos.cd_regional && !regional.has(l.terrenoId)) regional.set(l.terrenoId, l.campos.cd_regional);
  for (const t of base.terrenos) {
    t.regional = regional.get(t.id) ?? t.regional ?? null;
    t.tipoUnidade = tipoUnidade(t.nome);
  }
  return base;
}

// =====================================================================
// Provedor SharePoint
// =====================================================================
class ProvedorSharePoint {
  constructor() {
    this.origem = "sharepoint";
    this.g = new Graph(configAtual().site);
  }

  async quemSou() {
    const me = await this.g.req("/me?$select=displayName,mail,userPrincipalName");
    return { nome: me.displayName, email: (me.mail || me.userPrincipalName || "").toLowerCase() };
  }

  async carregar(progresso = () => {}) {
    const fontes = [
      ["terrenos", LISTAS.terrenos], ["fluxos", LISTAS.fluxos], ["enderecos", LISTAS.enderecos], ["ibed", LISTAS.ibed],
      ["usuarios", LISTAS.usuarios], ["condicionantes", LISTAS.condicionantes], ["relatorios", LISTAS.relatorios],
      ["ltLic", LISTAS.ltLicenciamento], ["ltParc", LISTAS.ltParcelamento], ["envios", LISTAS.envios],
      ...LISTA_MODULOS.map((m) => [`mod:${m.id}`, listaDoModulo(m.id)]),
    ];
    let feitas = 0;
    const avisos = [];
    const r = {};
    const fila = [...fontes];
    await Promise.all(Array.from({ length: 6 }, async () => {
      while (fila.length) {
        const [chave, lista] = fila.shift();
        try { r[chave] = await this.g.itens(lista); }
        catch (e) {
          if (e instanceof ErroSessao) throw e;
          if (chave === "terrenos") throw e;
          avisos.push(`${lista.nome}: ${e.message}`);
          r[chave] = [];
        }
        progresso(++feitas, fontes.length);
      }
    }));

    const terrNome = new Map(r.terrenos.map((it) => [chaveNome(spTxt(it.fields.Title) ?? ""), Number(it.id)]));
    const idTerreno = (f, col) => spLookup(f, col) ?? terrNome.get(chaveNome(spTxt(f[col]) ?? "")) ?? null;

    const enderecos = new Map();
    for (const it of r.enderecos) {
      const f = it.fields;
      const tid = idTerreno(f, "cd_idterreno");
      if (tid == null) continue;
      enderecos.set(tid, {
        _id: Number(it.id),
        logradouro: spTxt(f.Title), numero: spNum(f.cd_numero), complemento: spTxt(f.cd_complemento),
        bairro: spTxt(f.cd_bairro), cidade: spTxt(f.cd_cidade), uf: spTxt(f.cd_uf), cep: spTxt(f.cd_cep),
      });
    }
    const lotes = r.ibed.map((it) => {
      const f = it.fields;
      const campos = {};
      for (const c of IBED_CAMPOS) campos[c.col] = c.tipo === "numero" ? spNum(f[c.col]) : spTxt(f[c.col]);
      return { id: Number(it.id), terrenoId: spLookup(f, "cd_terreno"), terrenoTexto: spTxt(f.cd_terreno), campos, modificadoPor: f.Editor?.LookupValue ?? null, modificadoEm: f.Modified ?? null };
    });

    const terrenos = r.terrenos.map((it) => {
      const f = it.fields;
      const id = Number(it.id);
      return {
        id,
        nome: spTxt(f.Title) ?? `Terreno ${id}`,
        unidade: normalizarUnidade(spTxt(f.cd_concessionaria_r01) ?? spTxt(f.cd_concessionaria)),
        unidadeTexto: spTxt(f.cd_concessionaria_r01) ?? spTxt(f.cd_concessionaria),
        origemDemanda: spTxt(f.cd_origemdemanda),
        responsavel: spTxt(f.cd_responsavel),
        fase: spTxt(f.cd_faseempreendimento),
        dataDisponibilidade: spData(f.cd_datadedisponibilidade_r01) ?? spData(f.cd_datadadisponibilidade),
        previsaoEntrega: spData(f.cd_previsaoentrega),
        prazoLiberacao: spData(f.PrazodeLibera_x00e7__x00e3_o),
        regional: null,
        endereco: enderecos.get(id) ?? null,
        modificadoPor: f.Editor?.LookupValue ?? null,
        modificadoEm: f.Modified ?? null,
      };
    });

    const fluxos = [];
    for (const it of r.fluxos) {
      const tid = idTerreno(it.fields, "cd_terrenoid");
      if (tid == null) continue;
      const fl = { id: Number(it.id), terrenoId: tid };
      for (const [k, col] of Object.entries(FLUXO_SP)) fl[k] = spSimNao(it.fields[col]);
      fluxos.push(fl);
    }

    const processos = LISTA_MODULOS.flatMap((def) => r[`mod:${def.id}`].map((it) => itemParaProcesso(def.id, it)));

    const usuarios = r.usuarios.map((it) => ({
      id: Number(it.id),
      nome: spTxt(it.fields.Title) ?? "",
      email: (spTxt(it.fields.cd_emailcorporativo) ?? "").toLowerCase(),
      perfil: spPerfil(it.fields.cd_perfildeacesso),
    }));
    const nomeUsuario = new Map(usuarios.map((u) => [u.id, u.nome]));

    // Ambiental: os andamentos ficam na linha do tempo do licenciamento, marcados como "Ambiental"
    const ambPorVinculo = new Map();
    for (const p of processos.filter((x) => x.modulo === "ambiental")) {
      for (const [k, m] of [["gelinId", "gelin"], ["geavaId", "geava"], ["alvaraId", "alvara"]]) if (p.extras[k] != null && !ambPorVinculo.has(`${m}:${p.extras[k]}`)) ambPorVinculo.set(`${m}:${p.extras[k]}`, p.id);
    }

    const andamentos = [];
    const lerLinha = (itens, lista) => {
      const mods = LISTA_MODULOS.filter((m) => m.linhaDoTempo?.lista === lista);
      for (const it of itens) {
        const f = it.fields;
        const titulo = spTxt(f.Title) ?? "";
        const tipo = spTxt(f.cd_tipodeprocesso) ?? "";
        const ehAmb = lista === "licenciamento" && (/^ambiental$/i.test(tipo) || titulo.startsWith("[Ambiental]"));
        let modulo, processoId;
        if (ehAmb) {
          for (const [col, m] of [["cd_gelin", "gelin"], ["cd_geava", "geava"], ["cd_alvara", "alvara"]]) {
            const v = spLookup(f, col);
            if (v != null && ambPorVinculo.has(`${m}:${v}`)) { modulo = "ambiental"; processoId = ambPorVinculo.get(`${m}:${v}`); break; }
          }
          if (!modulo) continue;
        } else {
          const mod = mods.find((m) => m.linhaDoTempo.tipo === tipo && spLookup(f, m.linhaDoTempo.coluna) != null)
            ?? mods.find((m) => spLookup(f, m.linhaDoTempo.coluna) != null);
          if (!mod) continue;
          modulo = mod.id; processoId = spLookup(f, mod.linhaDoTempo.coluna);
        }
        andamentos.push({
          id: Number(it.id),
          lista,
          modulo,
          processoId,
          acao: titulo.replace(/^\[Ambiental\]\s*/, ""),
          comentario: spTxt(f.cd_comentario),
          data: spTxt(f.cd_datadaatualizacao) ?? spTxt(f.Created) ?? new Date().toISOString(),
          prazoAtendimento: spData(f[PRAZO_LT[lista]]),
          usuario: nomeUsuario.get(spLookup(f, "cd_usuariodosistema") ?? -1) ?? f.Author?.LookupValue ?? null,
          registradoEm: f.Created ?? null,
        });
      }
    };
    lerLinha(r.ltLic, "licenciamento");
    lerLinha(r.ltParc, "parcelamento");

    const condicionantes = r.condicionantes.map((it) => ({
      id: Number(it.id),
      ambientalId: spLookup(it.fields, "cd_ambiental"),
      item: spTxt(it.fields.cd_item),
      condicionante: spTxt(it.fields.Title),
      prazo: spData(it.fields.cd_prazo),
      status: spTxt(it.fields.cd_status),
      observacao: spTxt(it.fields.cd_observacao),
    }));
    const relatorios = r.relatorios.map((it) => ({
      id: Number(it.id),
      ambientalId: spLookup(it.fields, "cd_ambiental"),
      condicionanteId: spLookup(it.fields, "cd_ambientalcondicionante"),
      nome: spTxt(it.fields.Title) ?? "Relatório",
      prevista: spData(it.fields.cd_dataprevistadorelatoriodemon),
      real: spData(it.fields.cd_datarealdorelatoriodemon),
    }));
    const envios = r.envios.map((it) => ({
      id: Number(it.id), nome: spTxt(it.fields.Title), data: spData(it.fields.cd_datadoenvio) ?? spData(it.fields.Created),
      origem: spTxt(it.fields.cd_origem), quantidade: spNum(it.fields.cd_quantidade), enviadoPor: spTxt(it.fields.cd_enviadopor),
    }));

    const base = vincularPorNome({
      terrenos, fluxos, processos, condicionantes, relatorios, andamentos, usuarios, lotes, envios,
      geradoEm: new Date().toISOString(), origem: "sharepoint",
    });
    resolverVinculos(base);
    completarTerrenos(base);
    return { base, avisos };
  }

  async opcoes(lista, coluna) {
    try { return (await this.g.colunasDe(lista))[coluna]?.opcoes ?? null; } catch { return null; }
  }
  async colunas(lista) {
    try { return await this.g.colunasDe(lista); } catch { return {}; }
  }

  async atualizarProcesso(modulo, id, alt) { await this.g.atualizar(listaDoModulo(modulo), id, camposDeAlteracao(modulo, alt)); }

  async criarProcesso(n) {
    const def = MODULOS[n.modulo];
    const campos = camposDeAlteracao(n.modulo, n);
    if (def.sp.terreno && n.terrenoId != null) campos[`${def.sp.terreno}LookupId`] = String(n.terrenoId);
    const it = await this.g.criar(listaDoModulo(n.modulo), campos);
    return itemParaProcesso(n.modulo, it);
  }

  /** Grava um andamento (só acrescenta; nunca altera nem apaga os anteriores). */
  async registrarAndamento(a, usuario) {
    const agora = new Date().toISOString();
    let lista, campos;
    if (a.modulo === "ambiental") {
      const p = estado.processoPorChave.get(`ambiental:${a.processoId}`);
      const vinc = [["gelinId", "cd_gelin", "GELIN"], ["geavaId", "cd_geava", "GEAVA"], ["alvaraId", "cd_alvara", "Alvará"]].find(([k]) => p?.extras[k] != null);
      if (!vinc) throw new Error("Vincule o processo ambiental a um GEAVA, GELIN ou Alvará para registrar a linha do tempo.");
      const ops = await this.opcoes(LISTAS.ltLicenciamento, "cd_tipodeprocesso");
      const temAmb = !ops || ops.includes("Ambiental");
      lista = LISTAS.ltLicenciamento;
      campos = {
        Title: `${temAmb ? "" : "[Ambiental] "}${a.acao}`.slice(0, 255),
        cd_tipodeprocesso: temAmb ? "Ambiental" : vinc[2],
        [`${vinc[1]}LookupId`]: String(p.extras[vinc[0]]),
      };
    } else {
      const lt = MODULOS[a.modulo].linhaDoTempo;
      if (!lt) throw new Error("Este módulo não tem linha do tempo no SharePoint.");
      lista = lt.lista === "licenciamento" ? LISTAS.ltLicenciamento : LISTAS.ltParcelamento;
      campos = { Title: a.acao.slice(0, 255), cd_tipodeprocesso: lt.tipo, [`${lt.coluna}LookupId`]: String(a.processoId) };
    }
    const prazoCol = lista === LISTAS.ltLicenciamento ? PRAZO_LT.licenciamento : PRAZO_LT.parcelamento;
    Object.assign(campos, { cd_comentario: a.comentario, cd_datadaatualizacao: agora, [prazoCol]: dataParaSp(a.prazoAtendimento) });
    if (usuario?.id) campos.cd_usuariodosistemaLookupId = String(usuario.id);
    const it = await this.g.criar(lista, campos);
    return { id: Number(it.id), modulo: a.modulo, processoId: a.processoId, acao: a.acao, comentario: a.comentario, data: agora, prazoAtendimento: a.prazoAtendimento, usuario: usuario?.nome ?? null };
  }

  async salvarFluxo(f) {
    const campos = {};
    for (const [k, col] of Object.entries(FLUXO_SP)) campos[col] = f[k];
    if (f.id) await this.g.atualizar(LISTAS.fluxos, f.id, campos);
    else {
      const t = estado.terrenoPorId.get(f.terrenoId);
      await this.g.criar(LISTAS.fluxos, { Title: `Fluxo ${t?.nome ?? f.terrenoId}`, ...campos, cd_terrenoidLookupId: String(f.terrenoId) });
    }
  }

  async salvarTerreno(t) {
    const campos = {};
    for (const [k, col] of Object.entries(TERRENO_SP)) {
      if (t[k] === undefined) continue;
      campos[col] = ["dataDisponibilidade", "previsaoEntrega", "prazoLiberacao"].includes(k) ? dataParaSp(t[k]) : t[k] || null;
    }
    let id = t.id;
    if (id) await this.g.atualizar(LISTAS.terrenos, id, campos);
    else id = Number((await this.g.criar(LISTAS.terrenos, campos)).id);
    if (t.endereco) {
      const e = {};
      for (const [k, col] of Object.entries(ENDERECO_SP)) if (t.endereco[k] !== undefined) e[col] = k === "numero" ? spNum(t.endereco[k]) : t.endereco[k] || null;
      if (t.endereco._id) await this.g.atualizar(LISTAS.enderecos, t.endereco._id, e);
      else if (Object.values(e).some(Boolean)) await this.g.criar(LISTAS.enderecos, { ...e, Title: e.Title || "(sem logradouro)", cd_idterrenoLookupId: String(id) });
    }
    return id;
  }

  /** Grava um lote da IBED. A coluna Terreno pode ser consulta (ID) ou texto/escolha (nome). */
  async salvarLote(lote, campos) {
    const dados = { ...campos };
    if (!lote?.id) {
      const cols = await this.colunas(LISTAS.ibed);
      const t = estado.terrenoPorId.get(lote.terrenoId);
      if (cols.cd_terreno?.tipo === "lookup") dados.cd_terrenoLookupId = String(lote.terrenoId);
      else dados.cd_terreno = t?.nome ?? null;
      const it = await this.g.criar(LISTAS.ibed, dados);
      return Number(it.id);
    }
    await this.g.atualizar(LISTAS.ibed, lote.id, dados);
    return lote.id;
  }

  async atualizarItem(lista, id, campos) { await this.g.atualizar(lista, id, campos); }
  async criarItem(lista, campos) { return this.g.criar(lista, campos); }
  async excluirItem(lista, id) { await this.g.excluir(lista, id); }

  async enviarEmail(para, assunto, html) {
    await this.g.req("/me/sendMail", {
      method: "POST",
      body: JSON.stringify({ message: { subject: assunto, body: { contentType: "HTML", content: html }, toRecipients: para.map((address) => ({ emailAddress: { address } })) }, saveToSentItems: true }),
    });
  }
  async registrarEnvio(r) {
    await this.g.criar(LISTAS.envios, { Title: r.nome, cd_datadoenvio: dataParaSp(hojeISO()), cd_origem: r.origem, cd_quantidade: r.quantidade, cd_enviadopor: r.enviadoPor });
  }
}

      modulo: n.modulo, terrenoId: n.terrenoId ?? null, titulo: n.titulo || "Novo processo", situacao: n.situacao ?? null,
      acao: n.acao ?? null, dataInicio: n.dataInicio ?? null, dataLimiteProtocolo: n.dataLimiteProtocolo ?? null,

    if (!alvo) {
      alvo = { id: Math.max(0, ...b.terrenos.map((x) => x.id)) + 1, regional: null, endereco: null };
      b.terrenos.push(alvo);
    }
    const { endereco, ...resto } = t;
    for (const [k, v] of Object.entries(resto)) if (k !== "id" && v !== undefined) alvo[k] = v === "" ? null : v;
    if (t.unidade !== undefined) { alvo.unidadeTexto = t.unidade; alvo.unidade = normalizarUnidade(t.unidade); }
    if (endereco) alvo.endereco = { ...(alvo.endereco || {}), ...endereco };

      alvo = { id: Math.max(0, ...b.lotes.map((x) => x.id)) + 1, terrenoId: lote.terrenoId, terrenoTexto: estado.terrenoPorId.get(lote.terrenoId)?.nome, campos: {} };
      for (const c of IBED_CAMPOS) alvo.campos[c.col] = null;

  async atualizarItem(lista, id, campos) {

        if ("cd_observacao" in campos) c.observacao = campos.cd_observacao;
        if ("Title" in campos) c.condicionante = campos.Title;
        if ("cd_item" in campos) c.item = campos.cd_item;
        if ("cd_prazo" in campos) c.prazo = spData(campos.cd_prazo);

      const r = b.relatorios.find((x) => x.id === id);

  async criarItem(lista, campos) {
    const b = this.base();
    if (lista === LISTAS.condicionantes) {
      b.condicionantes.push({ id: Math.max(0, ...b.condicionantes.map((x) => x.id)) + 1, ambientalId: Number(campos.cd_ambientalLookupId),
        item: campos.cd_item, condicionante: campos.Title, prazo: spData(campos.cd_prazo), status: campos.cd_status, observacao: campos.cd_observacao });
    } else if (lista === LISTAS.relatorios) {
      b.relatorios.push({ id: Math.max(0, ...b.relatorios.map((x) => x.id)) + 1, ambientalId: Number(campos.cd_ambientalLookupId),
        condicionanteId: spNum(campos.cd_ambientalcondicionanteLookupId), nome: campos.Title, prevista: spData(campos.cd_dataprevistadorelatoriodemon), real: null });
    }
    this.salvar();
  }
  async excluirItem(lista, id) {
    const b = this.base();
    if (lista === LISTAS.terrenos) b.terrenos = b.terrenos.filter((x) => x.id !== id);
    else if (lista === LISTAS.ibed) b.lotes = b.lotes.filter((x) => x.id !== id);
    else if (lista === LISTAS.condicionantes) b.condicionantes = b.condicionantes.filter((x) => x.id !== id);
    else if (lista === LISTAS.relatorios) b.relatorios = b.relatorios.filter((x) => x.id !== id);
    else {
      const m = LISTA_MODULOS.find((d) => d.listaId === lista.id);
      if (m) b.processos = b.processos.filter((x) => !(x.modulo === m.id && x.id === id));
    }
    this.salvar();
  }
  async enviarEmail() { await new Promise((ok) => setTimeout(ok, 300)); }
  async registrarEnvio(r) { this.base().envios.push({ id: Date.now(), nome: r.nome, data: hojeISO(), origem: r.origem, quantidade: r.quantidade, enviadoPor: r.enviadoPor }); this.salvar(); }
  reiniciar() { armazem.gravar(LS.demo, null); this._b = null; }
}

async function carregarBase({ silencioso = false } = {}) {
  const barra = (n, total) => {
    const el = $("#progresso-carga");
    if (el) el.textContent = `Lendo listas do SharePoint… ${n}/${total}`;
  };
  const { base, avisos } = await estado.provedor.carregar(barra);
  estado.base = base;
  estado.avisosCarga = avisos;
  estado.carregadoEm = new Date().toISOString();
  if (estado.usuario) {
    const u = base.usuarios.find((x) => x.email === estado.usuario.email);
    estado.usuario.id = u?.id ?? null;
    estado.usuario.perfil = estado.modo === "demo" ? armazem.ler(LS.demoPerfil, "Administrador") : u?.perfil ?? "Consulta";
    estado.usuario.cadastrado = !!u;
  }
  recalcular();
  if (avisos.length && !silencioso) aviso(`Algumas listas não puderam ser lidas: ${avisos.join(" · ")}`, "erro");
}

/** Executa uma gravação, recarrega os dados e redesenha a tela. */
async function gravar(fn, msgOk = "Salvo.") {
  if (!podeEditar()) { aviso("Seu perfil é somente consulta.", "erro"); return false; }
  try {
    document.body.style.cursor = "progress";
    await fn();
    await carregarBase({ silencioso: true });
    aviso(msgOk, "ok");
    render();
    return true;
  } catch (e) {
    if (e instanceof ErroSessao) { aviso(e.message, "erro"); sairDoApp(); return false; }
    aviso(e.message || String(e), "erro");
    return false;
  } finally {
    document.body.style.cursor = "";
  }
}

const ORDEM_STATUS = ["Concluído", "Em andamento", "Aguardando", "Bloqueado", "Não iniciado"];

function confirmar({ titulo, texto, botao = "Excluir", perigo = true }) {
  return new Promise((ok) => {
    const m = abrirModal({ titulo, largura: 460, corpo: `<p style="margin:0">${texto}</p>`, rodape: `<button class="btn" data-fechar>Cancelar</button><button class="btn ${perigo ? "perigo cheio" : "prim"}" data-x="sim">${esc(botao)}</button>` });
    m.querySelector('[data-x="sim"]').onclick = () => { fecharModal(); ok(true); };

async function confirmarExclusaoProcesso(p, voltar) {
  const ands = andamentosDe(p.modulo, p.id).length;
  const dependentes = estado.base.processos.filter((x) => Object.entries(x.extras).some(([k, v]) => k.endsWith("Id") && v === p.id && ({ parcelamentoId: "parcelamento", geavaId: "geava", gelinId: "gelin", alvaraId: "alvara" })[k] === p.modulo));
  if (dependentes.length) { aviso(`Não é possível excluir: ${dependentes.length} registro(s) dependem deste processo (${dependentes.map((d) => MODULOS[d.modulo].sigla).join(", ")}).`, "erro"); return; }
  const ok = await confirmar({ titulo: `Excluir processo · ${MODULOS[p.modulo].nome}`, texto: `Excluir <b>${esc(p.titulo)}</b>? ${ands ? `Os ${ands} registro(s) da linha do tempo continuam guardados no SharePoint como histórico.` : ""} Esta ação não pode ser desfeita.` });

  if (await gravar(() => estado.provedor.excluirItem(listaDoModulo(p.modulo), p.id), "Processo excluído.")) ir(voltar);
}

/** Ícone do Power Apps: ilustração original (padrão) ou ícone de linha do design 2.0. */
function iconeMenu(ic, img) { return armazem.ler("cd.icones", "ilustrados") === "linha" ? icone(ic) : `<img class="ic-img" src="${IMG[img]}" alt="">`; }
/** Ilustração do módulo ao lado do título da tela. */
function tituloComImagem(img, titulo) { return `<span class="titulo-img">${IMG[img] ? `<img src="${IMG[img]}" alt="">` : ""}<span>${esc(titulo)}</span></span>`; }

function rota() {
  const h = location.hash.replace(/^#\/?/, "");
  const [caminho, qs] = h.split("?");
  return { partes: caminho.split("/").filter(Boolean).map(decodeURIComponent), q: new URLSearchParams(qs || "") };
}
function ir(href) { if (location.hash === href) render(); else location.hash = href.startsWith("#") ? href : `#${href}`; }
/** Troca só um parâmetro (?aba=…) sem perder o resto da rota. */
function irComParam(chave, valor) {
  const { partes, q } = rota();
  if (valor == null || valor === "") q.delete(chave); else q.set(chave, valor);
  const s = q.toString();
  ir(`#/${partes.map(encodeURIComponent).join("/")}${s ? `?${s}` : ""}`);
}

const PAGINAS = {
  "": () => paginaInicio(),
  inicio: () => paginaInicio(),

};

function render() {
  aplicarAparencia();
  const app = $("#app");
  if (!estado.usuario || !estado.base) { app.innerHTML = telaLogin(); ligarLogin(); return; }
  const { partes } = rota();
  ligarPagina = null;
  const pagina = PAGINAS[partes[0] ?? ""] ?? (() => paginaNaoEncontrada());
  let conteudo;
  try { conteudo = pagina(partes); }
  catch (e) { console.error(e); conteudo = `<div class="pagina"><div class="cartao pad"><h2>Algo deu errado nesta tela</h2><p class="mudo">${esc(e.message)}</p><p><a href="#/inicio">Voltar ao início</a></p></div></div>`; }
  const rolagem = app.dataset.rota === location.hash ? window.scrollY : 0;

  if (novaLista) novaLista.scrollTop = listaRol;
  ligarCasca();
  try { ligarPagina?.(); } catch (e) { console.error(e); }
  desenharPainel();
  desenharDili();
}

function ligarCasca() {
  const app = $("#app");
  app.onclick = async (e) => {
    const alvo = e.target.closest("[data-acao]");
    if (!alvo) {
      const linha = e.target.closest("[data-href]");
      if (linha && !e.target.closest("a,button,input,select,textarea,label")) ir(linha.dataset.href);
      if (!e.target.closest("#busca-res, #busca")) { const r = $("#busca-res"); if (r) r.innerHTML = ""; }
      if (!e.target.closest(".multi")) $("#lista-origem")?.classList.add("oculto");
      return;
    }
    const acao = alvo.dataset.acao;
    if (ACOES[acao]) { e.preventDefault(); await ACOES[acao](alvo, e); }
  };
  app.onchange = (e) => {
    if (e.target.closest("#lista-origem")) {
      estado.origens = $$("#lista-origem input:checked").map((i) => i.value);
      armazem.gravar("cd.origens", estado.origens);
      recalcular(); render();
      $("#lista-origem")?.classList.remove("oculto");
    }
  };
  ligarBusca();
}

const ACOES = {
  filtro: (el) => { estado.filtro = el.dataset.v; armazem.gravar(LS.filtro, estado.filtro); recalcular(); render(); },
  tema: () => { estado.tema = estado.tema === "escuro" ? "claro" : "escuro"; armazem.gravar(LS.tema, estado.tema); render(); },
  "limpar-filtros": () => {
    estado.filtro = "todas"; estado.origens = []; armazem.gravar(LS.filtro, "todas"); armazem.gravar("cd.origens", []);
    for (const k of Object.keys(filtrosTela)) delete filtrosTela[k];
    recalcular(); render(); aviso("Filtros limpos.", "info");
  },
  "origem-abrir": () => $("#lista-origem")?.classList.toggle("oculto"),
  painel: (el) => { estado.painel = estado.painel === el.dataset.v ? "" : el.dataset.v; desenharPainel(); render(); },
  atualizar: async (el) => {
    el.disabled = true;

};

/** Estado de filtros/abas de cada tela (zerado por "Limpar filtros"). */
const filtrosTela = {};
function ft(tela, padrao = {}) { return (filtrosTela[tela] ??= { ...padrao }); }

// ---------- busca global (índice igual ao colIndiceBusca) ----------
function indiceBusca() {
  const out = [];
  for (const t of estado.recorte.terrenos) out.push({ href: `#/terrenos/${t.id}`, t: t.nome, s: `Terreno · ${t.unidade ?? "sem concessionária"}`, chave: `${t.nome} ${t.endereco?.bairro ?? ""} ${t.regional ?? ""}` });
  for (const p of estado.recorte.processos) {
    const ex = Object.values(p.extras).filter((v) => typeof v === "string").join(" ");
    const t = estado.terrenoPorId.get(p.terrenoId);
    out.push({ href: linkPara(`/processos/${p.modulo}/${p.id}`), t: p.titulo, s: `${MODULOS[p.modulo].nome} · ${t?.nome ?? "sem terreno"}`, chave: `${p.titulo} ${ex}` });
  }
  return out;
}
function ligarBusca() {
  const inp = $("#busca"), res = $("#busca-res");
  if (!inp) return;
  let foco = -1;
  inp.oninput = () => {
    const q = normalizar(inp.value.trim());
    if (q.length < 2) { res.innerHTML = ""; return; }
    const out = indiceBusca().filter((o) => normalizar(o.chave).includes(q)).slice(0, 25);
    foco = -1;
    res.innerHTML = `<div class="resultados">${out.length ? out.map((o) => `<a href="${o.href}"><b>${esc(o.t)}</b><div class="fraco">${esc(o.s)}</div></a>`).join("") : `<div class="vazio">Nada encontrado.</div>`}</div>`;
  };
  inp.onkeydown = (e) => {
    const itens = $$(".resultados a", res);
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      foco = Math.max(0, Math.min(itens.length - 1, foco + (e.key === "ArrowDown" ? 1 : -1)));
      itens.forEach((a, i) => a.classList.toggle("foco", i === foco));
    } else if (e.key === "Enter" && itens.length) { const h = (itens[foco] || itens[0]).getAttribute("href"); res.innerHTML = ""; inp.value = ""; ir(h); }
    else if (e.key === "Escape") { res.innerHTML = ""; inp.blur(); }
  };
}
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { const b = $("#busca"); if (b) { e.preventDefault(); b.focus(); } }
});

function htmlAlertas(lista, titulo) {
  const linha = (a) => `<tr><td style="padding:6px 10px;border-bottom:1px solid #eee;color:${a.alta ? "#B3261E" : "#8A5300"};font-weight:600">${a.alta ? "Alta" : "Normal"}</td><td style="padding:6px 10px;border-bottom:1px solid #eee">${esc(a.terreno)}</td><td style="padding:6px 10px;border-bottom:1px solid #eee">${esc(a.tipo)}</td><td style="padding:6px 10px;border-bottom:1px solid #eee">${fmtData(a.data)}</td><td style="padding:6px 10px;border-bottom:1px solid #eee">${esc(a.detalhe)}</td></tr>`;
  return `<div style="font-family:Segoe UI,Arial,sans-serif;color:#1F1A26"><div style="background:linear-gradient(135deg,#6F3B8C,#3266AF 60%,#12A9A2);color:#fff;padding:18px 22px;border-radius:12px 12px 0 0"><b style="font-size:18px">Central de Diligenciamento</b><div>${esc(titulo)} · ${fmtData(hojeISO())}</div></div>
    <table style="border-collapse:collapse;width:100%;font-size:13px"><thead><tr style="background:#F6F5F9;text-align:left"><th style="padding:8px 10px">Prioridade</th><th style="padding:8px 10px">Terreno</th><th style="padding:8px 10px">Tipo</th><th style="padding:8px 10px">Data</th><th style="padding:8px 10px">Detalhe</th></tr></thead><tbody>${lista.map(linha).join("")}</tbody></table>
    <p style="font-size:12px;color:#8D8796">${lista.length} pendência(s). Mensagem gerada pela Central de Diligenciamento.</p></div>`;
}
async function enviarAlertas(origem) {
  const todos = [...estado.alertasTodos].sort((a, b) => Number(b.alta) - Number(a.alta) || a.data.localeCompare(b.data));
  const saude = todos.filter((a) => a.unidade !== "INOVA BH");
  const inova = todos.filter((a) => a.unidade !== "SAÚDE BH");
  try {
    if (saude.length) await estado.provedor.enviarEmail([EMAIL_SPE.saude], `Alertas da Central de Diligenciamento · SPE Saúde · ${fmtData(hojeISO())}`, htmlAlertas(saude, `${origem === "Automático" ? "envio automático diário" : "envio manual"} · SPE Saúde Primária BH`));
    if (inova.length) await estado.provedor.enviarEmail([EMAIL_SPE.inova], `Alertas da Central de Diligenciamento · SPE INOVA · ${fmtData(hojeISO())}`, htmlAlertas(inova, `${origem === "Automático" ? "envio automático diário" : "envio manual"} · SPE INOVA BH`));
    try { await estado.provedor.registrarEnvio({ nome: `Envio ${fmtData(hojeISO())}`, origem, quantidade: todos.length, enviadoPor: estado.usuario.email }); } catch { /* o registro não impede o envio */ }
    aviso(`Alertas enviados (${saude.length} para SAÚDE, ${inova.length} para INOVA).`, "ok");
    await carregarBase({ silencioso: true }); render();
  } catch (e) {
    aviso(`Não foi possível enviar pelo Outlook (${e.message}). Abrindo o e-mail para envio manual.`, "erro");
    const corpo = todos.map((a) => `${a.alta ? "[ALTA]" : "[NORMAL]"} ${a.tipo} — ${a.terreno}: ${a.detalhe}`).join("\n");
    location.href = `mailto:${EMAIL_SPE.saude};${EMAIL_SPE.inova}?subject=${encodeURIComponent(`Alertas da Central de Diligenciamento — ${fmtData(hojeISO())}`)}&body=${encodeURIComponent(corpo.slice(0, 1800))}`;
  }
}
async function envioAutomaticoDiario() {
  if (!armazem.ler("cd.envioAuto", false) || !podeEditar() || estado.modo !== "sharepoint") return;
  if (!estado.alertasTodos.length || estado.base.envios?.some((e) => e.data === estado.hoje)) return;
  await enviarAlertas("Automático");
}

function exportarProcessos(lista, nome) {
  const extras = [...new Set(lista.flatMap((p) => MODULOS[p.modulo].extras.map((e) => `${p.modulo}|${e.chave}|${e.rotulo}|${e.tipo}`)))].map((s) => s.split("|"));
  baixarCsv(`${nome}_${hojeISO()}.csv`,
    ["Módulo", "ID", "Título/Protocolo", "Terreno", "Concessionária", "Status", "Situação", "Ação", "Início", "Limite de protocolo", "Previsão de retorno", "Atualização", "Término", "Comentários", ...extras.map((e) => `${MODULOS[e[0]].sigla} · ${e[2]}`)],
    lista.map((p) => {
      const t = estado.terrenoPorId.get(p.terrenoId);
      return [MODULOS[p.modulo].nome, p.id, p.titulo, t?.nome, t?.unidade, statusProcesso(p, estado.hoje), p.situacao, p.acao, fmtData(p.dataInicio), fmtData(p.dataLimiteProtocolo), fmtData(p.previsaoRetorno), fmtData(p.dataAtualizacao), fmtData(p.dataTermino), p.comentarios,
        ...extras.map((e) => (e[0] === p.modulo ? (e[3] === "data" ? fmtData(p.extras[e[1]]) : p.extras[e[1]]) : ""))];
    }));
}

async function iniciar(modo) {
  estado.modo = modo;
  armazem.gravar(LS.modo, modo);
  estado.provedor = modo === "demo" ? new ProvedorDemo() : new ProvedorSharePoint();
  const prog = $("#progresso-carga");
  if (prog) prog.textContent = modo === "demo" ? "Montando a base de demonstração…" : "Conectando ao SharePoint…";
  try {
    estado.usuario = await estado.provedor.quemSou();
    await carregarBase();
    if (estado.modo === "sharepoint" && !estado.usuario.cadastrado) aviso("Usuário sem cadastro na lista Usuário do Sistema: acesso somente para consulta.", "info");
    render();
    envioAutomaticoDiario().catch(() => {});
  } catch (e) {
    estado.usuario = null; estado.base = null;
    if (e instanceof ErroSessao) auth.sair();
    if (prog) prog.textContent = "";
    render();
    aviso(e.message || String(e), "erro");
  }
}

function sairDoApp() {
  if (estado.modo === "sharepoint") auth.sair();
  armazem.gravar(LS.modo, null);
  estado.usuario = null; estado.base = null; estado.modo = null; estado.painel = "";
  history.replaceState(null, "", location.pathname);
  render();
}

function modalConfiguracao() {
  const c = configAtual();
  const corpo = `
    <p class="mudo" style="margin-top:0">Valores do registro do aplicativo no Entra ID (veja o guia de publicação). Ficam salvos neste navegador; para valer para todos, preencha <code>CD_CONFIG</code> no início do arquivo HTML.</p>
    <div class="form" style="grid-template-columns:1fr">
      <label class="rot">ID do aplicativo (cliente)<input class="campo" name="clientId" value="${esc(c.clientId)}" placeholder="00000000-0000-0000-0000-000000000000"></label>
      <label class="rot">ID do diretório (locatário)<input class="campo" name="tenantId" value="${esc(c.tenantId)}" placeholder="00000000-0000-0000-0000-000000000000 ou empresa.onmicrosoft.com"></label>
      <label class="rot">Site do SharePoint<input class="campo" name="site" value="${esc(c.site)}" placeholder="empresa.sharepoint.com:/sites/NomeDoSite"></label>
      <div class="fraco">Endereço de redirecionamento (cadastrar como <b>Aplicativo de página única</b>):<br><code style="user-select:all">${esc(auth.redirectUri())}</code></div>
    </div>`;
  const m = abrirModal({ titulo: "Ligação com o SharePoint", corpo, largura: 560, rodape: `<button class="btn" data-fechar>Cancelar</button><button class="btn prim" data-x="salvar">Salvar</button>` });
  m.querySelector('[data-x="salvar"]').onclick = () => {
    const v = (n) => m.querySelector(`[name=${n}]`).value.trim();
    let site = v("site").replace(/^https?:\/\//, "");
    if (site && !site.includes(":/")) site = site.replace(/\/sites\//, ":/sites/").replace(/\/teams\//, ":/teams/");
    site = site.replace(/\/$/, "");
    armazem.gravar(LS.config, { clientId: v("clientId"), tenantId: v("tenantId"), site });
    fecharModal();
    aviso("Configuração salva.", "ok");
    render();
  };
}

function paginaNaoEncontrada(msg = "Página não encontrada.") {
  return `<div class="pagina"><div class="cartao pad"><h2>${esc(msg)}</h2><p><a href="#/inicio">Voltar ao início</a></p></div></div>`;
}

// Terrenos (lista + cadastro em 2 etapas) e Detalhe do terreno
// (visão 360° + IBED com lotes, como o scrDetalheTerreno do Power Apps).

function linkMaps(t) {
  const e = t?.endereco;
  if (!e?.logradouro) return null;
  const q = `${e.logradouro}${e.numero ? `, ${e.numero}` : ""}${e.bairro ? ` - ${e.bairro}` : ""}${e.cidade ? `, ${e.cidade}` : ""}${e.uf ? `/${e.uf}` : ""}`;
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
}
function enderecoTexto(t) {
  const e = t?.endereco;
  if (!e) return null;
  return [e.logradouro && `${e.logradouro}${e.numero ? `, ${e.numero}` : ""}`, e.complemento, e.bairro, e.cidade && `${e.cidade}${e.uf ? `/${e.uf}` : ""}`].filter(Boolean).join(" · ") || null;
}

function paginaTerrenos() {
  const f = ft("terrenos", { busca: "", sel: null, kpi: "", modo: "lista" });
  const ts = [...estado.recorte.terrenos].sort((a, b) => a.nome.localeCompare(b.nome));
  const comIbed = new Set(estado.recorte.lotes.map((l) => l.terrenoId));
  const kpis = [
    { id: "", t: "Terrenos cadastrados", v: ts.length, sig: icone("m_terrenos") },
    { id: "inova", t: "SPE INOVA BH S.A", v: ts.filter((t) => t.unidade === "INOVA BH").length, sig: "IN" },
    { id: "saude", t: "SPE Saúde Primária BH S/A", v: ts.filter((t) => t.unidade === "SAÚDE BH").length, sig: "SA" },
    { id: "semibed", t: "Sem IBED carregada", v: ts.filter((t) => !comIbed.has(t.id)).length, sig: "!", alerta: true },
  ];
  const lista = ts.filter((t) => !f.kpi || (f.kpi === "inova" && t.unidade === "INOVA BH") || (f.kpi === "saude" && t.unidade === "SAÚDE BH") || (f.kpi === "semibed" && !comIbed.has(t.id)));
  const sel = lista.find((t) => t.id === f.sel) ?? null;

  aoMontar(() => {
    $$("[data-kpi-t]").forEach((b) => (b.onclick = () => { f.kpi = f.kpi === b.dataset.kpiT ? "" : b.dataset.kpiT; render(); }));
    $$("tr[data-sel]").forEach((tr) => {
      tr.onclick = (e) => { if (e.target.closest("a,button")) return; f.sel = Number(tr.dataset.sel); render(); };
      tr.ondblclick = () => ir(`#/terrenos/${tr.dataset.sel}`);
    });
    const inp = $("#t-busca");
    const filtrar = () => { f.busca = inp.value; const q = normalizar(inp.value); let n = 0; for (const tr of $$("tr[data-busca]")) { const ok = !q || tr.dataset.busca.includes(q); tr.classList.toggle("oculto", !ok); if (ok) n++; } $("#t-n").textContent = n; };
    inp.oninput = filtrar; if (f.busca) filtrar();
    $("#t-editar")?.addEventListener("click", () => modalTerreno(sel, 1));
    $("#t-endereco")?.addEventListener("click", () => modalTerreno(sel, 2));
    $("#t-excluir")?.addEventListener("click", () => excluirTerreno(sel));
    $$("[data-modo]").forEach((b) => (b.onclick = () => { f.modo = b.dataset.modo; render(); }));
  });

  const matriz = f.modo === "matriz";
  return `
  <div class="pagina">
    <div class="cabeca"><div><h1>${tituloComImagem("terrenos", "Terrenos")}</h1><p class="mudo">Cadastro único: cada terreno é vinculado a todos os seus processos</p></div>
      <div class="acoes"><div class="opcao-seg"><button data-modo="lista" class="${!matriz ? "ativo" : ""}">Lista</button><button data-modo="matriz" class="${matriz ? "ativo" : ""}">Matriz por órgão</button></div>
      ${podeEditar() ? `<button class="btn prim" data-acao="novo-terreno">${icone("mais")} Novo terreno</button>` : ""}</div></div>
    <div class="kpis">${kpis.map((k) => `<button class="cartao kpi ${f.kpi === k.id && k.id ? "ativo" : ""} ${k.alerta && k.v ? "kpi-alerta" : ""}" data-kpi-t="${k.id}"><span class="t">${esc(k.t)}</span><b>${k.v}</b><span class="sig">${k.sig.startsWith("<") ? k.sig : esc(k.sig)}</span></button>`).join("")}</div>
    <div class="cartao">
      <div class="titulo" style="flex-wrap:wrap">
        <div class="busca-campo" style="width:300px;max-width:100%">${icone("busca")}<input class="campo" id="t-busca" placeholder="Pesquisar terreno" value="${esc(f.busca)}"></div>
        <div class="acoes">
          ${sel ? `<span class="fraco">Selecionado: <b>${esc(sel.nome)}</b></span>` : `<span class="fraco">Clique numa linha para selecionar · duplo clique abre o detalhe</span>`}
          ${sel && podeEditar() ? `<button class="btn peq" id="t-editar">${icone("editar")} Editar terreno</button><button class="btn peq" id="t-endereco">${icone("mapa")} Editar endereço</button>` : ""}
          ${sel && linkMaps(sel) ? `<a class="btn peq" href="${linkMaps(sel)}" target="_blank" rel="noopener">${icone("mapa")} Ver no Maps</a>` : ""}
          <button class="btn peq" data-acao="atualizar">${icone("atualizar")} Atualizar</button>
          ${sel && ehAdmin() ? `<button class="btn peq perigo" id="t-excluir">${icone("lixo")} Excluir</button>` : ""}
        </div>
      </div>
      <div class="tabela-env"><table class="tabela">
        <thead><tr><th>Terreno (<span id="t-n">${lista.length}</span>)</th>${matriz ? MODULOS_MATRIZ.map((m) => `<th style="text-align:center">${esc(MODULOS[m].sigla)}</th>`).join("") + "<th>Risco</th>" : "<th>Endereço</th><th>Disponível desde</th><th>Etapa</th><th>Risco</th>"}<th></th></tr></thead>
        <tbody>${lista.map((t) => { const r = estado.mapaResumo.get(t.id); return `
          <tr class="clica ${sel?.id === t.id ? "sel" : ""}" data-sel="${t.id}" data-busca="${esc(normalizar(`${t.nome} ${enderecoTexto(t) ?? ""} ${t.regional ?? ""} ${t.origemDemanda ?? ""}`))}">
            <td><b>${esc(t.nome)}</b> ${seloUnidade(t.unidade)}<div class="fraco">${esc([t.origemDemanda, t.regional && `Regional ${t.regional}`].filter(Boolean).join(" · "))}</div></td>
            ${matriz ? MODULOS_MATRIZ.map((m) => `<td style="text-align:center">${celulaMatriz(r, m)}</td>`).join("") + `<td>${r ? seloRisco(r) : ""}</td>`
              : `<td class="fraco">${esc(enderecoTexto(t) ?? "—")}</td><td class="num">${fmtData(t.dataDisponibilidade)}</td><td>${esc(r?.etapa ?? "—")}</td><td>${r ? seloRisco(r) : ""}</td>`}
            <td><a class="btn peq" href="#/terrenos/${t.id}">Abrir detalhe</a></td></tr>`; }).join("") || `<tr><td colspan="16">${imgVazia("terrenos", "Nenhum terreno com esses filtros.")}</td></tr>`}</tbody>
      </table></div>
      ${matriz ? `<div class="corpo legenda fraco">Letra colorida = situação do processo · <b style="color:var(--aviso)">!</b> exigido pelo fluxograma e não aberto · borda vermelha = conflito com o fluxograma · · = não se aplica</div>` : ""}
    </div>
  </div>`;
}

function celulaMatriz(r, m) {
  const c = r?.modulos[m];
  if (!c) return "";
  const estilo = (s) => `display:inline-grid;place-items:center;width:26px;height:22px;border-radius:7px;font-size:11px;font-weight:700`;
  if (!c.qtd) {
    if (c.situacao === "a-abrir") return `<span class="selo sem s-Aguardando" style="${estilo()};outline:2px dashed currentColor" title="${esc(MODULOS[m].nome)}: exigido e não aberto">!</span>`;
    if (c.aplicavel === false) return `<span class="fraco" title="Não se aplica">·</span>`;
    return `<span class="fraco">–</span>`;
  }
  return `<span class="selo sem ${classeStatus(c.status)}" style="${estilo()}${c.situacao === "conflito" ? ";outline:2px solid var(--perigo)" : ""}" title="${esc(MODULOS[m].nome)}: ${esc(c.status)}${c.qtd > 1 ? ` (${c.qtd})` : ""}${c.situacao === "conflito" ? " — conflito com o fluxograma" : ""}">${c.qtd > 1 ? c.qtd : MODULOS[m].sigla[0]}</span>`;
}

async function excluirTerreno(t) {
  const procs = estado.base.processos.filter((p) => p.terrenoId === t.id).length;
  const lotes = estado.base.lotes.filter((l) => l.terrenoId === t.id).length;
  if (procs || lotes) { aviso(`Não é possível excluir ${t.nome}: há ${procs} processo(s) e ${lotes} lote(s) vinculados. Exclua ou transfira esses registros antes.`, "erro"); return; }
  if (!(await confirmar({ titulo: "Excluir terreno", texto: `Excluir <b>${esc(t.nome)}</b>? Esta ação não pode ser desfeita.` }))) return;
  await gravar(async () => {
    if (t.endereco?._id) await estado.provedor.excluirItem(LISTAS.enderecos, t.endereco._id);
    const fl = estado.base.fluxos.find((x) => x.terrenoId === t.id);
    if (fl?.id && estado.modo === "sharepoint") await estado.provedor.excluirItem(LISTAS.fluxos, fl.id);
    await estado.provedor.excluirItem(LISTAS.terrenos, t.id);
    ft("terrenos").sel = null;
  }, "Terreno excluído.");
}

// =====================================================================
// Detalhe do terreno
// =====================================================================
function paginaTerreno(id) {
  const t = estado.terrenoPorId.get(id);
  if (!t) return paginaNaoEncontrada("Terreno não encontrado.");
  const aba = rota().q.get("aba") || "visao";
  const r = estado.mapaResumoTodos.get(id);
  const procs = estado.base.processos.filter((p) => p.terrenoId === id);
  const chaves = new Set(procs.map((p) => `${p.modulo}:${p.id}`));
  const ands = estado.base.andamentos.filter((a) => chaves.has(`${a.modulo}:${a.processoId}`)).sort((a, b) => b.data.localeCompare(a.data));
  const alertas = estado.alertasTodos.filter((a) => a.terrenoId === id);
  const lotes = estado.base.lotes.filter((l) => l.terrenoId === id).sort((a, b) => chaveLote(a.campos.Title).localeCompare(chaveLote(b.campos.Title), "pt-BR", { numeric: true }));
  const maps = linkMaps(t);

  let corpo = "";
  if (aba === "visao") corpo = abaVisao360(t, r, procs, alertas);
  else if (aba === "ibed") corpo = abaIbed(t, lotes);
  else if (aba === "linha") corpo = `<div class="cartao pad">${linhaDoTempoHtml(ands, true)}</div>`;
  else if (aba === "alertas") corpo = `<div>${listaAlertasHtml(alertas)}</div>`;

  const ligarIbedFn = aba === "ibed" ? () => ligarIbed(t, lotes) : null;
  aoMontar(() => {
    ligarAbas();
    $("#d-voltar").onclick = () => history.length > 1 ? history.back() : ir("#/terrenos");
    $("#d-editar")?.addEventListener("click", () => modalTerreno(t, 1));
    $("#d-fluxo")?.addEventListener("click", () => ir(`#/fluxograma/${t.id}`));
    $$("[data-abrir-mod]").forEach((b) => (b.onclick = () => modalProcesso(b.dataset.abrirMod, null, id)));
    $("#d-vincular")?.addEventListener("click", () => modalProcesso(null, null, id));
    $("#d-imprimir")?.addEventListener("click", () => window.print());
    ligarIbedFn?.();
  });

  return `
  <div class="pagina">
    <div class="cabeca">
      <div>
        <div class="trilha"><a href="#/terrenos">Terrenos</a> / Detalhe do terreno</div>
        <h1>${esc(t.nome)}</h1>
        <p class="mudo">${seloUnidade(t.unidade)} ${esc(enderecoTexto(t) ?? "Endereço não cadastrado")}${t.regional ? ` · Regional ${esc(t.regional)}` : ""}</p>
      </div>
      <div class="acoes">
        <button class="btn" id="d-voltar">${icone("voltar")} Voltar</button>
        ${maps ? `<a class="btn" href="${maps}" target="_blank" rel="noopener">${icone("mapa")} Ver no Maps</a>` : ""}
        <button class="btn" id="d-fluxo">${icone("m_fluxograma")} Fluxograma</button>
        <button class="btn" id="d-imprimir">${icone("imprimir")} Ficha</button>
        ${podeEditar() ? `<button class="btn" id="d-editar">${icone("editar")} Editar terreno</button><button class="btn prim" id="d-vincular">${icone("mais")} Vincular processo</button>` : ""}
      </div>
    </div>
    <div class="abas">
      ${[["visao", "Visão 360°"], ["ibed", "IBED e lotes", lotes.length], ["linha", "Linha do tempo", ands.length], ["alertas", "Alertas", alertas.length]]
        .map(([k, n, q]) => `<button data-aba="${k}" class="${aba === k ? "ativo" : ""}">${n}${q != null ? `<span class="n">${q}</span>` : ""}</button>`).join("")}
    </div>
    ${corpo}
  </div>`;
}

function abaVisao360(t, r, procs, alertas) {
  const etapas = ["Parcelamento do Solo", "Licenciamento", "Obra", "Operação"];
  const idx = etapas.indexOf(r?.etapa);
  const porModulo = LISTA_MODULOS.map((m) => ({ m, lista: procs.filter((p) => p.modulo === m.id) })).filter((x) => x.lista.length);
  const fluxo = estado.base.fluxos.find((f) => f.terrenoId === t.id);
  return `
    ${faixaAlertas(alertas, `${alertas.length} alerta(s) neste terreno`)}
    <div class="grade g-lado">
      <div class="cartao pad" style="display:grid;gap:16px">
        <div class="jornada">${etapas.map((e, i) => `<div class="${i < idx ? "feito" : i === idx ? "atual" : ""}">${e}</div>`).join("")}</div>
        <dl class="dl">
          ${campoDl("Concessionária", t.unidadeTexto ?? t.unidade)}
          ${campoDl("Origem da demanda", t.origemDemanda)}
          ${campoDl("Responsável", t.responsavel)}
          ${campoDl("Fase do empreendimento", t.fase)}
          ${campoDl("Disponível desde", fmtData(t.dataDisponibilidade) === "—" ? null : fmtData(t.dataDisponibilidade))}
          <div><dt>Prazo de liberação</dt><dd>${fmtData(t.prazoLiberacao)} <span class="fraco">${esc(t.prazoLiberacao ? textoPrazo(t.prazoLiberacao) : "")}</span></dd></div>
          <div><dt>Liberação prevista</dt><dd style="${r?.liberacaoPrevista && t.prazoLiberacao && r.liberacaoPrevista > t.prazoLiberacao ? "color:var(--perigo);font-weight:700" : ""}">${fmtData(r?.liberacaoPrevista)}</dd></div>
          ${campoDl("Previsão de entrega da obra", t.previsaoEntrega ? fmtData(t.previsaoEntrega) : null)}
          <div><dt>Progresso</dt><dd><div style="display:flex;gap:8px;align-items:center"><div class="progresso" style="flex:1"><i style="width:${Math.round((r?.progresso ?? 0) * 100)}%"></i></div>${Math.round((r?.progresso ?? 0) * 100)}%</div></dd></div>
        </dl>
        ${t.modificadoPor ? `<div class="fraco">Última alteração do cadastro: ${esc(t.modificadoPor)} · ${esc(fmtDataHora(t.modificadoEm))}</div>` : ""}
      </div>
      <div class="cartao pad" style="display:grid;gap:12px;align-content:start">
        <div style="display:flex;gap:14px;align-items:center">
          <div class="medidor" style="--v:${r?.risco ?? 0};--c:${r?.nivelRisco === "Alto" ? "#D9534A" : r?.nivelRisco === "Médio" ? "#E0A33A" : "#12A9A2"}"><b>${r?.risco ?? 0}</b></div>
          <div><h2>Risco ${esc((r?.nivelRisco ?? "baixo").toLowerCase())}</h2><div class="fraco">Índice de 0 a 100, recalculado a cada leitura</div></div>
        </div>
        ${r?.motivosRisco.length ? `<ul style="margin:0;padding-left:18px">${r.motivosRisco.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>` : `<p class="mudo" style="margin:0">Nenhum ponto de atenção.</p>`}
        ${!fluxo ? `<div class="faixa-alerta media">${icone("m_fluxograma")}<div>Fluxograma ainda não respondido. <a href="#/fluxograma/${t.id}?aba=perguntas">Responder agora</a></div></div>` : ""}
        ${r?.aAbrir.length && podeEditar() ? `<div><div class="fraco" style="margin-bottom:6px">Exigidos pelo fluxograma e ainda não abertos:</div><div class="acoes">${r.aAbrir.map((m) => `<button class="btn peq" data-abrir-mod="${m}">${icone("mais")} ${esc(MODULOS[m].nome)}</button>`).join("")}</div></div>` : ""}
      </div>
    </div>
    ${porModulo.length ? `<div class="grade g3">${porModulo.map(({ m, lista }) => `
      <div class="cartao">
        <div class="titulo"><h3>${esc(m.nome)}</h3><span class="fraco">${esc(m.area)}</span></div>
        <div class="corpo" style="display:grid;gap:8px">
          ${lista.map((p) => { const st = statusProcesso(p, estado.hoje); const prev = previsaoConclusao(p, estado.medianas); return `
            <a href="${linkPara(`/processos/${p.modulo}/${p.id}`)}" class="item-lista" style="border-color:var(--linha)">
              <div class="tx"><b>${esc(p.titulo)}</b><span>${esc(p.situacao ?? "Sem situação")}${prev && !processoEncerrado(p) ? ` · previsão ${fmtData(prev)}` : ""}</span></div>${seloStatus(st)}</a>`; }).join("")}
        </div>
      </div>`).join("")}</div>` : imgVazia("processos", "Nenhum processo vinculado a este terreno ainda.")}`;
}

// ---------- IBED e lotes ----------
function abaIbed(t, lotes) {
  const f = ft(`ibed:${t.id}`, { lote: lotes[0]?.id ?? null, editando: false, fechadas: [] });
  if (!lotes.some((l) => l.id === f.lote)) f.lote = lotes[0]?.id ?? null;
  const lote = lotes.find((l) => l.id === f.lote) ?? null;
  const area = lotes.reduce((s, l) => s + (Number(l.campos.cd_areadolote) || 0), 0);
  const zon = [...new Set(lotes.map((l) => l.campos.cd_zoneamento).filter(Boolean))].join(" · ");
  const zf = [...new Set(lotes.map((l) => [l.campos.cd_zonafiscal, l.campos.cd_quarteirao].filter((x) => x != null && x !== "").join(" / ")).filter(Boolean))].join(" · ");
  const kp = [["Total de lotes", lotes.length], ["Área total", area ? `${area.toLocaleString("pt-BR", { maximumFractionDigits: 2 })} m²` : "—"], ["Zoneamento", zon || "—"], ["Zona fiscal / Quarteirão", zf || "—"], ["Regional", t.regional || "—"]];
  return `
    <div class="kpis">${kp.map(([n, v]) => `<div class="cartao kpi"><span class="t">${esc(n)}</span><b style="font-size:${String(v).length > 10 ? 16 : 26}px">${esc(v)}</b></div>`).join("")}</div>
    <div class="md">
      <div class="cartao md-lista">
        <div class="topo-lista"><div style="display:flex;justify-content:space-between;align-items:center"><b>Lotes</b>${podeEditar() ? `<button class="btn peq prim" id="l-add">${icone("mais")} Adicionar</button>` : ""}</div></div>
        <div class="itens">${lotes.map((l) => `
          <div class="item-lista ${l.id === f.lote ? "sel" : ""}" style="flex-wrap:wrap;cursor:pointer" data-lote="${l.id}">

          <div><h2>${lote ? `Lote ${esc(lote.campos.Title ?? "")}` : "IBED"}</h2><div class="fraco">${lote ? (f.editando ? "Editando a IBED · altere os campos e clique em Salvar IBED" : `Informação Básica para Edificação${lote.modificadoPor ? ` · alterada por ${esc(lote.modificadoPor)} em ${esc(fmtDataHora(lote.modificadoEm))}` : ""}`) : "Selecione um lote à esquerda para ver as informações da IBED."}</div></div>
          <div class="acoes">${podeEditar() ? (f.editando
            ? `<button class="btn" id="i-cancelar">Cancelar</button><button class="btn prim" id="i-salvar">Salvar IBED</button>`
            : `<button class="btn prim" id="i-carregar">${icone("upload")} Carregar IBED</button>${lote ? `<button class="btn" id="i-editar">${icone("editar")} Editar IBED</button>` : ""}`) : ""}</div>
        </div></div>

          ${lote ? IBED_SECOES.map((s) => `

                : `<dl class="dl">${s.campos.map(([rot, col, tipo]) => campoDl(rot, tipo === "numero" && lote.campos[col] != null ? Number(lote.campos[col]).toLocaleString("pt-BR") : lote.campos[col])).join("")}</dl>`}

}
function campoIbed(rot, col, tipo, v) {
  if (tipo === "simnao") return `<label class="rot">${esc(rot)}<select class="campo" data-col="${col}"><option value="">—</option>${["Sim", "Não"].map((o) => `<option ${o === v ? "selected" : ""}>${o}</option>`).join("")}</select></label>`;
  return `<label class="rot">${esc(rot)}<input class="campo" data-col="${col}" ${tipo === "numero" ? 'type="number" step="any"' : ""} value="${esc(v ?? "")}"></label>`;
}

function ligarIbed(t, lotes) {
  const f = ft(`ibed:${t.id}`);
  const lote = lotes.find((l) => l.id === f.lote) ?? null;
  $$("[data-lote]").forEach((el) => (el.onclick = (e) => { if (e.target.closest("button")) return; if (f.editando) { aviso("Salve ou cancele a edição antes de trocar de lote.", "info"); return; } f.lote = Number(el.dataset.lote); render(); }));
  $$("[data-secao]").forEach((b) => (b.onclick = () => { const s = b.dataset.secao; f.fechadas = f.fechadas.includes(s) ? f.fechadas.filter((x) => x !== s) : [...f.fechadas, s]; b.parentElement.classList.toggle("fechada"); }));
  $("#i-editar")?.addEventListener("click", () => { f.editando = true; render(); });
  $("#i-cancelar")?.addEventListener("click", () => { f.editando = false; render(); });
  $("#i-salvar")?.addEventListener("click", async () => {
    const campos = {};
    for (const el of $$("[data-col]")) {
      const c = IBED_CAMPOS.find((x) => x.col === el.dataset.col);
      const v = el.value.trim();
      campos[c.col] = v === "" ? null : c.tipo === "numero" ? Number(v) : v;
    }
    if (!campos.Title) { aviso("Informe o número do LOTE.", "erro"); return; }
    if (await gravar(() => estado.provedor.salvarLote(lote, campos), "IBED salva.")) { f.editando = false; render(); }
  });
  $("#i-carregar")?.addEventListener("click", () => modalCarregarIbed(t, lote));
  $("#l-add")?.addEventListener("click", () => modalLote(t, null));
  $$("[data-l-dup]").forEach((b) => (b.onclick = () => modalLote(t, lotes.find((l) => l.id === Number(b.dataset.lDup)))));
  $$("[data-l-exc]").forEach((b) => (b.onclick = async () => {
    const l = lotes.find((x) => x.id === Number(b.dataset.lExc));
    if (!(await confirmar({ titulo: "Excluir lote", texto: `Excluir o <b>Lote ${esc(l.campos.Title ?? "")}</b> e a IBED dele? Esta ação não pode ser desfeita.` }))) return;
    if (await gravar(() => estado.provedor.excluirItem(LISTAS.ibed, l.id), "Lote excluído.")) { f.lote = null; render(); }
  }));
}

/** Adicionar lote (rápido) ou duplicar um lote existente (copia a IBED). */
function modalLote(t, origem) {
  const corpo = `<p class="mudo" style="margin-top:0">${origem ? `Cria um novo lote com todas as informações da IBED do Lote ${esc(origem.campos.Title ?? "")}. Informe o número e a área do novo lote.` : `Crie o lote e depois carregue ou edite a IBED.`}</p>
    <div class="form"><label class="rot">LOTE *<input class="campo" name="lote" required placeholder="Ex.: 012"></label>
    <label class="rot">Área do lote (m²)<input class="campo" name="area" type="number" step="any" value="${esc(origem?.campos.cd_areadolote ?? "")}"></label></div>`;
  const m = abrirModal({ titulo: origem ? "Duplicar lote" : "Adicionar lote", corpo, largura: 520, rodape: botaoSalvar(origem ? "Duplicar" : "Adicionar") });
  aoSalvar(m, (v) => {
    const lotes = estado.base.lotes.filter((l) => l.terrenoId === t.id);
    if (lotes.some((l) => chaveLote(l.campos.Title) === chaveLote(v.lote))) { aviso(`Já existe o Lote ${v.lote} neste terreno.`, "erro"); return false; }
    const campos = origem ? { ...origem.campos } : {};
    campos.Title = v.lote;
    campos.cd_areadolote = v.area != null ? Number(v.area) : null;
    return gravar(async () => {
      const id = await estado.provedor.salvarLote({ terrenoId: t.id }, campos);
      ft(`ibed:${t.id}`).lote = id;
    }, origem ? "Lote duplicado." : "Lote criado.");
  });
}

/** "Carregar IBED": cola o texto do PDF, extrai os campos e salva no lote. */
function modalCarregarIbed(t, loteSel) {
  const corpo = `
    <div class="faixa-alerta info" style="margin-bottom:12px">${icone("upload")}<div>Abra o PDF da IBED, pressione <b>Ctrl+A</b>, <b>Ctrl+C</b> e cole aqui (<b>Ctrl+V</b>). ${loteSel ? `Os dados vão para o <b>Lote ${esc(loteSel.campos.Title ?? "")}</b> (selecionado).` : "Um lote novo é criado com o número que estiver na IBED."}</div></div>
    <textarea class="campo" id="ibed-txt" style="min-height:240px;font-family:Consolas,monospace;font-size:12px" placeholder="Cole aqui o texto da IBED…"></textarea>
    <div id="ibed-previa" class="fraco" style="margin-top:8px"></div>`;
  const m = abrirModal({ titulo: "Carregar IBED", corpo, largura: 760, rodape: `<button class="btn" data-fechar>Cancelar</button>${loteSel ? `<button class="btn" data-x="novo">Criar lote novo</button>` : ""}<button class="btn prim" data-x="salvar">Extrair e salvar</button>` });
  const ta = m.querySelector("#ibed-txt");
  ta.oninput = () => {
    const v = lerTextoIbed(ta.value);
    const n = Object.values(v).filter((x) => x != null && x !== "").length;
    m.querySelector("#ibed-previa").innerHTML = ta.value.trim() ? `${n} campo(s) reconhecido(s)${v.cd_solicitante ? ` · Solicitação <b>${esc(v.cd_solicitante)}</b>` : ""}${v.Title ? ` · Lote <b>${esc(v.Title)}</b>` : ""}${v.cd_zoneamento ? ` · Zoneamento ${esc(v.cd_zoneamento)}` : ""}` : "";
  };
  const salvar = async (forcarNovo) => {
    const v = lerTextoIbed(ta.value);
    if (!v.cd_solicitante) { aviso("Não reconheci o texto como uma IBED (número da solicitação não encontrado). Confira se copiou o PDF inteiro (Ctrl+A, Ctrl+C).", "erro"); return; }
    const alvoSel = forcarNovo ? null : loteSel;
    if (alvoSel && v.Title && chaveLote(alvoSel.campos.Title) && chaveLote(alvoSel.campos.Title) !== chaveLote(v.Title)) {
      aviso(`Esta IBED é do Lote ${v.Title}, mas o lote selecionado é o ${alvoSel.campos.Title}. Selecione o lote correto (ou use "Criar lote novo").`, "erro"); return;
    }
    if (!alvoSel && !v.Title) { aviso("Não encontrei o número do lote na IBED. Selecione o lote na lista antes de carregar.", "erro"); return; }
    const existente = alvoSel ?? estado.base.lotes.find((l) => l.terrenoId === t.id && chaveLote(l.campos.Title) === chaveLote(v.Title)) ?? null;
    const campos = {};
    for (const c of IBED_CAMPOS) {
      const novo = v[c.col];
      const antigo = existente?.campos[c.col];
      campos[c.col] = novo != null && novo !== "" ? novo : antigo ?? null;
    }
    campos.Title = existente?.campos.Title || v.Title;
    const ok = await gravar(async () => {
      const id = await estado.provedor.salvarLote(existente ?? { terrenoId: t.id }, campos);
      ft(`ibed:${t.id}`).lote = id;
    }, `IBED ${v.cd_solicitante} salva no Lote ${campos.Title}. Confira os campos.`);
    if (ok) fecharModal();
  };
  m.querySelector('[data-x="salvar"]').onclick = () => salvar(false);
  m.querySelector('[data-x="novo"]')?.addEventListener("click", () => salvar(true));
}

function procsDoRecorte(modulo) { return estado.recorte.processos.filter((p) => p.modulo === modulo); }

  const t = terrenoDoProcesso(p);
  return `${seloUnidade(t?.unidade)} ${seloStatus(stDe(p))}`;
}
function subTerreno(p) {
  const t = terrenoDoProcesso(p);

function paginaParcelamento(selId) {
  const ps = procsDoRecorte("parcelamento").sort((a, b) => (nomeTerreno(a.terrenoId) ?? "~").localeCompare(nomeTerreno(b.terrenoId) ?? "~"));
  const limite90 = somaDias(estado.hoje, 90);
  const armbhDe = (p) => estado.base.processos.filter((a) => a.modulo === "armbh" && a.extras.parcelamentoId === p.id);
  const kpis = [
    { id: "and", t: "Em andamento", v: ps.filter((p) => ["Em andamento", "Aguardando"].includes(stDe(p))).length, filtro: (it) => ["Em andamento", "Aguardando"].includes(stDe(porId(it.id))), sig: "PS" },
    { id: "ini", t: "A iniciar", v: ps.filter((p) => stDe(p) === "Não iniciado").length, filtro: (it) => stDe(porId(it.id)) === "Não iniciado", sig: "0" },
    { id: "ok", t: "Concluídos", v: ps.filter((p) => stDe(p) === "Concluído").length, filtro: (it) => stDe(porId(it.id)) === "Concluído", sig: "✓" },
    { id: "armbh", t: "Com ARMBH", v: ps.filter((p) => p.extras.requerArmbh === "Sim" || armbhDe(p).length).length, filtro: (it) => { const p = porId(it.id); return p.extras.requerArmbh === "Sim" || armbhDe(p).length > 0; }, sig: "AR" },
    { id: "venc", t: "Diretrizes a vencer (90 dias)", v: ps.filter((p) => p.extras.vencimentoDiretrizes && p.extras.vencimentoDiretrizes <= limite90 && stDe(p) !== "Concluído").length, filtro: (it) => { const p = porId(it.id); return p.extras.vencimentoDiretrizes && p.extras.vencimentoDiretrizes <= limite90 && stDe(p) !== "Concluído"; }, sig: "!", alerta: true },
  ];
  function porId(id) { return ps.find((p) => p.id === id); }
  const p = selId ? estado.processoPorChave.get(`parcelamento:${selId}`) : null;
  let detalhe = null, ligarDet = () => {};
  if (p) {
    const aba = rota().q.get("aba") || "dados";
    const armbhs = armbhDe(p);
    const temArmbh = p.extras.requerArmbh === "Sim" || armbhs.length > 0;
    let corpo = "";
    if (aba === "dados") {
      corpo = `${faixaAlertas(alertasDe("parcelamento", p.id))}
        <dl class="dl">
          ${campoDl("Modalidade", p.extras.modalidade)}${campoDl("Fase do processo", p.extras.faseProcesso)}${campoDl("Requer ARMBH", p.extras.requerArmbh)}
          ${campoDl("Data de início", p.dataInicio && fmtData(p.dataInicio))}
          <div><dt>Vencimento das diretrizes</dt><dd style="${p.extras.vencimentoDiretrizes && p.extras.vencimentoDiretrizes < estado.hoje ? "color:var(--perigo);font-weight:700" : ""}">${fmtData(p.extras.vencimentoDiretrizes)} <span class="fraco">${esc(p.extras.vencimentoDiretrizes && stDe(p) !== "Concluído" ? textoPrazo(p.extras.vencimentoDiretrizes) : "")}</span></dd></div>
          ${campoDl("Situação", p.situacao)}${campoDl("Ação", p.acao)}
          ${campoDl("Data limite para protocolo", p.dataLimiteProtocolo && fmtData(p.dataLimiteProtocolo))}${campoDl("Previsão de retorno", p.previsaoRetorno && fmtData(p.previsaoRetorno))}
          ${p.comentarios ? campoDl("Comentários", p.comentarios, true) : ""}
        </dl>${cartaoUltima("parcelamento", p)}`;
    } else if (aba === "linha") corpo = abaLinhaDoTempo(p);
    else if (aba === "armbh") corpo = abaArmbh(p, armbhs);
    detalhe = `${cabDetalhe({ selos: selosProcesso(p), titulo: p.titulo, sub: subTerreno(p), botoes: botoesProcesso(p),
      abas: [["dados", "Dados do processo"], ["linha", "Linha do tempo", andamentosDe("parcelamento", p.id).length], ...(temArmbh ? [["armbh", "ARMBH", armbhs.length]] : [])], abaAtiva: aba })}
      <div class="corpo-det">${corpo}</div>`;
    ligarDet = () => {
      ligarAbas(); ligarBotoesProcesso(p, "#/parcelamento");
      $("[data-armbh-novo]")?.addEventListener("click", () => modalProcesso("armbh", null, p.terrenoId, { parcelamentoId: p.id }));
      $$("[data-armbh-editar]").forEach((b) => (b.onclick = () => modalProcesso("armbh", estado.processoPorChave.get(`armbh:${b.dataset.armbhEditar}`), p.terrenoId)));

    kpis, buscaPlaceholder: "Pesquisar terreno ou protocolo", selId,

  });
  aoMontar(() => { md.ligar(); ligarDet(); });
  return md.html;

        </a>`; }).join("")}
      <a class="cartao hub-card fluxo" href="#/fluxograma"><img src="${IMG.fluxograma}" alt=""><span class="tag">VISÃO GERAL</span><h3>Fluxograma</h3>
        <p>Veja em que etapa cada terreno está, do parcelamento à regularização.</p><div class="rod"><b>Abrir fluxograma ›</b></div></a>
    </div>

      <div class="corpo">${ults.length ? linhaDoTempoHtml(ults, true) : `<div class="vazio">Nenhuma atualização registrada ainda.</div>`}</div></div>
  </div>`;
}

function paginaOrgao(modulo, selId) {
  const o = ORGAOS[modulo];
  if (!o) return paginaNaoEncontrada("Módulo não encontrado.");
  const def = MODULOS[modulo];
  const ps = procsDoRecorte(modulo).sort((a, b) => (nomeTerreno(a.terrenoId) ?? "~").localeCompare(nomeTerreno(b.terrenoId) ?? "~"));
  const lim30 = somaDias(estado.hoje, 30);
  const porId = (id) => ps.find((p) => p.id === id);
  const kpis = [
    { id: "and", t: "Em andamento", v: ps.filter((p) => ["Em andamento", "Aguardando"].includes(stDe(p))).length, filtro: (it) => ["Em andamento", "Aguardando"].includes(stDe(porId(it.id))), sig: "▶" },
    { id: "ini", t: "A iniciar", v: ps.filter((p) => stDe(p) === "Não iniciado").length, filtro: (it) => stDe(porId(it.id)) === "Não iniciado", sig: "0" },
    { id: "ok", t: "Concluídos", v: ps.filter((p) => stDe(p) === "Concluído").length, filtro: (it) => stDe(porId(it.id)) === "Concluído", sig: "✓" },
    { id: "blq", t: "Reprovados / cancelados", v: ps.filter((p) => stDe(p) === "Bloqueado").length, filtro: (it) => stDe(porId(it.id)) === "Bloqueado", sig: "✕", alerta: true },
    { id: "lim", t: "Protocolo a vencer (30 dias)", v: ps.filter((p) => p.dataLimiteProtocolo && p.dataLimiteProtocolo <= lim30 && !processoEncerrado(p)).length, filtro: (it) => { const p = porId(it.id); return p.dataLimiteProtocolo && p.dataLimiteProtocolo <= lim30 && !processoEncerrado(p); }, sig: "!", alerta: true },
  ];
  const p = selId ? estado.processoPorChave.get(`${modulo}:${selId}`) : null;
  let detalhe = null, ligarDet = () => {};
  if (p) {
    const aba = rota().q.get("aba") || "dados";
    const prev = previsaoConclusao(p, estado.medianas);
    const corpo = aba === "linha" ? abaLinhaDoTempo(p) : `${faixaAlertas(alertasDe(modulo, p.id))}
      <dl class="dl">
        ${campoDl(def.rotuloTitulo, p.titulo)}
        <div><dt>Início → ${modulo === "alvara" ? "emissão" : "término"}</dt><dd>${fmtData(p.dataInicio)} → ${fmtData(p.dataTermino)}</dd></div>
        ${campoDl("Situação", p.situacao)}${campoDl("Ação", p.acao)}
        ${campoDl("Previsão de retorno", p.previsaoRetorno && fmtData(p.previsaoRetorno))}
        <div><dt>Data limite de protocolo</dt><dd>${fmtData(p.dataLimiteProtocolo)} <span class="fraco">${esc(p.dataLimiteProtocolo && !processoEncerrado(p) ? textoPrazo(p.dataLimiteProtocolo) : "")}</span></dd></div>
        <div><dt>Conclusão prevista</dt><dd>${processoEncerrado(p) ? "—" : fmtData(prev)}${!p.previsaoRetorno && prev && !processoEncerrado(p) && !p.dataTermino ? ` <span class="fraco" title="Pela mediana histórica do módulo">(histórico)</span>` : ""}</dd></div>
        ${campoDl("Última alteração do processo", p.dataAtualizacao && fmtData(p.dataAtualizacao))}
        ${def.extras.filter((e) => !e.chave.endsWith("Id")).map((e) => campoDl(e.rotulo, e.tipo === "data" ? (p.extras[e.chave] && fmtData(p.extras[e.chave])) : p.extras[e.chave])).join("")}
        ${p.comentarios ? campoDl("Comentários", p.comentarios, true) : ""}
      </dl>${cartaoUltima(modulo, p)}`;
    detalhe = `${cabDetalhe({ selos: selosProcesso(p), titulo: p.titulo, sub: subTerreno(p), botoes: botoesProcesso(p),
      abas: [["dados", "Dados do processo"], ["linha", "Linha do tempo", andamentosDe(modulo, p.id).length]], abaAtiva: aba })}<div class="corpo-det">${corpo}</div>`;
    ligarDet = () => { ligarAbas(); ligarBotoesProcesso(p, `#/licenciamento/${modulo}`); };
  }
  const md = mestreDetalhe({
    tela: `org:${modulo}`, titulo: o.titulo, subtitulo: def.descricao, imagem: o.img,
    trilha: `<a href="#/licenciamento">Licenciamento</a> / ${esc(def.sigla)}`,
    acoesTopo: `<a class="btn" href="#/licenciamento">${icone("voltar")} Voltar ao Licenciamento</a>${podeEditar() ? `<button class="btn prim" data-acao="novo-proc" data-mod="${modulo}">${icone("mais")} Novo processo</button>` : ""}`,
    kpis, buscaPlaceholder: "Pesquisar terreno ou processo", selId,
    itens: ps.map((x) => itemProcesso(x, `#/licenciamento/${modulo}/${x.id}`)),
    detalhe, vazioLista: "Nenhum processo encontrado. Ajuste a busca, o filtro de concessionária ou o card de situação.",
  });
  aoMontar(() => { md.ligar(); ligarDet(); });
  return md.html;
}
