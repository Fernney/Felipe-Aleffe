<style>/* =====================================================================
   Central de Diligenciamento · Design system 2.0 (mesmos tokens do Power Apps)
   Paleta por concessão: JOPE (geral) · INOVA BH · SAÚDE BH — diurno e noturno
   ===================================================================== */
:root {
  --p: #6F3B8C; --p-preench: #6F3B8C; --p-escura: #5A2E72; --sec: #3266AF; --acento: #12A9A2; --neutro-m: #737373;
  --gA: #6F3B8C; --gB: #3266AF; --gC: #12A9A2;
  --fundo: #F6F5F9; --fundo-suave: #FBFAFD; --cartao: #FFFFFF; --linha: #E6E3EC; --linha-campo: #D8D3E0;
  --texto: #1F1A26; --texto-2: #5E5868; --texto-3: #8D8796; --menu-ativo: #F0E8F6; --sel: #F7F2FA;
  --p-suave: rgba(111, 59, 140, .1); --veu: rgba(111, 59, 140, .06);
  --ok: #0B6B66; --ok-f: #E1F4F2; --info: #234C85; --info-f: #E7EEF8; --aviso: #8A5300; --aviso-f: #FDF1DE;
  --perigo: #B3261E; --perigo-f: #FCECEB; --neutro: #606064; --neutro-f: #F0F0F2; --na: #8C8C92; --na-f: #FAFAFB;
  --inova: #0D5A55; --inova-f: #E3F0EE; --saude: #6E368C; --saude-f: #EFE6F5;
  --raio: 16px; --raio-b: 12px; --sombra: 0 1px 2px rgba(30, 20, 40, .04), 0 8px 24px rgba(30, 20, 40, .05);
  --fonte: "Segoe UI Variable Text", "Segoe UI", "Open Sans", system-ui, sans-serif;
  --fonte-t: "Segoe UI Variable Display", "Segoe UI Semibold", "Segoe UI", "Open Sans", system-ui, sans-serif;
  color-scheme: light;
}
[data-marca="inova"] { --p: #0D5A55; --p-preench: #0D5A55; --p-escura: #08403C; --sec: #4F7F0E; --acento: #95C11F; --neutro-m: #706F6F;
  --gA: #0D5A55; --gB: #2E8A6E; --gC: #95C11F; --fundo: #F4F7F6; --fundo-suave: #FAFCFB; --linha: #DFE8E6; --linha-campo: #CFDAD8;
  --texto: #14211F; --texto-2: #596664; --menu-ativo: #E3F0EE; --sel: #F0F7F5; --p-suave: rgba(13, 90, 85, .1); --veu: rgba(13, 90, 85, .06); }
[data-marca="saude"] { --p: #6E368C; --p-preench: #6E368C; --p-escura: #4C2C84; --sec: #4C2C84; --acento: #8E5DB8; --neutro-m: #4D4D4D;
  --gA: #4C2C84; --gB: #6E368C; --gC: #A877CC; --fundo: #F6F4F9; --fundo-suave: #FBFAFD; --linha: #E5E0EC; --linha-campo: #D6CFE0;
  --texto: #1E1A24; --texto-2: #4D4D4D; --menu-ativo: #EFE6F5; --sel: #F6F1FA; --p-suave: rgba(110, 54, 140, .1); --veu: rgba(110, 54, 140, .06); }
[data-tema="escuro"] { --p: #C9A3E3; --p-preench: #7E4AA6; --p-escura: #9B6FC0; --sec: #7FA6E8; --acento: #3CC7BF; --neutro-m: #9A9A9A;
  --gA: #7E4AA6; --gB: #3E73C4; --gC: #1BB8B0; --fundo: #0F0E13; --fundo-suave: #15141B; --cartao: #1A1820; --linha: #2C2935; --linha-campo: #3A3644;
  --texto: #EEEBF3; --texto-2: #ABA5B6; --texto-3: #827C8D; --menu-ativo: #2E2340; --sel: #241C30; --p-suave: rgba(201, 163, 227, .16); --veu: rgba(201, 163, 227, .1);
  --ok: #78D7CD; --ok-f: #163C3A; --info: #8CB4F0; --info-f: #1C2D4B; --aviso: #F0C36E; --aviso-f: #463414; --perigo: #F58C82; --perigo-f: #4B1E1C;
  --neutro: #AFAAB6; --neutro-f: #2C2A32; --na: #827D8A; --na-f: #1E1C24; --inova: #6CCFC4; --inova-f: #173A37; --saude: #CFA8E8; --saude-f: #33234A;
  --sombra: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark; }
[data-tema="escuro"][data-marca="inova"] { --p: #6CCFC4; --p-preench: #137A72; --p-escura: #3FA79C; --sec: #B3DA5E; --acento: #A6D23A;
  --gA: #137A72; --gB: #2E9A7A; --gC: #95C11F; --fundo: #0B1211; --fundo-suave: #101817; --cartao: #141D1C; --linha: #243230; --linha-campo: #30403E;
  --texto: #E8F1EF; --texto-2: #A2B3B0; --menu-ativo: #173A37; --sel: #132D2B; --p-suave: rgba(108, 207, 196, .16); --veu: rgba(108, 207, 196, .1); }
[data-tema="escuro"][data-marca="saude"] { --p: #CFA8E8; --p-preench: #7D45A3; --p-escura: #A27BC9; --sec: #A794E0; --acento: #B992DC;
  --gA: #5A3596; --gB: #7D45A3; --gC: #B07FD6; --fundo: #100D15; --fundo-suave: #16121C; --cartao: #1B1622; --linha: #2E2738; --linha-campo: #3B3347;
  --texto: #EFEAF4; --texto-2: #B0A8BA; --menu-ativo: #33234A; --sel: #271C35; --p-suave: rgba(207, 168, 232, .16); --veu: rgba(207, 168, 232, .1); }

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--fundo); color: var(--texto); font: 14px/1.5 var(--fonte); -webkit-font-smoothing: antialiased; transition: background .25s; }
a { color: var(--p); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { font-family: var(--fonte-t); margin: 0; line-height: 1.25; }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 17px; font-weight: 650; }
h3 { font-size: 14px; font-weight: 650; }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }
.mudo { color: var(--texto-2); }
.fraco { color: var(--texto-3); font-size: 12px; }
.rot-mai { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--texto-3); }
.oculto { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- carga ---------- */
.tela-carga { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 12px; color: var(--texto-2); }
.giro { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--linha); border-top-color: var(--p); animation: gira .8s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }

/* ---------- login (Tela 1 - Login) ---------- */
.login { min-height: 100vh; display: grid; grid-template-columns: 56% 1fr; background: var(--fundo); }
.login-arte { background: linear-gradient(135deg, var(--gA) 0%, var(--gB) 60%, var(--gC) 100%); color: #fff; padding: 56px 64px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.login-arte::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.12) 1.2px, transparent 1.2px); background-size: 28px 28px; }
.login-arte::after { content: ""; position: absolute; right: -80px; top: -60px; width: 340px; height: 340px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.28), transparent 70%); }
.login-arte > * { position: relative; z-index: 1; }
.login-arte .tag { display: inline-block; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.25); padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; margin-bottom: 18px; }
.login-arte h1 { font-size: 40px; max-width: 520px; line-height: 1.12; }
.login-arte ul { list-style: none; padding: 0; margin: 30px 0 0; display: grid; gap: 16px; max-width: 470px; }
.login-arte li { display: flex; gap: 14px; align-items: center; font-size: 15px; }
.login-arte li span { flex: none; width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,.18); display: grid; place-items: center; }
.login-arte li svg { width: 18px; height: 18px; }
.login-arte .logo-branco { height: 72px; width: auto; align-self: flex-start; }
.login-cartao { display: grid; place-items: center; padding: 32px; }
.login-cartao > .cartao { width: min(420px, 100%); padding: 32px; display: grid; gap: 14px; }

/* ---------- estrutura (cabeçalho em cartão + menu em cartão) ---------- */
.app { padding: 16px; display: grid; gap: 14px; min-height: 100vh; align-content: start; }
.cab { position: relative; background: var(--cartao); border-radius: var(--raio); box-shadow: var(--sombra); display: flex; align-items: center; gap: 14px; padding: 12px 18px 16px; overflow: hidden; }
.cab::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, var(--gA), var(--gB) 55%, var(--gC)); }
.cab .logo { height: 40px; width: auto; flex: none; }
[data-tema="escuro"] .cab .logo { filter: brightness(0) invert(1); opacity: .9; }
.cab .titulo { border-left: 1px solid var(--linha); padding-left: 16px; min-width: 0; }
.cab .titulo b { font: 700 18px var(--fonte-t); display: block; }
.cab .titulo span { font-size: 12px; color: var(--texto-2); }
.cab .espaco { flex: 1; }
.selo-marca { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--p-suave); color: var(--p); font-weight: 600; font-size: 12px; white-space: nowrap; }
.selo-marca::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--p); }
.ic-btn { position: relative; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; border: 0; background: transparent; color: var(--texto-2); cursor: pointer; flex: none; }
.ic-btn:hover { background: var(--veu); color: var(--p); }
.ic-btn.ativo { background: var(--menu-ativo); color: var(--p); }
.ic-btn svg { width: 20px; height: 20px; }
.ic-btn .badge { position: absolute; top: 2px; right: 0; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px; background: #E8AA3C; color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--cartao); }
.ic-btn .badge.alta { background: #D9534A; }
.avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--gA), var(--gC)); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; border: 2px solid var(--cartao); box-shadow: 0 0 0 2px var(--p); cursor: pointer; flex: none; }
.corpo-app { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 14px; align-items: start; }
.corpo-app.recolhido { grid-template-columns: 72px minmax(0, 1fr); }
.menu { background: var(--cartao); border-radius: var(--raio); box-shadow: var(--sombra); padding: 12px 10px; display: grid; gap: 4px; position: sticky; top: 16px; }
.menu a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; color: var(--texto); font-weight: 500; position: relative; white-space: nowrap; }
.menu a:hover { background: var(--veu); text-decoration: none; }
.menu a.ativo { background: var(--menu-ativo); color: var(--p); font-weight: 650; }
.menu a.ativo::before { content: ""; position: absolute; left: -10px; top: 9px; bottom: 9px; width: 4px; border-radius: 0 4px 4px 0; background: var(--p); }
.menu a svg { width: 21px; height: 21px; flex: none; color: var(--texto-2); }
.menu a .ic-img { width: 28px; height: 28px; object-fit: contain; flex: none; border-radius: 7px; background: #fff; padding: 2px; }
.titulo-img { display: inline-flex; align-items: center; gap: 12px; }
.titulo-img img { width: 44px; height: 44px; object-fit: contain; border-radius: 12px; background: #fff; padding: 4px; box-shadow: var(--sombra); flex: none; }
.menu a.ativo svg { color: var(--p); }
.menu a b { margin-left: auto; font-size: 11px; background: #D9534A; color: #fff; border-radius: 999px; padding: 0 7px; }
.recolhido .menu a span, .recolhido .menu a b, .recolhido .menu .rodape { display: none; }
.recolhido .menu a { justify-content: center; }
.menu .rodape { border-top: 1px solid var(--linha); margin-top: 6px; padding: 10px 12px 2px; font-size: 11px; color: var(--texto-3); }
.conteudo { min-width: 0; display: grid; gap: 14px; align-content: start; }
.barra-filtros { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; align-items: center; }
.faixa-demo { background: var(--aviso-f); color: var(--aviso); padding: 8px 14px; border-radius: 12px; font-size: 13px; font-weight: 600; }
.pagina { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-content: start; }
.cabeca { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.cabeca p { margin: 4px 0 0; }
.cabeca > div:first-child { flex: 1 1 360px; min-width: 0; }
.trilha { font-size: 12px; color: var(--texto-3); margin-bottom: 4px; }
.trilha a { color: var(--texto-2); }

/* pílulas de concessão e origem */
.pilulas { display: inline-flex; background: var(--cartao); border: 1px solid var(--linha); border-radius: 999px; padding: 3px; }
.pilulas button { border: 0; background: transparent; padding: 6px 16px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--texto-2); }
.pilulas button.ativo { color: #fff; }
.pilulas button[data-v="todas"].ativo { background: #6F3B8C; }
.pilulas button[data-v="inova"].ativo { background: #0D5A55; }
.pilulas button[data-v="saude"].ativo { background: #6E368C; }
.multi { position: relative; }
.multi > .btn { min-width: 170px; justify-content: space-between; }
.multi .lista-multi { position: absolute; right: 0; top: 42px; z-index: 30; min-width: 220px; padding: 6px; }
.multi label { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
.multi label:hover { background: var(--veu); }

/* ---------- componentes ---------- */
.cartao { background: var(--cartao); border: 1px solid var(--linha); border-radius: var(--raio); box-shadow: var(--sombra); }
.cartao.pad { padding: 18px; }
.cartao > .titulo { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--linha); }
.cartao > .corpo { padding: 16px 18px; }
.grade { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-lado { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { padding: 16px 18px; display: grid; gap: 4px; position: relative; text-align: left; color: inherit; font: inherit; }
button.kpi { cursor: pointer; transition: transform .12s, box-shadow .12s; }
button.kpi:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(30, 20, 40, .1); }
.kpi .t { font-weight: 600; font-size: 13px; color: var(--texto-2); padding-right: 40px; }
.kpi b { font: 700 30px/1.05 var(--fonte-t); font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--texto-3); }
.kpi .sig { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 10px; background: var(--p-suave); color: var(--p); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.kpi .sig svg { width: 18px; height: 18px; }
.kpi.ativo { background: linear-gradient(135deg, var(--gA), var(--gB)); color: #fff; border-color: transparent; }
.kpi.ativo .t, .kpi.ativo .s { color: rgba(255,255,255,.85); }
.kpi.ativo .sig { background: rgba(255,255,255,.2); color: #fff; }
.kpi.kpi-alerta b { color: var(--perigo); }
.kpi.ativo.kpi-alerta b { color: #fff; }
.btn { display: inline-flex; align-items: center; gap: 7px; border-radius: var(--raio-b); padding: 8px 14px; font-weight: 600; font-size: 13px; border: 1px solid var(--linha); background: var(--cartao); cursor: pointer; white-space: nowrap; color: var(--texto); }
.btn:hover { border-color: var(--p); color: var(--p); text-decoration: none; }
.btn.prim { background: var(--p-preench); border-color: var(--p-preench); color: #fff; }
.btn.prim:hover { filter: brightness(1.1); color: #fff; }
.btn.perigo { color: var(--perigo); }
.btn.perigo:hover { border-color: var(--perigo); background: var(--perigo-f); }
.btn.perigo.cheio { background: #B3261E; border-color: #B3261E; color: #fff; }
.btn.fant { border-color: transparent; background: transparent; color: var(--texto-2); }
.btn.fant:hover { background: var(--veu); color: var(--p); }
.btn.peq { padding: 5px 10px; font-size: 12px; border-radius: 10px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }
.btn img { width: 18px; height: 18px; }
.campo, select.campo, textarea.campo { width: 100%; border: 1px solid var(--linha-campo); background: var(--cartao); border-radius: 10px; padding: 8px 11px; outline: none; }
.campo:focus { border-color: var(--p); box-shadow: 0 0 0 3px var(--p-suave); }
.campo:disabled { opacity: .7; background: var(--fundo-suave); }
textarea.campo { min-height: 84px; resize: vertical; }
label.rot { display: grid; gap: 5px; font-size: 12px; font-weight: 600; color: var(--texto-2); align-content: start; }
.form { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form .largo { grid-column: 1 / -1; }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filtros .campo { width: auto; min-width: 160px; }
.busca-campo { position: relative; }
.busca-campo svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--texto-3); }
.busca-campo .campo { padding-left: 34px; }
.resultados { position: absolute; top: 44px; left: 0; right: 0; background: var(--cartao); border: 1px solid var(--linha); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.18); max-height: 380px; overflow: auto; z-index: 40; padding: 6px; min-width: 300px; }
.resultados a { display: block; padding: 8px 10px; border-radius: 8px; color: var(--texto); }
.resultados a:hover, .resultados a.foco { background: var(--veu); text-decoration: none; }
.selo { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.selo::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.selo.sem::before { display: none; }
.s-Concluído { color: var(--ok); background: var(--ok-f); }
.s-Em-andamento { color: var(--info); background: var(--info-f); }
.s-Aguardando { color: var(--aviso); background: var(--aviso-f); }
.s-Bloqueado { color: var(--perigo); background: var(--perigo-f); }
.s-Não-iniciado { color: var(--neutro); background: var(--neutro-f); }
.s-Não-se-aplica, .s-Referência { color: var(--na); background: var(--na-f); outline: 1px dashed var(--linha); }
.r-Alto { color: var(--perigo); background: var(--perigo-f); }
.r-Médio { color: var(--aviso); background: var(--aviso-f); }
.r-Baixo { color: var(--ok); background: var(--ok-f); }
.u-inova { color: var(--inova); background: var(--inova-f); }
.u-saude { color: var(--saude); background: var(--saude-f); }
.vazio { padding: 28px; text-align: center; color: var(--texto-3); }
.vazio img { width: 84px; opacity: .85; display: block; margin: 0 auto 10px; border-radius: 12px; }

/* tabelas */
.tabela-env { overflow: auto; }
table.tabela { width: 100%; border-collapse: collapse; font-size: 13px; }
.tabela th { text-align: left; font-weight: 700; color: var(--texto-3); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; padding: 10px 12px; border-bottom: 1px solid var(--linha); white-space: nowrap; background: var(--fundo-suave); }
.tabela td { padding: 9px 12px; border-bottom: 1px solid var(--linha); vertical-align: middle; }

<script>
"use strict";
// ---- src/lib/domain/datas.ts ----
const DIA = 86400000;
/** Hoje como yyyy-mm-dd no fuso de Brasília. */
function hojeISO(agora = new Date()) {
    return new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo" }).format(agora);
}
function paraData(iso) {
    return new Date(iso.slice(0, 10) + "T00:00:00Z");
}
function somaDias(iso, dias) {
    return new Date(paraData(iso).getTime() + dias * DIA).toISOString().slice(0, 10);
}
/** Diferença em dias (b − a). */
function diffDias(a, b) {
    return Math.round((paraData(b).getTime() - paraData(a).getTime()) / DIA);
}
function fmtData(iso) {
    if (!iso)
        return "—";
    const [y, m, d] = iso.slice(0, 10).split("-");
    return `${d}/${m}/${y}`;
}
function fmtDataHora(iso) {
    if (!iso)
        return "—";
    return new Intl.DateTimeFormat("pt-BR", {
        timeZone: "America/Sao_Paulo",
        dateStyle: "short",
        timeStyle: "short",

function normalizarStatus(situacao) {
    const s = (situacao ?? "").trim().toLowerCase();
    if (!s)
        return "Não iniciado";
    if (CONCLUIDOS.includes(s))
        return "Concluído";
    if (BLOQUEADOS.includes(s))
        return "Bloqueado";
    if (AGUARDANDO.includes(s))
        return "Aguardando";
    if (NAO_INICIADOS.includes(s))
        return "Não iniciado";
    return "Em andamento";

    const s = statusProcesso(p);
    return s === "Concluído" || s === "Bloqueado";

function statusProcesso(p, hoje) {
    if (p.modulo === "ambiental" && p.extras.reciboDefinitivo)
        return "Concluído";
    if (p.modulo === "baixa") {
        const prog = p.extras.programacaoBaixa;
        if (prog && (!hoje || prog <= hoje))
            return "Concluído";
        if (p.extras.comunicadoTermino)
            return "Aguardando";
        if (p.extras.inicioObra)
            return "Em andamento";

    }

    return base.terrenos.map((t) => {
        const procs = idx.porTerreno.get(t.id) ?? [];
        const fluxo = idx.fluxos.get(t.id);
        const apl = aplicabilidade(fluxo);
        const modulos = {};
        const aAbrir = [];
        const conflitos = [];
        for (const m of [...MODULOS_MATRIZ, "armbh"]) {
            const doModulo = procs.filter((p) => p.modulo === m);
            const status = agregarStatus(doModulo.map((p) => statusProcesso(p, hoje)));
            const aplicavel = apl?.[m];
            let situacao = "neutro";
            if (MODULOS_TRAVA.includes(m) && apl) {
                if (aplicavel === true && !doModulo.length) {
                    situacao = "a-abrir";
                    aAbrir.push(m);
                }
                else if (aplicavel === false && doModulo.length) {
                    situacao = "conflito";
                    conflitos.push(m);
                }
                else
                    situacao = "ok";
            }
            modulos[m] = { status, aplicavel, qtd: doModulo.length, situacao };
        }
        // Etapa do empreendimento pelos processos cadastrados
        const baixa = procs.find((p) => p.modulo === "baixa");
        const ativo = (m) => procs.some((p) => m.includes(p.modulo) && ["Em andamento", "Aguardando"].includes(statusProcesso(p, hoje)));
        let etapa = "Não informado";
        if (baixa?.dataTermino && baixa.dataTermino <= hoje)
            etapa = "Operação";
        else if (baixa?.dataTermino || baixa?.extras.inicioObra)
            etapa = "Obra";
        else if (ativo(["parcelamento", "armbh"]))
            etapa = "Parcelamento do Solo";
        else if (ativo(["dipc", "cindacta", "gelin", "geava", "amtt", "alvara", "outros"]))
            etapa = "Licenciamento";
        // Progresso: módulos exigidos já concluídos
        const exigidos = apl
            ? Object.entries(apl).filter(([m, v]) => v && m !== "baixa").map(([m]) => m)
            : MODULOS_MATRIZ.filter((m) => modulos[m].qtd > 0 && m !== "baixa");
        const concluidos = exigidos.filter((m) => modulos[m]?.status === "Concluído").length;
        const progresso = exigidos.length ? concluidos / exigidos.length : 0;
        // Risco 0..100 com explicação
        const meus = alertasPorTerreno.get(t.id) ?? [];
        const altos = meus.filter((a) => a.alta).length;
        const motivos = [];
        let risco = 0;
        if (altos) {
            risco += Math.min(45, altos * 15);
            motivos.push(`${altos} alerta(s) crítico(s)`);
        }
        const normais = meus.length - altos;
        if (normais) {
            risco += Math.min(20, normais * 5);
            motivos.push(`${normais} alerta(s) de atenção`);
        }
        const bloqueados = MODULOS_MATRIZ.filter((m) => modulos[m].status === "Bloqueado");
        if (bloqueados.length) {
            risco += bloqueados.length * 20;
            motivos.push(`Bloqueado em ${bloqueados.map((m) => MODULOS[m].sigla).join(", ")}`);
        }
        if (aAbrir.length) {
            risco += aAbrir.length * 8;
            motivos.push(`${aAbrir.length} processo(s) exigido(s) não aberto(s)`);
        }
        if (conflitos.length) {
            risco += conflitos.length * 10;
            motivos.push(`${conflitos.length} conflito(s) com o fluxograma`);
        }
        if (!fluxo) {
            risco += 10;
            motivos.push("Fluxograma não respondido");
        }
        // Liberação prevista = maior previsão entre processos exigidos ainda abertos
        let liberacao = null;
        for (const p of procs) {
            if (p.modulo === "baixa" || processoEncerrado(p))
                continue;
            if (apl && apl[p.modulo] === false)
                continue;
            const prev = previsaoConclusao(p, meds);
            if (prev && (!liberacao || prev > liberacao))
                liberacao = prev;
        }
        if (liberacao && t.prazoLiberacao && liberacao > t.prazoLiberacao) {
            risco += 15;
            motivos.push(`Previsão (${fmtData(liberacao)}) após o prazo de liberação (${fmtData(t.prazoLiberacao)})`);
        }
        risco = Math.min(100, risco);
        return {
            terreno: t,
            fluxoRespondido: !!fluxo,
            modulos,
            aAbrir,
            conflitos,
            etapa,
            progresso,
            risco,
            nivelRisco: risco >= 55 ? "Alto" : risco >= 25 ? "Médio" : "Baixo",
            motivosRisco: motivos,
            liberacaoPrevista: liberacao,
            alertas: meus.length,
            alertasAltos: altos,
        };
    });
}
function gerarAlertas(base, hoje, op = {}) {
    const diasAviso = op.diasAvisoLinhaDoTempo ?? 15;
    const diasParado = op.diasProcessoParado ?? 60;
    const idx = indexar(base);
    const out = [];
    const add = (a) => {
        const t = a.terrenoId != null ? idx.terrenos.get(a.terrenoId) : undefined;
        const { chave, ...resto } = a;
        out.push({ ...resto, id: `${a.tipo}:${chave}`, terreno: t?.nome ?? "Terreno não vinculado", unidade: t?.unidade ?? null });
    };
    const hrefProc = (p) => `/processos/${p.modulo}/${p.id}`;
    const em = (d) => somaDias(hoje, d);
    for (const p of base.processos) {
        const st = statusProcesso(p, hoje);
        const aberto = st !== "Concluído" && st !== "Bloqueado";
        // 1) Diretrizes de parcelamento vencendo em 90 dias
        const venc = p.extras.vencimentoDiretrizes;
        if (p.modulo === "parcelamento" && venc && venc <= em(90) && st !== "Concluído") {
            add({
                chave: `parc-${p.id}`, tipo: "Diretrizes de parcelamento", terrenoId: p.terrenoId, modulo: "parcelamento",
                data: venc, alta: venc < hoje, href: hrefProc(p),
                detalhe: `${venc < hoje ? "Vencidas em" : "Vencem em"} ${fmtData(venc)} · ${p.titulo}`,
            });
        }
        // 1b) Validade das diretrizes ARMBH (novo)
        const valArmbh = p.extras.validadeDiretrizes;
        if (p.modulo === "armbh" && valArmbh && valArmbh <= em(90) && aberto) {
            add({
                chave: `armbh-${p.id}`, tipo: "Validade das diretrizes ARMBH", terrenoId: p.terrenoId, modulo: "armbh",
                data: valArmbh, alta: valArmbh < hoje, href: hrefProc(p),
                detalhe: `${valArmbh < hoje ? "Vencida em" : "Vence em"} ${fmtData(valArmbh)} · SEI ${p.titulo}`,
            });
        }
        // 2) Data limite de protocolo em 30 dias (o app original fazia só para DIPC; agora vale para todos)
        if (p.dataLimiteProtocolo && aberto && p.dataLimiteProtocolo <= em(30) && st !== "Em andamento") {
            add({
                chave: `lim-${p.modulo}-${p.id}`, tipo: "Data limite de protocolo", terrenoId: p.terrenoId, modulo: p.modulo,
                data: p.dataLimiteProtocolo, alta: p.dataLimiteProtocolo < hoje, href: hrefProc(p),
                detalhe: `${MODULOS[p.modulo].sigla} · ${p.dataLimiteProtocolo < hoje ? "vencida em" : "limite em"} ${fmtData(p.dataLimiteProtocolo)}`,
            });
        }
        // 3) Termo de compromisso ambiental em 60 dias sem recibo definitivo
        const prazoTermo = p.extras.prazoTermo;
        if (p.modulo === "ambiental" && prazoTermo && prazoTermo <= em(60) && !p.extras.reciboDefinitivo && st !== "Concluído") {
            add({
                chave: `termo-${p.id}`, tipo: "Termo de compromisso", terrenoId: p.terrenoId, modulo: "ambiental",
                data: prazoTermo, alta: prazoTermo < hoje, href: hrefProc(p),
                detalhe: `${prazoTermo < hoje ? "Prazo vencido em" : "Prazo em"} ${fmtData(prazoTermo)} · ${p.titulo}`,
            });
        }
        // 6) Baixa: obra concluída sem comunicado de término
        if (p.modulo === "baixa" && p.dataTermino && p.dataTermino <= hoje && !p.extras.comunicadoTermino) {
            const dias = diffDias(p.dataTermino, hoje);
            add({
                chave: `baixa-${p.id}`, tipo: "Comunicado de término pendente", terrenoId: p.terrenoId, modulo: "baixa",
                data: p.dataTermino, alta: dias > 30, href: hrefProc(p),
                detalhe: `Obra concluída em ${fmtData(p.dataTermino)} · há ${dias} dias sem comunicado`,
            });
        }
    }
    // 4) Condicionantes ambientais
    const ambPorId = new Map(base.processos.filter((p) => p.modulo === "ambiental").map((p) => [p.id, p]));
    for (const c of base.condicionantes) {
        if (!c.prazo || normalizarStatus(c.status) === "Concluído")
            continue;
        const amb = c.ambientalId != null ? ambPorId.get(c.ambientalId) : undefined;
        const href = amb ? `/processos/ambiental/${amb.id}` : "/processos/ambiental";
        if (c.prazo < hoje) {
            add({ chave: `cond-${c.id}`, tipo: "Condicionante vencida", terrenoId: amb?.terrenoId ?? null, modulo: "ambiental",
                data: c.prazo, alta: true, href, detalhe: `Item ${c.item ?? "?"} · prazo ${fmtData(c.prazo)}` });
        }
        else if (c.prazo <= em(7)) {
            add({ chave: `cond-${c.id}`, tipo: "Condicionante a vencer", terrenoId: amb?.terrenoId ?? null, modulo: "ambiental",
                data: c.prazo, alta: false, href, detalhe: `Item ${c.item ?? "?"} · vence em ${fmtData(c.prazo)} (${diffDias(hoje, c.prazo)} dias)` });
        }
    }
    // 5) Relatórios de monitoramento
    for (const r of base.relatorios) {
        if (r.real || !r.prevista)
            continue;
        const amb = r.ambientalId != null ? ambPorId.get(r.ambientalId) : undefined;
        const href = amb ? `/processos/ambiental/${amb.id}` : "/processos/ambiental";
        if (r.prevista < hoje) {
            add({ chave: `rel-${r.id}`, tipo: "Relatório atrasado", terrenoId: amb?.terrenoId ?? null, modulo: "ambiental",
                data: r.prevista, alta: true, href, detalhe: `${r.nome} · previsto ${fmtData(r.prevista)}` });
        }
        else if (r.prevista <= em(7)) {
            add({ chave: `rel-${r.id}`, tipo: "Relatório a vencer", terrenoId: amb?.terrenoId ?? null, modulo: "ambiental",
                data: r.prevista, alta: false, href, detalhe: `${r.nome} · previsto ${fmtData(r.prevista)} (${diffDias(hoje, r.prevista)} dias)` });
        }
    }
    // 7) Fluxograma: conflitos, processos a abrir e terrenos sem respostas
    for (const t of base.terrenos) {
        const apl = aplicabilidade(idx.fluxos.get(t.id));
        const href = `/terrenos/${t.id}`;
        if (!apl) {
            add({ chave: `semfluxo-${t.id}`, tipo: "Fluxograma não respondido", terrenoId: t.id, modulo: "fluxograma",
                data: hoje, alta: false, href: `${href}#fluxograma`, detalhe: "Responda as 8 perguntas para saber quais processos abrir" });
            continue;
        }
        const procs = idx.porTerreno.get(t.id) ?? [];
        const abrir = MODULOS_TRAVA.filter((m) => apl[m] === true && !procs.some((p) => p.modulo === m));
        const conflito = MODULOS_TRAVA.filter((m) => apl[m] === false && procs.some((p) => p.modulo === m));
        if (conflito.length)
            add({ chave: `conf-${t.id}`, tipo: "Conflito com o fluxograma", terrenoId: t.id, modulo: "fluxograma", data: hoje, alta: true, href,
                detalhe: `${conflito.map((m) => MODULOS[m].sigla).join(", ")} cadastrado(s), mas o fluxograma diz que não se aplica` });
        if (abrir.length)
            add({ chave: `abrir-${t.id}`, tipo: "Processo a abrir", terrenoId: t.id, modulo: "fluxograma", data: hoje, alta: false, href,
                detalhe: `Exigido(s) e ainda não cadastrado(s): ${abrir.map((m) => MODULOS[m].sigla).join(", ")}` });
    }
    // 8) Prazo de atendimento do último andamento + 9) processo parado
    const ultimo = new Map();
    for (const a of base.andamentos) {
        const k = `${a.modulo}:${a.processoId}`;
        const atual = ultimo.get(k);
        if (!atual || a.data > atual.data)
            ultimo.set(k, a);
    }
    for (const p of base.processos) {
        const st = statusProcesso(p, hoje);
        if (st === "Concluído" || st === "Bloqueado")
            continue;
        const u = ultimo.get(`${p.modulo}:${p.id}`);
        if (u?.prazoAtendimento) {
            if (u.prazoAtendimento < hoje)
                add({ chave: `lt-${p.modulo}-${p.id}`, tipo: "Prazo da linha do tempo vencido", terrenoId: p.terrenoId, modulo: p.modulo,
                    data: u.prazoAtendimento, alta: true, href: hrefProc(p),
                    detalhe: `${MODULOS[p.modulo].sigla} · "${u.acao}" venceu em ${fmtData(u.prazoAtendimento)}` });
            else if (u.prazoAtendimento <= em(diasAviso))
                add({ chave: `lt-${p.modulo}-${p.id}`, tipo: "Prazo da linha do tempo a vencer", terrenoId: p.terrenoId, modulo: p.modulo,
                    data: u.prazoAtendimento, alta: false, href: hrefProc(p),
                    detalhe: `${MODULOS[p.modulo].sigla} · "${u.acao}" vence em ${fmtData(u.prazoAtendimento)}` });
        }
        const ultimaMov = [u?.data?.slice(0, 10), p.dataAtualizacao, p.dataInicio].filter(Boolean).sort().pop();
        if (st !== "Não iniciado" && ultimaMov && diffDias(ultimaMov, hoje) > diasParado)
            add({ chave: `parado-${p.modulo}-${p.id}`, tipo: "Processo parado", terrenoId: p.terrenoId, modulo: p.modulo,
                data: ultimaMov, alta: false, href: hrefProc(p),
                detalhe: `${MODULOS[p.modulo].sigla} · sem movimentação há ${diffDias(ultimaMov, hoje)} dias` });
    }
    return out.sort((a, b) => Number(b.alta) - Number(a.alta) || a.data.localeCompare(b.data));
}
function indicadores(base, resumos, alertas, hoje) {
    const vazio = () => ({
        Concluído: 0, "Em andamento": 0, Aguardando: 0, Bloqueado: 0, "Não iniciado": 0, "Não se aplica": 0,
    });
    const porStatus = vazio();
    const porModuloMap = new Map();
    let mudasCompensar = 0;
    let mudasPlantadas = 0;
    for (const p of base.processos) {
        const s = statusProcesso(p, hoje);
        porStatus[s]++;
        const m = porModuloMap.get(p.modulo) ?? vazio();
        m[s]++;
        porModuloMap.set(p.modulo, m);
        if (p.modulo === "ambiental") {
            mudasCompensar += Number(p.extras.mudasCompensar ?? 0);
            mudasPlantadas += Number(p.extras.mudasDpea ?? 0) + Number(p.extras.mudasGelin ?? 0);
        }
    }
    const porEtapa = { "Não informado": 0, "Parcelamento do Solo": 0, Licenciamento: 0, Obra: 0, Operação: 0 };
    for (const r of resumos)
        porEtapa[r.etapa]++;
    return {
        terrenos: resumos.length,
        processos: base.processos.length,
        abertos: porStatus["Em andamento"] + porStatus.Aguardando + porStatus["Não iniciado"],
        concluidos: porStatus.Concluído,
        bloqueados: porStatus.Bloqueado,
        alertas: alertas.length,
        alertasAltos: alertas.filter((a) => a.alta).length,
        riscoAlto: resumos.filter((r) => r.nivelRisco === "Alto").length,
        porStatus,
        porEtapa,
        porModulo: [...MODULOS_MATRIZ, "armbh"]
            .filter((m) => porModuloMap.has(m))
            .map((m) => ({ modulo: m, sigla: MODULOS[m].sigla, status: porModuloMap.get(m) })),
        mudasCompensar,
        mudasPlantadas,
    };
}
/** Recorta a base para uma unidade (INOVA / SAÚDE). */
function filtrarBase(base, f) {
    if (f === "todas")
        return base;
    const ids = new Set(base.terrenos.filter((t) => filtroCombina(f, t.unidade)).map((t) => t.id));
    const processos = base.processos.filter((p) => p.terrenoId != null && ids.has(p.terrenoId));
    const chaves = new Set(processos.map((p) => `${p.modulo}:${p.id}`));
    const ambIds = new Set(processos.filter((p) => p.modulo === "ambiental").map((p) => p.id));
    return {
        ...base,
        terrenos: base.terrenos.filter((t) => ids.has(t.id)),
        fluxos: base.fluxos.filter((f2) => ids.has(f2.terrenoId)),
        processos,
        condicionantes: base.condicionantes.filter((c) => c.ambientalId != null && ambIds.has(c.ambientalId)),
        relatorios: base.relatorios.filter((r) => r.ambientalId != null && ambIds.has(r.ambientalId)),
        andamentos: base.andamentos.filter((a) => chaves.has(`${a.modulo}:${a.processoId}`)),
    };
}

/** Todos os prazos futuros e vencidos em aberto, num só calendário. */
function eventosAgenda(base, hoje) {

    const out = [];
    const ultimoAndamento = new Map();
    for (const a of base.andamentos) {
        const k = `${a.modulo}:${a.processoId}`;

            ultimoAndamento.set(k, a);
    }

        const st = statusProcesso(p, hoje);

            continue;

        const sig = MODULOS[p.modulo].sigla;
        if (p.dataLimiteProtocolo)
            out.push({ data: p.dataLimiteProtocolo, titulo: `${sig} · limite de protocolo`, tipo: "Protocolo", terreno, href });
        if (p.previsaoRetorno)
            out.push({ data: p.previsaoRetorno, titulo: `${sig} · previsão de retorno`, tipo: "Retorno", terreno, href });

        const termo = p.extras.prazoTermo;
        if (termo && !p.extras.reciboDefinitivo)
            out.push({ data: termo, titulo: "Prazo do termo de compromisso", tipo: "Termo ambiental", terreno, href });
        const u = ultimoAndamento.get(`${p.modulo}:${p.id}`);
        if (u?.prazoAtendimento)
            out.push({ data: u.prazoAtendimento, titulo: `${sig} · ${u.acao}`, tipo: "Linha do tempo", terreno, href });
    }
    const amb = new Map(base.processos.filter((p) => p.modulo === "ambiental").map((p) => [p.id, p]));
    for (const c of base.condicionantes) {
        if (!c.prazo || /cumprid|conclu/i.test(c.status ?? ""))
            continue;
        const a = c.ambientalId != null ? amb.get(c.ambientalId) : undefined;
        out.push({ data: c.prazo, titulo: `Condicionante item ${c.item ?? "?"}`, tipo: "Condicionante", terreno: a?.terrenoId ? nome.get(a.terrenoId) ?? "" : "", href: a ? `/processos/ambiental/${a.id}` : "/processos/ambiental" });
    }
    for (const r of base.relatorios) {
        if (r.real || !r.prevista)
            continue;
        const a = r.ambientalId != null ? amb.get(r.ambientalId) : undefined;
        out.push({ data: r.prevista, titulo: r.nome, tipo: "Relatório", terreno: a?.terrenoId ? nome.get(a.terrenoId) ?? "" : "", href: a ? `/processos/ambiental/${a.id}` : "/processos/ambiental" });
    }
    for (const t of base.terrenos) {
        if (t.prazoLiberacao)
            out.push({ data: t.prazoLiberacao, titulo: "Prazo de liberação do terreno", tipo: "Liberação", terreno: t.nome, href: `/terrenos/${t.id}` });
    }
    return out.sort((a, b) => a.data.localeCompare(b.data));
}
/** Arquivo iCalendar para importar no Outlook / Google Agenda. */
function gerarIcs(eventos, urlBase) {
    const esc = (s) => s.replace(/\\/g, "\\\\").replace(/[,;]/g, (c) => `\\${c}`).replace(/\n/g, "\\n");
    const carimbo = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
    const linhas = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//JOPE//Central de Diligenciamento//PT-BR",
        "CALSCALE:GREGORIAN",
        "X-WR-CALNAME:Prazos · Central de Diligenciamento",
    ];
    eventos.forEach((e, i) => {
        const d = e.data.replace(/-/g, "");
        linhas.push("BEGIN:VEVENT", `UID:${d}-${i}-${e.href.replace(/\W/g, "")}@diligenciamento`, `DTSTAMP:${carimbo}`, `DTSTART;VALUE=DATE:${d}`, `SUMMARY:${esc(`${e.terreno ? `${e.terreno} · ` : ""}${e.titulo}`)}`, `DESCRIPTION:${esc(`${e.tipo} — ${urlBase}${e.href}`)}`, `URL:${urlBase}${e.href}`, "BEGIN:VALARM", "TRIGGER:-P2D", "ACTION:DISPLAY", `DESCRIPTION:${esc(e.titulo)}`, "END:VALARM", "END:VEVENT");
    });
    linhas.push("END:VCALENDAR");
    return linhas.join("\r\n");
}

function resolverVinculos(base) {
    const terrenoDe = new Map(base.processos.map((p) => [`${p.modulo}:${p.id}`, p.terrenoId]));
    const porNome = new Map(base.terrenos.map((t) => [chaveNome(t.nome), t.id]));
    const num = (v) => (v == null || v === "" ? null : Number(v));
    for (const p of base.processos) {

        }
        else if (p.modulo === "baixa") {
            p.terrenoId = terrenoDe.get(`alvara:${num(e.alvaraId)}`) ?? porNome.get(chaveNome(p.titulo)) ?? null;
        }
        else if (p.modulo === "armbh") {
            p.terrenoId = terrenoDe.get(`parcelamento:${num(e.parcelamentoId)}`) ?? null;

function chaveNome(s) {
    return s.replace(/_/g, " ").trim().toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
}

// o sistema sem credenciais do SharePoint. Os dados ficam em memória enquanto

function prng(seed) {
    let s = seed >>> 0;
    return () => {
        s = (s + 0x6d2b79f5) >>> 0;
        let t = s;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}
const BAIRROS = [
    "Jardim Leblon", "Vila Pinho", "Lagoinha", "Céu Azul", "Jaqueline", "Tupi", "Primeiro de Maio", "Barreiro de Cima",
    "Mantiqueira", "Serra Verde", "Itaipu", "Conjunto Paulo VI", "Granja de Freitas", "Taquaril", "Ribeiro de Abreu",
    "Santa Mônica", "Copacabana", "Novo Aarão Reis", "Olhos D'Água", "Califórnia", "Solimões", "Lindéia",
];
const REGIONAIS = ["Barreiro", "Centro-Sul", "Leste", "Nordeste", "Noroeste", "Norte", "Oeste", "Pampulha", "Venda Nova"];
const RESPONSAVEIS = ["Ana Souza", "Bruno Lima", "Carla Mendes", "Diego Rocha", "Felipe Aleffe"];
function gerar() {
    const r = prng(20261107);
    const hoje = hojeISO();
    const pick = (a) => a[Math.floor(r() * a.length)];
    const sn = (p) => (r() < p ? "Sim" : "Não");
    const dia = (min, max) => somaDias(hoje, Math.round(min + r() * (max - min)));

    const fluxos = [];

        const unidade = i % 2 === 0 ? "INOVA BH" : "SAÚDE BH";
        const prefixo = unidade === "INOVA BH" ? (i % 4 === 0 ? "EMEI" : "EM") : "CS";
        const id = i + 1;
        terrenos.push({
            id,
            nome: `${prefixo} ${bairro}`,
            unidade,
            origemDemanda: pick(["PPP Lote 1", "PPP Lote 2", "Aditivo", "Demanda PBH"]),
            responsavel: pick(RESPONSAVEIS),
            fase: pick(["Projeto", "Licenciamento", "Obra", "Operação"]),
            dataDisponibilidade: dia(-700, -200),
            previsaoEntrega: dia(120, 600),
            prazoLiberacao: dia(30, 300),
            regional: pick(REGIONAIS),
            endereco: {
                logradouro: `Rua ${pick(["das Acácias", "Padre Eustáquio", "Itaú", "Contorno", "Juramento", "Pitangui"])}`,
                numero: Math.round(50 + r() * 1800),
                complemento: null,
                bairro,
                cidade: "Belo Horizonte",
                uf: "MG",
                cep: `3${Math.round(1000 + r() * 8999)}-${Math.round(100 + r() * 899)}`,
            },
        });
        if (i % 7 !== 6) {
            fluxos.push({
                id: id,
                terrenoId: id,
                parcelado: sn(0.55),
                armbh: sn(0.3),
                cultural: sn(0.25),
                altura: sn(0.2),
                relevancia: sn(0.25),
                supressao: sn(0.5),
                movTerra: sn(0.6),
                eas: unidade === "SAÚDE BH" ? "Sim" : "Não",
            });
        }
    });
    const processos = [];
    const andamentos = [];
    let pid = 100;
    let aid = 1;
    const SIT = ["Não Iniciada", "Em análise", "Em análise", "Aguardando documentação", "Pendente", "Aprovado", "Aprovado", "Aprovado", "Reprovado"];
    const novo = (modulo, terrenoId, extras = {}, forcarSit) => {
        const situacao = forcarSit ?? pick(SIT);
        const inicio = dia(-500, -20);
        const concluido = ["Aprovado", "Dispensado"].includes(situacao);
        const p = {
            id: pid++,
            modulo,
            terrenoId,
            titulo: `${MODULOS[modulo].sigla}-${2025 + Math.floor(r() * 2)}/${String(Math.floor(r() * 9000) + 1000)}`,
            situacao,
            acao: pick(["Protocolar", "Acompanhar análise", "Responder exigência", "Aguardar retorno", "Emitir documento"]),
            dataInicio: inicio,
            dataLimiteProtocolo: situacao === "Não Iniciada" || situacao === "Aguardando documentação" ? dia(-10, 45) : null,
            previsaoRetorno: concluido ? null : r() < 0.6 ? dia(-20, 160) : null,
            dataAtualizacao: dia(-120, 0),
            dataTermino: concluido ? somaDias(inicio, Math.round(60 + r() * 220)) : null,
            link: null,
            comentarios: r() < 0.4 ? pick(["Aguardando parecer da PBH.", "Exigência técnica respondida.", "Reunião agendada com o órgão.", "Documentação complementar enviada."]) : null,
            extras,
        };
        if (p.dataTermino && p.dataTermino > hoje)
            p.dataTermino = dia(-30, -1);
        processos.push(p);
        // Linha do tempo
        const n = 1 + Math.floor(r() * 4);
        for (let k = 0; k < n; k++) {
            const quando = somaDias(inicio, 5 + k * 30 + Math.round(r() * 10));
            andamentos.push({
                id: aid++,
                modulo,
                processoId: p.id,
                acao: pick(["Protocolo realizado", "Exigência recebida", "Resposta enviada", "Vistoria agendada", "Análise em curso", "Reunião técnica"]),
                comentario: r() < 0.5 ? "Registro gerado na base de demonstração." : null,
                data: `${quando > hoje ? hoje : quando}T${String(9 + k).padStart(2, "0")}:00:00.000Z`,
                prazoAtendimento: k === n - 1 && !concluido && r() < 0.6 ? dia(-12, 40) : null,
                usuario: pick(RESPONSAVEIS),
            });
        }
        return p;
    };
    for (const t of terrenos) {
        const f = fluxos.find((x) => x.terrenoId === t.id);
        const apl = aplicabilidade(f) ?? { parcelamento: r() < 0.5, dipc: r() < 0.3, alvara: true };
        let alvara = null;
        let geava = null;
        let gelin = null;
        if (apl.parcelamento) {
            const parc = novo("parcelamento", t.id, {
                vencimentoDiretrizes: dia(-30, 200),
                faseProcesso: pick(["Diretrizes", "Projeto", "Aprovação", "Registro"]),
                modalidade: pick(["Loteamento", "Desmembramento", "Reparcelamento"]),
                requerArmbh: apl.armbh ? "Sim" : "Não",
            });
            if (apl.armbh)
                novo("armbh", null, {
                    parcelamentoId: parc.id,
                    anuencia: pick(["Solicitada", "Emitida", "Pendente"]),
                    diretrizes: pick(["Emitidas", "Em análise"]),
                    numeroAnuencia: null,
                    validadeDiretrizes: dia(-15, 240),
                });
        }
        if (apl.dipc)
            novo("dipc", t.id, { requerPatrimonio: "Sim" });
        if (apl.cindacta)
            novo("cindacta", t.id, { preAnalise: "Sim", situacaoPreAnalise: pick(["Favorável", "Em análise"]) });
        if (apl.gelin)
            gelin = novo("gelin", t.id, { tipoAmbiental: "Licenciamento" });
        if (apl.geava)
            geava = novo("geava", t.id, { tipoAmbiental: "Supressão" });
        if (apl.amtt)
            novo("amtt", t.id, { volumeBotaFora: Math.round(r() * 4000), volumeEmprestimo: Math.round(r() * 2000), tipoProcesso: "Autorização" });
        if (r() < 0.75)
            alvara = novo("alvara", t.id, { numeroAlvara: r() < 0.5 ? `ALV-${Math.floor(r() * 99999)}` : null });
        if (r() < 0.25)
            novo("outros", t.id, { processo: pick(["COPASA - viabilidade", "CEMIG - carga", "BHTrans - impacto"]) });
        // Conflito proposital em um terreno (para demonstrar a trava)
        if (t.id === 5 && !apl.cindacta)
            novo("cindacta", t.id, {}, "Em análise");
        if (geava || gelin) {
            const tipo = gelin ? "Relevância Ambiental" : "Compensação";
            const amb = novo("ambiental", null, {
                tipo,
                geavaId: geava?.id ?? null,
                gelinId: gelin?.id ?? null,
                parecer: `PT-${Math.floor(r() * 900) + 100}/2025`,
                prazoTermo: dia(-20, 300),
                reciboDefinitivo: r() < 0.2 ? dia(-60, -1) : null,
                arvoresSuprimidas: Math.round(r() * 60),
                mudasCompensar: Math.round(40 + r() * 400),
                mudasDpea: Math.round(r() * 120),
                mudasGelin: Math.round(r() * 80),
            });
            amb.titulo = `Ambiental · ${t.nome}`;
        }
        if (alvara && alvara.situacao === "Aprovado" && r() < 0.7) {
            const ini = dia(-400, -100);
            const fim = r() < 0.6 ? dia(-90, -3) : null;
            novo("baixa", null, {
                alvaraId: alvara.id,
                inicioObra: ini,
                comunicadoTermino: fim && r() < 0.4 ? somaDias(fim, 5) : null,
                programacaoBaixa: null,
            }).dataTermino = fim;
        }
    }
    // Ajusta títulos da baixa
    for (const p of processos.filter((x) => x.modulo === "baixa"))
        p.titulo = `Baixa ${p.titulo.split("-")[1]}`;
    const ambientais = processos.filter((p) => p.modulo === "ambiental");
    const condicionantes = ambientais.flatMap((a, i) => [1, 2, 3].map((k) => ({
        id: i * 10 + k,
        ambientalId: a.id,
        item: `${k}`,
        condicionante: pick(["Plantio compensatório", "Relatório fotográfico", "Cercamento da APP", "Monitoramento de fauna"]),
        prazo: dia(-30, 120),
        status: pick(["Pendente", "Em andamento", "Cumprida"]),
        observacao: null,
    })));
    const relatorios = ambientais.flatMap((a, i) => [1, 2].map((k) => ({
        id: i * 10 + k,
        ambientalId: a.id,
        nome: `Relatório de monitoramento ${k}`,
        prevista: dia(-40, 60),
        real: r() < 0.4 ? dia(-60, -1) : null,
    })));
    return resolverVinculos({
        terrenos,
        fluxos,
        processos,
        condicionantes,
        relatorios,
        andamentos,
        usuarios: [
            { id: 1, nome: "Administrador Demo", email: "admin@demo.local", perfil: "Administrador" },
            { id: 2, nome: "Editor Demo", email: "editor@demo.local", perfil: "Editor" },
            { id: 3, nome: "Consulta Demo", email: "consulta@demo.local", perfil: "Consulta" },
        ],
        geradoEm: new Date().toISOString(),
        origem: "demo",
    });
}

// =====================================================================
// Núcleo: configuração, utilitários, login Microsoft (PKCE) e estado.
// =====================================================================

const VERSAO = "1.0.0";
const LS = {
  config: "cd.config",
  tokens: "cd.tokens",
  tema: "cd.tema",
  filtro: "cd.filtro",
  modo: "cd.modo",
  demo: "cd.demo.base",
  demoPerfil: "cd.demo.perfil",
};

const armazem = {
  ler(k, padrao = null) {
    try { const v = localStorage.getItem(k); return v == null ? padrao : JSON.parse(v); } catch { return padrao; }
  },
  gravar(k, v) {
    try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch { /* navegador sem armazenamento */ }
  },
};

function configAtual() {
  const base = window.CD_CONFIG || {};
  const local = armazem.ler(LS.config, {}) || {};
  const c = { ...base };
  for (const k of ["clientId", "tenantId", "site"]) if (local[k]) c[k] = local[k];
  return c;
}
function configCompleta(c = configAtual()) {
  return !!(c.clientId && c.tenantId && c.site);
}

const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
function esc(v) { return v == null ? "" : String(v).replace(/[&<>"']/g, (c) => ESC[c]); }
const $ = (sel, raiz = document) => raiz.querySelector(sel);
const $$ = (sel, raiz = document) => [...raiz.querySelectorAll(sel)];
function classeStatus(s) { return "s-" + String(s || "Não iniciado").replace(/ /g, "-"); }
function seloStatus(s) { return s ? `<span class="selo ${classeStatus(s)}">${esc(s)}</span>` : `<span class="fraco">—</span>`; }
function seloUnidade(u) {
  if (!u) return `<span class="fraco">—</span>`;
  return `<span class="selo sem ${u === "INOVA BH" ? "u-inova" : "u-saude"}">${esc(u)}</span>`;
}
function seloRisco(r) { return `<span class="selo r-${r.nivelRisco}" title="${esc(r.motivosRisco.join(" · ") || "Sem pontos de risco")}">${r.risco} · ${r.nivelRisco}</span>`; }
function iniciais(nome) {
  const p = String(nome || "?").trim().split(/\s+/);
  return ((p[0]?.[0] || "") + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase();
}
function normalizar(s) { return String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function relativo(iso) {
  const s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return "agora";
  if (s < 3600) return `há ${Math.round(s / 60)} min`;
  if (s < 86400) return `há ${Math.round(s / 3600)} h`;
  return fmtDataHora(iso);
}
function diasAte(iso) {
  if (!iso) return null;
  return diffDias(hojeISO(), iso);
}
function textoPrazo(iso) {
  const d = diasAte(iso);
  if (d == null) return "";
  if (d < 0) return `vencido há ${-d} dia(s)`;
  if (d === 0) return "vence hoje";
  return `em ${d} dia(s)`;
}

  const fundo = raiz.firstElementChild;

  if (primeiro) setTimeout(() => primeiro.focus(), 30);

function baixarArquivo(nome, conteudo, tipo) {
  const blob = new Blob([conteudo], { type: tipo });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
/** CSV no formato do Excel brasileiro (separador ";" e BOM UTF-8). */
function baixarCsv(nome, cabecalho, linhas) {
  const cel = (v) => {
    const s = v == null ? "" : String(v);
    return /[";\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const txt = [cabecalho, ...linhas].map((l) => l.map(cel).join(";")).join("\r\n");
  baixarArquivo(nome, "﻿" + txt, "text/csv;charset=utf-8");
}

// =====================================================================
// Login Microsoft — Authorization Code + PKCE, sem biblioteca externa.
// Funciona com a página aberta direto ou dentro do SharePoint (iframe):
// dentro do iframe o login abre numa janela pop-up.
// =====================================================================
const ESCOPOS = "openid profile offline_access User.Read Sites.ReadWrite.All Mail.Send";

const auth = {
  redirectUri() { return location.origin + location.pathname; },
  emIframe() { try { return window.self !== window.top; } catch { return true; } },
  endpoint(c, tipo) { return `https://login.microsoftonline.com/${encodeURIComponent(c.tenantId)}/oauth2/v2.0/${tipo}`; },

  async desafio() {
    const bytes = crypto.getRandomValues(new Uint8Array(48));
    const verifier = b64url(bytes);
    const hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
    return { verifier, challenge: b64url(new Uint8Array(hash)) };
  },

  async urlLogin(prompt) {
    const c = configAtual();
    const { verifier, challenge } = await this.desafio();
    const state = b64url(crypto.getRandomValues(new Uint8Array(16)));
    // localStorage (e não sessionStorage) para a janela pop-up enxergar o verificador
    armazem.gravar("cd.pkce", { verifier, state, criado: Date.now() });
    const p = new URLSearchParams({
      client_id: c.clientId,
      response_type: "code",
      redirect_uri: this.redirectUri(),
      response_mode: "query",
      scope: ESCOPOS,
      code_challenge: challenge,
      code_challenge_method: "S256",
      state,
    });
    if (prompt) p.set("prompt", prompt);
    return `${this.endpoint(c, "authorize")}?${p}`;
  },

  async entrar() {
    const url = await this.urlLogin("select_account");
    if (!this.emIframe()) { location.assign(url); return; }
    const w = 520, h = 640;
    const popup = window.open(url, "cd-login", `width=${w},height=${h},left=${(screen.width - w) / 2},top=${(screen.height - h) / 2}`);
    if (!popup) throw new Error("O navegador bloqueou a janela de login. Libere pop-ups para este endereço ou abra o app em tela cheia.");
    // Mesmo método do MSAL: a página que abriu acompanha o endereço do pop-up e,
    // quando ele volta para este site com ?code=, lê a resposta e fecha a janela.
    // Assim o código é trocado aqui, onde está o verificador PKCE (importante
    // dentro do iframe do SharePoint, cujo armazenamento é separado do pop-up).
    const params = await new Promise((ok, falha) => {
      const inicio = Date.now();
      const fim = setInterval(() => {
        if (popup.closed) { clearInterval(fim); falha(new Error("Login cancelado.")); return; }
        if (Date.now() - inicio > 5 * 60 * 1000) { clearInterval(fim); popup.close(); falha(new Error("Tempo de login esgotado.")); return; }
        let href = "";
        try { href = popup.location.href; } catch { return; } // ainda no site da Microsoft
        if (!href.startsWith(location.origin)) return;
        const q = new URL(href).searchParams;
        if (!q.has("code") && !q.has("error")) return;
        clearInterval(fim);
        popup.close();
        ok(q);
      }, 250);
    });
    await this.concluir(params);
  },

  async concluir(q) {
    if (q.has("error")) throw new Error(q.get("error_description")?.split("\n")[0] || q.get("error"));
    const pk = armazem.ler("cd.pkce");
    if (!pk || pk.state !== q.get("state")) throw new Error("Resposta de login inválida. Tente entrar de novo.");
    armazem.gravar("cd.pkce", null);
    await this.trocarCodigo(q.get("code"), pk.verifier);
  },

  /**
   * Trata o retorno do login (?code=...).
   * "popup": esta janela é o pop-up; quem a abriu lê a resposta, aqui não se faz nada.
   */
  async tratarRetorno() {
    const q = new URLSearchParams(location.search);
    if (!q.has("code") && !q.has("error")) return "nada";
    if (window.name === "cd-login") return "popup";
    history.replaceState(null, "", location.pathname + location.hash);
    try { await this.concluir(q); return "ok"; } catch (e) { aviso(e.message, "erro"); return "erro"; }
  },

  async pedirToken(corpo) {
    const c = configAtual();
    const r = await fetch(this.endpoint(c, "token"), {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ client_id: c.clientId, scope: ESCOPOS, ...corpo }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error_description?.split("\r\n")[0] || j.error || "Falha ao obter token");
    armazem.gravar(LS.tokens, {
      access: j.access_token,
      refresh: j.refresh_token,
      expira: Date.now() + (j.expires_in - 120) * 1000,
    });
    return j.access_token;
  },

  trocarCodigo(code, verifier) {
    return this.pedirToken({ grant_type: "authorization_code", code, redirect_uri: this.redirectUri(), code_verifier: verifier });
  },

  _renovando: null,
  async token() {
    const t = armazem.ler(LS.tokens);
    if (!t) throw new ErroSessao("Sessão não iniciada.");
    if (t.access && Date.now() < t.expira) return t.access;
    if (!t.refresh) throw new ErroSessao("Sessão expirada.");
    this._renovando ??= this.pedirToken({ grant_type: "refresh_token", refresh_token: t.refresh })
      .catch(() => { armazem.gravar(LS.tokens, null); throw new ErroSessao("Sessão expirada. Entre novamente."); })
      .finally(() => { this._renovando = null; });
    return this._renovando;
  },

  logado() { return !!armazem.ler(LS.tokens); },
  sair() { armazem.gravar(LS.tokens, null); },
};
class ErroSessao extends Error {}

function b64url(bytes) {
  let s = "";
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

/** Recorta a base pela concessão (pílulas) e pela origem da demanda. */
function recortar(base) {
  let b = filtrarBase(base, estado.filtro);
  const ids = new Set(b.terrenos.map((t) => t.id));
  if (estado.origens.length) {
    const sel = new Set(estado.origens);
    for (const t of b.terrenos) if (!sel.has(t.origemDemanda ?? "(sem origem)")) ids.delete(t.id);
    const processos = b.processos.filter((p) => p.terrenoId != null && ids.has(p.terrenoId));
    const chaves = new Set(processos.map((p) => `${p.modulo}:${p.id}`));
    const amb = new Set(processos.filter((p) => p.modulo === "ambiental").map((p) => p.id));
    b = {
      ...b,
      terrenos: b.terrenos.filter((t) => ids.has(t.id)),
      fluxos: b.fluxos.filter((f) => ids.has(f.terrenoId)),
      processos,
      condicionantes: b.condicionantes.filter((c) => amb.has(c.ambientalId)),
      relatorios: b.relatorios.filter((r) => amb.has(r.ambientalId)),
      andamentos: b.andamentos.filter((a) => chaves.has(`${a.modulo}:${a.processoId}`)),
    };
  }
  b.lotes = (base.lotes || []).filter((l) => l.terrenoId != null && ids.has(l.terrenoId));
  return b;
}

function recalcular() {
  estado.hoje = hojeISO();
  const b = recortar(estado.base);
  estado.recorte = b;
  estado.alertasTodos = gerarAlertas(estado.base, estado.hoje);
  estado.alertas = gerarAlertas(b, estado.hoje);
  estado.resumos = consolidar(b, estado.hoje, estado.alertas);
  estado.mapaResumo = new Map(estado.resumos.map((r) => [r.terreno.id, r]));
  estado.resumosTodos = consolidar(estado.base, estado.hoje, estado.alertasTodos);
  estado.mapaResumoTodos = new Map(estado.resumosTodos.map((r) => [r.terreno.id, r]));
  estado.terrenoPorId = new Map(estado.base.terrenos.map((t) => [t.id, t]));
  estado.processoPorChave = new Map(estado.base.processos.map((p) => [`${p.modulo}:${p.id}`, p]));
  estado.medianas = duracoesMedianas(estado.base);
}

function aplicarAparencia() {
  const html = document.documentElement;
  html.dataset.tema = estado.tema;
  html.dataset.marca = estado.filtro;
}

/** Converte os endereços usados pelas regras ("/processos/dipc/12") para as rotas deste app. */
function linkPara(href) {
  const p = String(href || "").replace(/^#?\/?/, "").split("/");
  if (p[0] === "terrenos") return p[1] ? `#/terrenos/${p[1]}` : "#/terrenos";
  if (p[0] === "processos") {
    const [, mod, id] = p;
    if (!mod) return "#/licenciamento";
    if (mod === "armbh") {
      const a = id && estado.processoPorChave?.get(`armbh:${id}`);
      return a?.extras.parcelamentoId ? `#/parcelamento/${a.extras.parcelamentoId}?aba=armbh` : "#/parcelamento";
    }
    if (mod === "parcelamento") return id ? `#/parcelamento/${id}` : "#/parcelamento";
    if (mod === "ambiental") return id ? `#/ambiental/${id}` : "#/ambiental";
    if (mod === "baixa") return id ? `#/baixa/${id}` : "#/baixa";
    return id ? `#/licenciamento/${mod}/${id}` : `#/licenciamento/${mod}`;
  }
  return `#/${p.join("/")}`;
}

  const m = (re, g = "v") => { const r = t.match(re); return r ? (r.groups?.[g] ?? r[1] ?? null) : null; };

  if (b.length >= 3) {
