# Central de Diligenciamento · Tela "Agenda" (container dentro de scrHome)
# Copie a partir da linha "- Tela_Agenda:" e cole sobre scrHome no Power Apps Studio.
# Depende de: colAgenda e varMesAgenda (03-btnDashCarregar…), tokens de cor (01-App.Formulas).
- Tela_Agenda:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      Fill: =corFundo
      Height: =Parent.Height - Self.Y - 16
      Visible: =varMenuSelecionado = "Agenda"
      Width: =Parent.Width - galMenu.Width - 45
      X: =galMenu.Width + 28
      Y: =129
    Children:
      - lblAgTitulo:
          Control: ModernText@1.0.0
          Properties:
            Color: =corTexto
            Font: =fontePadrao
            FontWeight: =FontWeight.Bold
            Height: =40
            Size: =20
            Text: ="Agenda de prazos"
            Width: =Parent.Width - 420
            X: =8
      - lblAgSub:
          Control: ModernText@1.0.0
          Properties:
            Color: =corTextoSecundario
            Font: =fontePadrao
            Height: =24
            Size: =9
            Text: ="Protocolos, retornos, diretrizes, termos ambientais e prazos de liberação · " & CountRows(Filter(colAgenda, Data >= Today() && Data <= DateAdd(Today(), 30, TimeUnit.Days))) & " prazo(s) nos próximos 30 dias"
            Width: =Parent.Width - 420
            X: =8
            Y: =32
      - btnAgAnterior:
          Control: ModernButton@1.0.0
          Properties:
            Appearance: =ButtonAppearance.Outline
            BasePaletteColor: =corPrimariaPreench
            Color: =corTextoSecundario
            Font: =fontePadrao
            Height: =34
            Icon: =Icon.ChevronLeft
            Layout: =ButtonLayout.IconOnly
            OnSelect: =Set(varMesAgenda, DateAdd(varMesAgenda, -1, TimeUnit.Months))
            Text: ="Mês anterior"
            Width: =40
            X: =lblAgMes.X - Self.Width - 4
            Y: =12
      - lblAgMes:
          Control: ModernText@1.0.0
          Properties:
            Align: =Align.Center
            Color: =corPrimaria
            Font: =fontePadrao
            FontWeight: =FontWeight.Bold
            Height: =34
            Size: =13
            Text: =Proper(Text(varMesAgenda, "mmmm 'de' yyyy", "pt-BR"))
            VerticalAlign: =VerticalAlign.Middle
            Width: =190
            X: =btnAgProximo.X - Self.Width - 4
            Y: =12
      - btnAgProximo:
          Control: ModernButton@1.0.0
          Properties:
            Appearance: =ButtonAppearance.Outline
            BasePaletteColor: =corPrimariaPreench
            Color: =corTextoSecundario
            Font: =fontePadrao
            Height: =34
            Icon: =Icon.ChevronRight
            Layout: =ButtonLayout.IconOnly
            OnSelect: =Set(varMesAgenda, DateAdd(varMesAgenda, 1, TimeUnit.Months))
            Text: ="Próximo mês"
            Width: =40
            X: =btnAgHoje.X - Self.Width - 8
            Y: =12
      - btnAgHoje:
          Control: ModernButton@1.0.0
          Properties:
            Appearance: =ButtonAppearance.Primary
            BasePaletteColor: =corPrimariaPreench
            Font: =fontePadrao
            Height: =34
            OnSelect: =Set(varMesAgenda, Date(Year(Today()), Month(Today()), 1))
            Text: ="Hoje"
            Width: =70
            X: =Parent.Width - Self.Width - 8
            Y: =12
      - contAgCalendario:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =corBorda
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =corCartao
            Height: =Parent.Height - Self.Y - 8
            RadiusBottomLeft: =raioCartao
            RadiusBottomRight: =raioCartao
            RadiusTopLeft: =raioCartao
            RadiusTopRight: =raioCartao
            Width: =(Parent.Width - 24) * 0.66
            X: =8
            Y: =68
          Children:
            - galAgDiasSemana:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  Height: =28
                  Items: =["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"]
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =28
                  Width: =Parent.Width - 16
                  WrapCount: =7
                  X: =8
                  Y: =8
                Children:
                  - lblAgDiaSemana:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        Color: =corTextoSecundario
                        Font: =fontePadrao
                        FontWeight: =FontWeight.Bold
                        Height: =Parent.TemplateHeight
                        Size: =8
                        Text: =Upper(ThisItem.Value)
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Parent.TemplateWidth
            - galAgCalendario:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  Height: =Parent.Height - Self.Y - 8
                  Items: |-
                    =With(
                        {inicio: DateAdd(varMesAgenda, -(Weekday(varMesAgenda) - 1), TimeUnit.Days)},
                        ForAll(Sequence(42, 0) As n, {Dia: DateAdd(inicio, n.Value, TimeUnit.Days)})
                    )
                  ShowScrollbar: =false
                  TemplatePadding: =2
                  TemplateSize: =(Self.Height - 14) / 6
                  Width: =Parent.Width - 16
                  WrapCount: =7
                  X: =8
                  Y: =40
                Children:
                  - lblAgCelula:
                      Control: ModernText@1.0.0
                      Properties:
                        Fill: =If(ThisItem.Dia = Today(), corMenuAtivo, Month(ThisItem.Dia) <> Month(varMesAgenda), corFundoSuave, corCartao)
                        Height: =Parent.TemplateHeight
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: =""
                        Width: =Parent.TemplateWidth
                  - lblAgNumeroDia:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Right
                        Color: =If(ThisItem.Dia = Today(), corPrimaria, Month(ThisItem.Dia) <> Month(varMesAgenda), corBordaCampo, corTextoSecundario)
                        Font: =fontePadrao
                        FontWeight: =If(ThisItem.Dia = Today(), FontWeight.Bold, FontWeight.Normal)
                        Height: =18
                        Size: =8
                        Text: =Day(ThisItem.Dia)
                        Width: =Parent.TemplateWidth - 8
                        X: =4
                        Y: =2
                  - lblAgEventos:
                      Control: ModernText@1.0.0
                      Properties:
                        Color: =If(CountRows(Filter(colAgenda, Data = ThisItem.Dia && Data < Today())) > 0, corPerigo, corTexto)
                        Font: =fontePadrao
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.TemplateHeight - 22
                        Size: =7
                        Text: |-
                          =With(
                              {evs: Sort(Filter(colAgenda, Data = ThisItem.Dia), Terreno)},
                              Concat(FirstN(evs, 3), "• " & Coalesce(Terreno, Titulo), Char(10)) &
                              If(CountRows(evs) > 3, Char(10) & "+" & (CountRows(evs) - 3) & " prazo(s)", "")
                          )
                        Width: =Parent.TemplateWidth - 8
                        Wrap: =true
                        X: =4
                        Y: =20
                  - hv_galAgCalendario:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =Parent.TemplateHeight
                        HoverFill: =corHoverVeu
                        OnSelect: =Set(varDiaAgenda, ThisItem.Dia)
                        PressedFill: =corPressVeu
                        Text: =""
                        Width: =Parent.TemplateWidth
      - contAgLista:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =corBorda
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =corCartao
            Height: =contAgCalendario.Height
            RadiusBottomLeft: =raioCartao
            RadiusBottomRight: =raioCartao
            RadiusTopLeft: =raioCartao
            RadiusTopRight: =raioCartao
            Width: =Parent.Width - contAgCalendario.Width - 24
            X: =contAgCalendario.X + contAgCalendario.Width + 8
            Y: =contAgCalendario.Y
          Children:
            - lblAgListaTitulo:
                Control: ModernText@1.0.0
                Properties:
                  Color: =corTexto
                  Font: =fontePadrao
                  FontWeight: =FontWeight.Bold
                  Height: =30
                  Size: =12
                  Text: =If(IsBlank(varDiaAgenda), "Próximos 30 dias", "Prazos de " & Text(varDiaAgenda, "dd/mm/yyyy"))
                  Width: =Parent.Width - 90
                  X: =12
                  Y: =10
            - btnAgListaLimpar:
                Control: ModernButton@1.0.0
                Properties:
                  Appearance: =ButtonAppearance.Subtle
                  BasePaletteColor: =corPrimariaPreench
                  Color: =corTextoSecundario
                  Font: =fontePadrao
                  Height: =28
                  OnSelect: =Set(varDiaAgenda, Blank())
                  Text: ="Todos"
                  Visible: =!IsBlank(varDiaAgenda)
                  Width: =70
                  X: =Parent.Width - Self.Width - 8
                  Y: =10
            - galAgLista:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  Height: =Parent.Height - Self.Y - 8
                  Items: |-
                    =Sort(
                        If(
                            IsBlank(varDiaAgenda),
                            Filter(colAgenda, Data >= DateAdd(Today(), -30, TimeUnit.Days) && Data <= DateAdd(Today(), 30, TimeUnit.Days)),
                            Filter(colAgenda, Data = varDiaAgenda)
                        ),
                        Data
                    )
                  TemplatePadding: =0
                  TemplateSize: =58
                  Width: =Parent.Width - 8
                  X: =4
                  Y: =46
                Children:
                  - lblAgListaCor:
                      Control: ModernText@1.0.0
                      Properties:
                        Fill: =Switch(ThisItem.Tipo, "Protocolo", corPerigo, "Retorno", corAzul, "Diretrizes", corPrimaria, "Termo ambiental", corSucesso, "Liberação", corPrimariaEscura, corCinza)
                        Height: =10
                        RadiusBottomLeft: =5
                        RadiusBottomRight: =5
                        RadiusTopLeft: =5
                        RadiusTopRight: =5
                        Text: =""
                        Width: =10
                        X: =10
                        Y: =14
                  - lblAgListaTerreno:
                      Control: ModernText@1.0.0
                      Properties:
                        Color: =corTexto
                        Font: =fontePadrao
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        Size: =10
                        Text: =Coalesce(ThisItem.Terreno, "Sem terreno")
                        Width: =Parent.TemplateWidth - 120
                        X: =28
                        Y: =6
                  - lblAgListaTitulo2:
                      Control: ModernText@1.0.0
                      Properties:
                        Color: =corTextoSecundario
                        Font: =fontePadrao
                        Height: =20
                        Size: =8
                        Text: =ThisItem.Tipo & " · " & ThisItem.Titulo
                        Width: =Parent.TemplateWidth - 120
                        X: =28
                        Y: =28
                  - lblAgListaData:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Right
                        Color: =If(ThisItem.Data < Today(), corPerigo, DateDiff(Today(), ThisItem.Data, TimeUnit.Days) <= 7, corAviso, corTextoSecundario)
                        Font: =fontePadrao
                        FontWeight: =If(ThisItem.Data <= DateAdd(Today(), 7, TimeUnit.Days), FontWeight.Bold, FontWeight.Normal)
                        Height: =44
                        Size: =8
                        Text: |-
                          =Text(ThisItem.Data, "dd/mm/yyyy") & Char(10) &
                          With({d: DateDiff(Today(), ThisItem.Data, TimeUnit.Days)}, If(d < 0, -d & "d atrás", d = 0, "hoje", "em " & d & "d"))
                        Width: =96
                        Wrap: =true
                        X: =Parent.TemplateWidth - Self.Width - 10
                        Y: =6
                  - rectAgListaLinha:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =corBorda
                        Height: =1
                        Width: =Parent.TemplateWidth - 20
                        X: =10
                        Y: =Parent.TemplateHeight - 1
